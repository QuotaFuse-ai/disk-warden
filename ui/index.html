<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disk Warden</title>
<style>
/* ============================================================
   Disk Warden — 360 安全卫士风格 / 桌面客户端布局
   竖版导航 + 竖向列表 Tab + 固定工具栏，弱化网页感。
   ============================================================ */
:root{
  --green:#3fbf44; --green-dark:#2fa838; --green-deep:#238b2c;
  --green-soft:#eef8ed; --green-line:#d5ecd3;
  --bg:#f4f6f7; --panel:#ffffff; --panel-2:#fafbfc;
  --line:#e3e7eb; --line-soft:#edf0f3;
  --text:#2f3439; --text-2:#5b646d; --muted:#7d8791; --dim:#98a2ac;
  --blue:#2f8bf5; --blue-2:#1d74dc; --red:#e5484d; --amber:#d98500;
  --violet:#7c5cff;
  --radius:5px; --radius-sm:3px;
  --shadow:0 12px 30px rgba(31,45,61,.16);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",-apple-system,"Segoe UI",sans-serif;
  background:var(--bg); color:var(--text); overflow:hidden; font-size:12px; line-height:1.5;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue);text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#c7cfd6;border-radius:4px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#aeb8c0}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid #7fd383;outline-offset:1px;border-radius:3px}

.app{display:flex;flex-direction:column;height:100vh;min-width:1080px;background:var(--bg)}

/* ---------- 顶部绿色导航 ---------- */
.topnav{
  height:88px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 16px;
  background:linear-gradient(180deg,#4dca52 0%,#41c046 55%,#39b23f 100%);color:#fff;
  position:relative;z-index:30;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 1px 4px rgba(26,90,34,.16);
}
.brand{width:172px;flex-shrink:0;display:flex;align-items:center;gap:9px;min-width:0}
.brand-badge{
  width:34px;height:34px;flex-shrink:0;border-radius:9px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.38);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22);
}
.brand-badge svg{width:21px;height:21px}
.brand-text{min-width:0}
.brand-name{font-size:15px;font-weight:700;letter-spacing:.2px;line-height:1.2;white-space:nowrap}
.brand-sub{font-size:9.5px;color:rgba(255,255,255,.84);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;align-items:center;gap:4px;height:100%;flex:1;min-width:0}
.nav-item{
  width:86px;height:76px;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  border:none;background:transparent;color:#fff;border-radius:8px;position:relative;
  transition:background .12s;font-size:11.5px;white-space:nowrap;
}
.nav-item:hover{background:rgba(255,255,255,.13)}
.nav-item.active{background:rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.nav-item.active::after{content:"";position:absolute;left:50%;bottom:4px;transform:translateX(-50%);width:16px;height:2px;border-radius:2px;background:#fff;opacity:.92}
.nav-ico{
  width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  color:#fff;background:linear-gradient(135deg,var(--ico-1,#63b8ff),var(--ico-2,#2f8bf5));
  box-shadow:0 1px 3px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.32);
  position:relative;flex-shrink:0;
}
.nav-ico svg{width:18px;height:18px}
.nav-ico .nav-count{
  position:absolute;top:-5px;right:-7px;min-width:15px;height:15px;padding:0 4px;border-radius:8px;
  background:#fff;color:#2f8e35;font-size:9px;font-weight:700;line-height:15px;text-align:center;
  box-shadow:0 1px 2px rgba(0,0,0,.2);
}
.nav-name{line-height:1}
.system{display:flex;align-items:center;gap:7px;margin-left:auto;padding-left:10px;flex-shrink:0}
.system-chip{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;height:26px;padding:0 10px;
  border-radius:13px;border:1px solid rgba(255,255,255,.34);background:rgba(255,255,255,.13);
  color:#fff;font-size:11px;white-space:nowrap;transition:background .12s;
}
.system-chip:hover{background:rgba(255,255,255,.27)}
.system-chip.icon{width:27px;padding:0;border-radius:50%}
.system-chip.icon svg{width:15px;height:15px}
.system-ver{font-size:10px;color:rgba(255,255,255,.75);margin-left:2px;white-space:nowrap}

/* ---------- 主区 ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.topbar{
  flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);z-index:5;
}
.topbar h1{font-size:16px;font-weight:700;color:#2f3439;line-height:1.3;letter-spacing:.2px}
.scan-meta{font-size:10.5px;color:var(--dim);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.scan-meta .live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
.top-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.main-scroll{flex:1;min-height:0;overflow-y:auto;padding:12px 16px 22px;background:var(--bg)}

/* ---------- 按钮 ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:6px 13px;border-radius:3px;
  font-size:11.5px;font-weight:400;border:1px solid transparent;line-height:1.2;
  transition:background .12s,border-color .12s,color .12s;white-space:nowrap;
}
.btn-primary{background:#3fbf44;color:#fff;border-color:#38b13e}
.btn-primary:hover{background:#35ac3a;border-color:#2fa336}
.btn-primary:active{background:#2fa838}
.btn-ghost{background:#fff;color:#4a545e;border-color:#d7dee4}
.btn-ghost:hover{background:#f6f8fa;border-color:#b9c4cc;color:#2f3439}
.btn-danger{background:#fff;color:#d9363e;border-color:#ecc0be}
.btn-danger:hover{background:#e5484d;border-color:#e5484d;color:#fff}
.btn-soft{background:var(--green-soft);color:#2f8f35;border-color:var(--green-line)}
.btn-soft:hover{background:#ddf3db}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-xs{padding:2px 7px;font-size:10px;border-radius:2px}
.btn[disabled],.btn.disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.25)}
.btn[disabled]:hover,.btn.disabled:hover{background:inherit;color:inherit;border-color:inherit}
.modal-foot .btn{padding:6px 16px}

.v-red{color:var(--red)} .v-blue{color:var(--blue)} .v-green{color:#2f8e35} .v-amber{color:var(--amber)} .v-violet{color:var(--violet)}

/* ---------- 内容与分栏 ---------- */
.content{display:flex;flex-direction:column;gap:12px;min-width:0}
.split-layout{display:grid;grid-template-columns:252px minmax(0,1fr);align-items:start;gap:12px;min-width:0}
.split-layout > .bar{min-width:0;padding:9px}
.split-layout > .panel{min-width:0}
.narrow{max-width:860px;width:100%;margin:0 auto}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:5px;min-width:0}
.panel-head{padding:10px 14px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel-head h2{font-size:13px;font-weight:700;color:#2f3439;display:flex;align-items:center;gap:7px}
.panel-head h2::before{content:"";width:3px;height:13px;border-radius:1px;background:var(--green);flex-shrink:0}
.panel-head .hint{font-size:10.5px;color:var(--dim)}
.panel-body{padding:12px 14px}
.toolbar{display:flex;gap:6px;align-items:center;margin-bottom:9px;flex-wrap:wrap}
.search{flex:1;min-width:100px;background:#fff;border:1px solid #d7dee4;border-radius:3px;padding:5px 8px;font-size:11px;color:var(--text);transition:border-color .12s}
.search::placeholder{color:#aab3bc}
.search:focus{outline:none;border-color:#7fd383}

.legend{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:10px;color:var(--muted)}
.legend .dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:3px}
.dot-green{background:var(--green)} .dot-red{background:var(--red)} .dot-amber{background:#f0a020} .dot-blue{background:var(--blue)} .dot-gray{background:#aab3bc}

/* 列表栏 */
.bar{background:#fff;border:1px solid var(--line);border-radius:5px;display:flex;flex-direction:column;gap:9px;min-width:0}
.bar-title{font-size:12.5px;font-weight:700;color:#2f3439;white-space:nowrap;display:flex;align-items:center;gap:6px}
.bar-title::before{content:"";width:3px;height:12px;border-radius:1px;background:var(--green);flex-shrink:0}
.bar-hint{font-size:10px;color:var(--dim);white-space:nowrap}
.chip-row{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.split-layout .bar-top{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 8px;min-width:0}
.split-layout .bar-top .bar-hint{text-align:right}
.split-layout .bar-top .search{grid-column:1/-1;width:100%;flex:none}
.split-layout .bar-top .chip-row{grid-column:1/-1}
.split-layout .bar-top .legend{grid-column:1/-1;margin-left:0;flex-direction:column;align-items:flex-start;gap:2px;font-size:10px;line-height:1.5}

/* 竖向 Tab 列表 */
.split-layout .ide-bar,
.split-layout .proj-bar,
.split-layout .hist-bar{display:flex;flex-direction:column;gap:1px;overflow:visible;padding-bottom:0}
.split-layout .ide-item,
.split-layout .proj-card,
.split-layout .hist-card{
  width:100%;min-width:0;flex:none;border-radius:3px;border:1px solid transparent;
  background:transparent;box-shadow:none;text-align:left;transition:background .12s,border-color .12s;
}
.split-layout .ide-item:hover,
.split-layout .proj-card:hover,
.split-layout .hist-card:hover{background:#f5f8fa;border-color:#e8edf1}
.split-layout .ide-item.active,
.split-layout .proj-card.active,
.split-layout .hist-card.active{background:var(--green-soft);border-color:var(--green-line);box-shadow:inset 3px 0 0 var(--green)}

.split-layout .ide-item{display:grid;grid-template-columns:26px minmax(0,1fr) auto;align-items:center;gap:8px;padding:6px 7px}
.split-layout .ide-top{display:contents}
.split-layout .ide-mark{width:26px;height:26px;font-size:10px;border-radius:5px}
.split-layout .ide-name{font-size:11.5px;font-weight:600;color:#33383d}
.split-layout .ide-sub{font-size:9.5px;color:var(--dim);margin-top:1px}
.split-layout .ide-foot{display:flex;flex-direction:column;align-items:flex-end;gap:2px;white-space:nowrap}
.split-layout .ide-size{font-size:10px;color:#4a545e}
.split-layout .ide-item .badge{font-size:9px;padding:0 4px;line-height:1.6}
.split-layout .run-dot{width:4px;height:4px;margin-right:2px}

.split-layout .proj-card{padding:7px 8px;gap:4px}
.split-layout .pc-name{font-size:11.5px;font-weight:600}
.split-layout .pc-path{font-size:9.5px}
.split-layout .pc-size{font-size:10px}
.split-layout .pc-foot .dim{display:none}
.split-layout .hist-card{padding:7px 8px;gap:4px}
.split-layout .hc-name{font-size:11.5px;font-weight:600}
.split-layout .hc-meta{font-size:9.5px}
.split-layout .hc-size{font-size:10px}

/* ---------- 徽标 ---------- */
.badge{display:inline-flex;align-items:center;gap:3px;font-size:9.5px;font-weight:600;padding:1px 5px;border-radius:2px;line-height:1.5;white-space:nowrap}
.b-green{background:#eaf7e8;color:#2f8e35;border:1px solid #d0eccd}
.b-red{background:#fff0ef;color:#d9363e;border:1px solid #f2c9c6}
.b-amber{background:#fff7e6;color:#c47b00;border:1px solid #f1dcaa}
.b-blue{background:#eef5ff;color:#1f6fd0;border:1px solid #cfe2fb}
.b-gray{background:#f2f4f6;color:#7d8791;border:1px solid #e1e6ea}
.b-violet{background:#f3efff;color:#6f4bd8;border:1px solid #ddd0fb}
.b-plain{background:#fff;color:var(--muted);border:1px solid #e1e6ea;font-weight:600}

.detail{display:flex;flex-direction:column;gap:14px;padding:16px 18px 18px}
.split-layout .detail{padding:14px 16px 16px}
.detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.detail-title{display:flex;align-items:center;gap:9px;min-width:0}
.detail-title > div{min-width:0}
.detail-title h2{font-size:16px;font-weight:700;color:#2f3439}
.detail-path{font-size:10.5px;color:var(--dim);font-family:Consolas,monospace;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(620px,60vw)}
.detail-badges{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;flex-shrink:0}

.banner{display:flex;gap:8px;padding:8px 10px;border-radius:3px;font-size:11px;line-height:1.55;border:1px solid}
.banner .b-ico{flex-shrink:0;font-size:13px;line-height:1.3}
.banner.warn{background:#fff9ea;border-color:#f1dcaa;color:#a86a00}
.banner.danger{background:#fff1f0;border-color:#f2c9c6;color:#c92f36}
.banner.info{background:#eff6ff;border-color:#cfe2fb;color:#1f6fd0}
.banner.ok{background:#f0faf0;border-color:#d0eccd;color:#2f8e35}
.banner b{font-weight:700}
.banner .btn{margin-top:5px}
.banner-actions{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}

.preview-card{background:#f7faf7;border:1px solid #e2eee0;border-radius:4px;padding:10px 12px}
.preview-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.preview-top .t{font-size:10.5px;font-weight:700;color:#2f8e35;letter-spacing:.3px}
.kv{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:11px;padding:2px 0}
.kv .k{color:var(--muted)}
.kv .v{font-family:Consolas,monospace;color:#2f3439;font-weight:600;text-align:right;word-break:break-all}
.kv .v.ok{color:#2f8e35}
.kv .v.warn{color:var(--amber)}

.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:1px}
.section-title h3{font-size:11px;font-weight:700;color:#4a545e;letter-spacing:.3px;display:flex;align-items:center;gap:6px}
.section-title h3::before{content:"";width:3px;height:12px;border-radius:1px;background:var(--green);flex-shrink:0}
.section-title .sub{font-size:10px;color:var(--dim)}
.rows{display:flex;flex-direction:column;gap:5px;min-width:0}
.row{display:flex;align-items:center;gap:9px;padding:7px 9px;background:var(--panel-2);border:1px solid #eef1f4;border-radius:3px}
.row:hover{background:#f7fafc;border-color:#e0e6eb}
.row.risk-green{box-shadow:inset 2px 0 0 var(--green)}
.row.risk-red{box-shadow:inset 2px 0 0 var(--red);background:#fdf7f7}
.row.risk-yellow{box-shadow:inset 2px 0 0 #f0a020}
.row-check{flex-shrink:0;width:14px;height:14px;accent-color:var(--green);cursor:pointer}
.row-main{flex:1;min-width:0}
.row-name{font-size:11.5px;font-weight:550;color:#33383d;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-desc{font-size:10px;color:var(--dim);margin-top:2px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.row-size{font-size:11px;font-family:Consolas,monospace;color:#4a545e;font-variant-numeric:tabular-nums}
.lock{font-size:11px;color:#d9363e;flex-shrink:0;width:14px;text-align:center}

/* 详情行 */
.trow{display:grid;align-items:center;gap:14px;min-height:42px;padding:0 12px;background:var(--panel-2);border:1px solid #eef1f4;border-radius:4px;white-space:nowrap;transition:background .12s,border-color .12s}
.trow:hover{background:#f7fafc;border-color:#e0e6eb}
.trow.risk-green{box-shadow:inset 3px 0 0 var(--green)}
.trow.risk-red{box-shadow:inset 3px 0 0 var(--red);background:#fdf7f7}
.trow.risk-yellow{box-shadow:inset 3px 0 0 #f0a020;background:#fffbf3}
.trow.dir{grid-template-columns:16px minmax(0,1.6fr) minmax(0,1.15fr) 76px 96px}
.trow.proj{grid-template-columns:16px minmax(0,1.6fr) minmax(0,1.2fr) 76px 96px}
.trow.pend{grid-template-columns:minmax(0,1.6fr) minmax(0,1.1fr) 76px auto}
.trow.cap{grid-template-columns:minmax(0,1.6fr) minmax(0,1.1fr) 76px 90px}
.tcell{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcell.lockcell{display:flex;align-items:center;justify-content:center;overflow:visible}
.tcell.tpath{font-size:11.5px;font-weight:550;color:#33383d;font-family:Consolas,monospace}
.tcell.tpath.badged{display:flex;align-items:center;gap:6px}
.tcell.tpath.badged .badge{flex-shrink:0}
.tcell.tpath.badged .tp{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcell.tdesc{font-size:10.5px;color:var(--dim)}
.tcell.tsize{font-size:11px;font-family:Consolas,monospace;color:#4a545e;text-align:right;font-variant-numeric:tabular-nums}
.tcell.acts{display:flex;align-items:center;justify-content:flex-end;gap:5px;overflow:visible}

.kvbar{display:flex;align-items:stretch;background:#f7faf7;border:1px solid #e2eee0;border-radius:4px;overflow:hidden}
.kvbar .kv-item{display:flex;flex-direction:column;justify-content:center;gap:3px;padding:9px 12px;min-width:0;flex:1}
.kvbar .kv-item.wide{flex:2.2}
.kvbar .kv-item + .kv-item{border-left:1px solid #e7f0e6}
.kvbar .k{font-size:10px;color:var(--muted);white-space:nowrap}
.kvbar .v{font-size:11px;font-family:Consolas,monospace;color:#2f3439;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kvbar .v.ok{color:#2f8e35}
.kvbar .v.warn{color:var(--amber)}
.sw{width:30px;height:17px;border-radius:9px;background:#cbd3db;position:relative;border:none;flex-shrink:0;transition:background .12s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.16);transition:left .14s}
.sw.on{background:var(--green)}
.sw.on::after{left:15px}

.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line-soft)}
.actions .spacer{flex:1}
.actions .note{font-size:10px;color:var(--dim)}

.tag{display:inline-flex;align-items:center;gap:3px;font-size:9.5px;color:var(--muted);background:#f2f5f7;border:1px solid #e1e6ea;border-radius:2px;padding:1px 5px;white-space:nowrap}
.tag-code{font-family:Consolas,monospace;font-size:9px;color:#2f8e35;background:#eef8ed;border-color:#d7edd5}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 24px;gap:9px}
.empty-ico{width:56px;height:56px;border-radius:12px;background:#eef8ed;color:#3fbf44;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:3px;border:1px solid #d9eed7}
.empty h3{font-size:14px;color:#2f3439;font-weight:700}
.empty p{font-size:11px;color:var(--muted);line-height:1.65;max-width:440px}
.empty .actions{border:none;padding-top:6px}
.empty-list{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-top:2px}

.scanning{padding:16px 18px}
.scanning h3{font-size:13.5px;color:#2f3439;margin-bottom:3px}
.scanning .lead{font-size:11px;color:var(--muted);margin-bottom:12px}
.progress{height:6px;background:#e9eef0;border-radius:3px;overflow:hidden;border:1px solid #e1e7ec}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#63d168,#3fbf44);border-radius:3px;transition:width .3s ease}
.progress-meta{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-top:6px}
.stage-list{display:flex;flex-direction:column;gap:1px;margin-top:14px}
.stage{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:3px;font-size:11px;color:var(--dim)}
.stage .s-ico{width:15px;height:15px;border-radius:50%;border:1.5px solid #d3dae1;display:flex;align-items:center;justify-content:center;font-size:8px;flex-shrink:0}
.stage.done{color:#2f8e35}
.stage.done .s-ico{border-color:#8fd68b;background:#eaf7e8;color:#2f8e35}
.stage.active{background:#f2faf1;color:#33383d}
.stage.active .s-ico{border-color:var(--green);border-top-color:transparent;animation:spin 1s linear infinite}
.stage .s-meta{margin-left:auto;font-size:9.5px;color:var(--dim);font-family:Consolas,monospace}
@keyframes spin{to{transform:rotate(360deg)}}
.skeleton{margin-top:14px;display:flex;flex-direction:column;gap:5px;opacity:.7}
.sk-row{height:26px;border-radius:3px;background:linear-gradient(90deg,#eef2f5 25%,#f7f9fb 37%,#eef2f5 63%);background-size:400% 100%;animation:shimmer 1.4s infinite}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}

/* 项目 / 历史卡片（非分栏时） */
.proj-bar{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding-bottom:2px}
.proj-card{flex:1 1 0;min-width:176px;display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:4px;border:1px solid #e7ecf1;background:#fff;text-align:left}
.proj-card:hover{background:#f7faf7;border-color:#c9e6c7}
.proj-card.active{background:#f3fbf1;border-color:#8fd68b;box-shadow:inset 0 -2px 0 var(--green)}
.pc-top{display:flex;align-items:center;gap:7px;min-width:0}
.pc-name{font-size:11.5px;font-weight:600;color:#33383d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.pc-path{font-size:9.5px;color:var(--dim);font-family:Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;white-space:nowrap}
.pc-size{font-size:10.5px;font-family:Consolas,monospace;color:#4a545e;font-variant-numeric:tabular-nums}
.hist-bar{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding-bottom:2px}
.hist-card{flex:1 1 0;min-width:172px;display:flex;flex-direction:column;gap:5px;padding:9px 11px;border-radius:4px;border:1px solid #e7ecf1;background:#fff;text-align:left}
.hist-card:hover{background:#f7faf7;border-color:#c9e6c7}
.hist-card.active{background:#f3fbf1;border-color:#8fd68b;box-shadow:inset 0 -2px 0 var(--green)}
.hc-top{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0}
.hc-name{font-size:11.5px;font-weight:600;color:#33383d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hc-meta{font-size:9.5px;color:var(--dim);font-family:Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;white-space:nowrap}
.hc-size{font-size:10px;font-family:Consolas,monospace;color:#8a949e;font-variant-numeric:tabular-nums}

.table{width:100%;border-collapse:collapse;font-size:11.5px}
.table th{font-size:10px;font-weight:600;color:#8a949e;text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fafbfc}
.table td{padding:9px 8px;border-bottom:1px solid var(--line-soft);color:#4a545e;vertical-align:middle}
.table tr:last-child td{border-bottom:none}
.table tbody tr:hover td{background:#f7fafc}
.table .mono{font-family:Consolas,monospace;font-size:10.5px;color:#33383d}
.table .num{text-align:right;font-variant-numeric:tabular-nums;font-family:Consolas,monospace}
.table .right{text-align:right}
.table-wrap{overflow-x:auto}

.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:10px;color:var(--muted);font-weight:600}
.field input,.field select{background:#fff;border:1px solid #d7dee4;border-radius:3px;padding:6px 8px;font-size:11.5px;color:var(--text);width:100%}
.field input:focus,.field select:focus{outline:none;border-color:#7fd383}
.field .hint{font-size:9.5px;color:var(--dim)}
.field.full{grid-column:1/-1}

.diskbar{display:flex;height:12px;border-radius:3px;overflow:hidden;background:#e9eef0;border:1px solid #e1e7ec}
.diskbar span{height:100%}
.disk-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:10px;color:var(--muted)}
.disk-legend i{width:7px;height:7px;border-radius:2px;display:inline-block;margin-right:4px}

.timeline{display:flex;flex-direction:column;gap:0;padding-left:3px}
.tl-item{display:flex;gap:10px;position:relative;padding-bottom:15px}
.tl-item:not(:last-child)::before{content:"";position:absolute;left:6px;top:14px;bottom:0;width:1px;background:#e1e7ec}
.tl-dot{width:13px;height:13px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:7px;border:1.5px solid #cfd7de;background:#fff;color:#98a2ac;z-index:1}
.tl-dot.ok{border-color:#8fd68b;background:#eaf7e8;color:#2f8e35}
.tl-dot.err{border-color:#f0b6b3;background:#fff0ef;color:#d9363e}
.tl-dot.now{border-color:#8fd68b;background:#eaf7e8;color:#2f8e35}
.tl-body{flex:1;min-width:0}
.tl-title{font-size:11.5px;color:#33383d;font-weight:550;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.tl-meta{font-size:10px;color:var(--dim);margin-top:3px;line-height:1.45;word-break:break-all}
.tl-code{font-family:Consolas,monospace;font-size:9.5px;color:#d9363e;background:#fff0ef;border:1px solid #f2c9c6;padding:1px 4px;border-radius:2px;display:inline-block;margin-top:3px}

.modal-mask{position:fixed;inset:0;background:rgba(32,42,51,.42);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:#fff;border:1px solid #dfe6eb;border-radius:6px;box-shadow:var(--shadow);width:540px;max-width:100%;max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.modal.wide{width:690px}
.modal-head{padding:13px 18px 11px;border-bottom:1px solid var(--line-soft);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;background:#fafcfb}
.modal-head h3{font-size:13.5px;font-weight:700;color:#2f3439;display:flex;align-items:center;gap:7px}
.modal-head h3::before{content:"";width:3px;height:13px;border-radius:1px;background:var(--green);flex-shrink:0}
.modal-head .sub{font-size:10.5px;color:var(--dim);margin-top:3px;line-height:1.45}
.modal-x{background:none;border:none;color:#a2abb4;font-size:16px;line-height:1;padding:2px 4px;border-radius:3px}
.modal-x:hover{color:#2f3439;background:#eef2f5}
.modal-body{padding:14px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.modal-foot{padding:10px 18px;border-top:1px solid var(--line-soft);display:flex;gap:7px;justify-content:flex-end;align-items:center;flex-wrap:wrap;background:#fbfcfd}
.modal-foot .left{margin-right:auto;font-size:10px;color:var(--dim)}

.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.sum-box{background:#f7f9fa;border:1px solid #edf0f3;border-radius:4px;padding:10px 12px}
.sum-box .k{font-size:9.5px;color:var(--dim)}
.sum-box .v{font-size:13px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums;color:#2f3439}

.settings-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.settings-row:last-child{border-bottom:none}
.settings-row .k{font-size:11.5px;color:#33383d}
.settings-row .d{font-size:10px;color:var(--dim);margin-top:2px}
.settings-row .ctrl{flex-shrink:0}
.settings-row select,.settings-row input[type=text]{background:#fff;border:1px solid #d7dee4;border-radius:3px;padding:5px 8px;font-size:11px;color:var(--text)}
.settings-row select:focus,.settings-row input[type=text]:focus{outline:none;border-color:#7fd383}
.settings-row input[type=text]{width:250px;font-family:Consolas,monospace}

.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,8px);background:#333b43;border:1px solid #454e57;color:#fff;padding:8px 14px;border-radius:3px;font-size:11px;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:300;max-width:70vw}
.toast.show{opacity:1;transform:translate(-50%,0)}

.proto-fab{position:fixed;right:14px;bottom:14px;z-index:90;background:#fff;border:1px solid #dfe6eb;color:#7d8791;font-size:10px;font-weight:600;padding:6px 10px;border-radius:16px;box-shadow:0 3px 10px rgba(31,45,61,.1);display:flex;align-items:center;gap:5px}
.proto-fab:hover{color:#2f8e35;border-color:#bfe3bf}
.proto-fab .p-dot{width:5px;height:5px;border-radius:50%;background:#f0a020}
.proto-panel{position:fixed;right:14px;bottom:50px;z-index:91;width:270px;background:#fff;border:1px solid #dfe6eb;border-radius:5px;box-shadow:var(--shadow);padding:10px;display:none}
.proto-panel.show{display:block}
.proto-panel h4{font-size:10.5px;color:#4a545e;margin-bottom:2px}
.proto-panel p{font-size:9.5px;color:var(--dim);line-height:1.45;margin-bottom:8px}
.proto-routes{display:flex;flex-direction:column;gap:1px;max-height:50vh;overflow-y:auto}
.proto-route{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:3px;background:none;border:none;color:#5b646d;font-size:10.5px;text-align:left}
.proto-route:hover{background:#f2f8f1;color:#2f8e35}
.proto-route.active{background:#eaf7e8;color:#2f8e35}
.proto-route .pr-k{font-family:Consolas,monospace;font-size:8.5px;color:#aab3bc;margin-left:auto}
.proto-sep{height:1px;background:var(--line-soft);margin:5px 0}
.nav-label{font-size:9.5px;font-weight:700;color:#a0a9b2;letter-spacing:.6px;padding:4px 6px 3px}

.muted{color:var(--muted)} .dim{color:var(--dim)} .ok{color:#2f8e35} .warn{color:var(--amber)} .bad{color:var(--red)}
.mono{font-family:Consolas,"SFMono-Regular",monospace;font-variant-numeric:tabular-nums}
.nowrap{white-space:nowrap} .truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-flex{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mt-2{margin-top:8px} .mt-3{margin-top:12px} .mt-4{margin-top:16px}
.center{text-align:center}
.divider{height:1px;background:var(--line-soft);margin:2px 0}

@media (max-width:1280px){
  .topnav{height:80px;padding:0 12px}
  .brand{width:150px}
  .brand-name{font-size:14px}
  .nav-item{width:78px;height:70px}
  .system-ver{display:none}
  .main-scroll{padding:10px 12px 18px}
  .topbar{padding:9px 12px}
  .trow.dir{grid-template-columns:15px minmax(0,1.55fr) minmax(0,1.05fr) 72px 90px;gap:11px}
  .trow.proj,.trow.pend,.trow.cap{gap:11px}
  .detail-path{max-width:min(520px,52vw)}
}
@media (max-width:1180px){
  .split-layout{grid-template-columns:200px minmax(0,1fr)}
  .split-layout .bar{padding:7px}
  .split-layout .ide-item{grid-template-columns:24px minmax(0,1fr) auto;gap:6px}
  .split-layout .ide-mark{width:24px;height:24px;font-size:9px}
  .split-layout .ide-name{font-size:11px}
  .split-layout .ide-item .badge{font-size:8.5px}
  .split-layout .bar-top .legend{font-size:9.5px}
  .kvbar .kv-item{padding:8px 9px}
  .kvbar .v{font-size:10px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

const TABS = ['projects', 'ide', 'disk', 'rules', 'history'];

function parseRoute() {
  const raw = (location.hash || '').replace(/^#/, '');
  if (raw === 'settings' || raw === 'feedback') return { tab: state.tab || 'projects', sub: '', modal: raw };
  const parts = raw.split('/');
  const tab = TABS.indexOf(parts[0]) >= 0 ? parts[0] : 'projects';
  return { tab: tab, sub: parts[1] || '', modal: '' };
}
function getIde(id) { return CATALOG.ides.find(x => x.id === id) || CATALOG.ides[0]; }
function ideSize(ide) { return sum(ide.directories, 'size_bytes'); }
function safetyCount(ide, safety) { return ide.directories.filter(d => d.safety === safety).length; }
function yellowKey(ideId, idx) { return ideId + '|' + idx; }
function isConfirmed(ideId, idx) { return !!state.confirmed[yellowKey(ideId, idx)]; }
function isChecked(ideId, idx, dir) {
  if (dir.safety === 'red') return false;
  if (dir.safety === 'yellow' && !isConfirmed(ideId, idx)) return false;
  return !!state.checked[ideId] && !!state.checked[ideId][idx];
}
function selectedDirs(ide) {
  return ide.directories.filter((d, i) => isChecked(ide.id, i, d));
}
function selectedSize(ide) { return sum(selectedDirs(ide), 'size_bytes'); }
function targetAvailableGB() { return state.settings.targetRoot ? DRIVE.targetFreeGB : 0; }
function needBytes(ide) { return Math.ceil(selectedSize(ide) * 1.05 + 64 * 1024 * 1024); }
function needsGB(ide) { return needBytes(ide) / GIB; }
function spaceOk(ide) { return needsGB(ide) <= targetAvailableGB(); }
function targetPathFor(ide) { return (state.settings.targetRoot.replace(/\\$/, '') + '\\' + ide.name.replace(/\s+/g, '')); }
function appTitle() { return document.title; }

function render() {
  const info = parseRoute();
  state.tab = info.tab; state.sub = info.sub; state.modal = info.modal || '';
  if (!modalKind()) state.returnHash = '';
  if (state.sub) {
    if (state.sub === 'process-blocked') {
      const cur = getIde(state.selectedIde);
      if (!cur.runtime.running.length) state.selectedIde = 'cursor';
    } else if (state.sub === 'rollback-confirm') {
      const cur = getIde(state.selectedIde);
      if (!cur.runtime.migrated) { state.selectedIde = 'vscode'; state.selectedHistory = 'h3'; }
    } else if (state.sub.indexOf('migrate-') === 0) {
      const cur = getIde(state.selectedIde);
      if (cur.runtime.migrated || cur.runtime.running.length) state.selectedIde = 'trae-cn';
    }
  }
  renderTopnav();
  renderTopbar();
  let html = '';
  if (state.tab === 'ide') {
    if (state.sub === 'scanning') html = renderScanning();
    else if (state.sub === 'empty') html = renderEmpty();
    else html = renderIde();
  } else if (state.tab === 'projects') html = renderProjects();
  else if (state.tab === 'disk') html = renderDisk();
  else if (state.tab === 'rules') html = renderRules();
  else if (state.tab === 'history') html = renderHistory();
  document.getElementById('view').innerHTML = html;
  renderModal();
  renderProtoPanel();
  document.documentElement.lang = LANG;
}

function renderIde() {
  const list = filteredIdes();
  const ide = getIde(state.selectedIde);
  return `<div class="content split-layout">
    <section class="bar">
      <div class="bar-top">
        <span class="bar-title">${esc(t('ide.listTitle'))}</span>
        <span class="bar-hint">${esc(t('ide.listHint', { n: CATALOG.ides.length }))}</span>
        <input class="search" id="ide-search" placeholder="${esc(t('ide.search'))}" value="${esc(state.search)}" oninput="App.search(this.value)">
        <div class="chip-row">
          ${['all', 'c', 'migrated', 'running'].map(f => `<button type="button" class="btn btn-xs ${state.filter === f ? 'btn-soft' : 'btn-ghost'}" onclick="App.setFilter('${f}')">${esc(t('ide.filter.' + f))}</button>`).join('')}
        </div>
        <div class="legend">
          <span><i class="dot dot-green"></i>${esc(t('legend.green'))}</span>
          <span><i class="dot dot-red"></i>${esc(t('legend.red'))}</span>

        </div>
      </div>
      <div class="ide-bar">
        ${list.length ? list.map(i => ideRow(i)).join('') : `<div class="note dim" style="padding:10px 2px">${esc(t('ide.listEmpty'))}</div>`}
      </div>
    </section>
    <section class="panel">${renderIdeDetail(ide)}</section>
  </div>`;
}

function filteredIdes() {
  const q = state.search.trim().toLowerCase();
  return CATALOG.ides.filter(i => {
    if (state.filter === 'c' && i.runtime.migrated) return false;
    if (state.filter === 'migrated' && !i.runtime.migrated) return false;
    if (state.filter === 'running' && !i.runtime.running.length) return false;
    if (!q) return true;
    return i.name.toLowerCase().indexOf(q) >= 0 || i.directories.some(d => d.path.toLowerCase().indexOf(q) >= 0);
  });
}

function ideRow(ide) {
  const g = safetyCount(ide, 'green'), r = safetyCount(ide, 'red'), y = safetyCount(ide, 'yellow');
  return `<button type="button" class="ide-item ${state.selectedIde === ide.id ? 'active' : ''}" title="${esc(ide.name)} · ${esc(ide.runtime.root)}" onclick="App.selectIde('${ide.id}')">
    <span class="ide-top">
      <span class="ide-mark" style="background:${ide.runtime.migrated ? 'linear-gradient(135deg,#5ed36a,#34ad3c)' : 'linear-gradient(135deg,#63b8ff,#2f8bf5)'}">${esc(ide.name.slice(0, 2).toUpperCase())}</span>
      <span class="ide-main">
        <span class="ide-name">${ide.runtime.running.length ? `<i class="run-dot" title="${esc(t('common.running'))}"></i>` : ''}<span class="n">${esc(ide.name)}</span></span>
        <span class="ide-sub">
          <span class="cnt"><i class="dot dot-green"></i>${g}</span>
          <span class="cnt"><i class="dot dot-red"></i>${r}</span>
          ${y ? `<span class="cnt"><i class="dot dot-amber"></i>${y}</span>` : ''}
          <span class="dim">· ${esc(t('ide.kind.' + ide.kind))}</span>
        </span>
      </span>
    </span>
    <span class="ide-foot">
      <span class="ide-size">${fmtGB(ideSize(ide) / GIB)}</span>
      <span class="badge ${ide.runtime.migrated ? 'b-green' : 'b-gray'}">${esc(ide.runtime.migrated ? t('common.migrated') : t('common.onC'))}</span>
    </span>
  </button>`;
}

function renderIdeDetail(ide) {
  const g = safetyCount(ide, 'green'), r = safetyCount(ide, 'red'), y = safetyCount(ide, 'yellow');
  const sel = selectedDirs(ide);
  const selSize = selectedSize(ide);
  const need = needsGB(ide);
  const enough = spaceOk(ide);
  const running = ide.runtime.running;
  const migrated = ide.runtime.migrated;
  const redNote = r ? `<div class="banner danger" style="margin-top:2px"><span class="b-ico">⛨</span><div>${esc(t('ide.redExcluded', { n: r }))} <b>${esc(t('common.red'))}</b> · ${esc(t('ide.redLocked'))}</div></div>` : '';
  const yellowNote = y ? `<div class="banner warn" style="margin-top:2px"><span class="b-ico">△</span><div>${esc(t('ide.yellowHint'))}</div></div>` : '';
  const runBanner = running.length ? `<div class="banner warn"><span class="b-ico">▲</span><div><b>${esc(t('ide.processTitle'))}</b><br>${esc(t('ide.processBody', { app: ide.name }))}<div class="banner-actions"><span class="tag mono">${running.map(p => esc(p.name) + ' · PID ' + p.pid).join(' | ')}</span></div></div></div>` : '';
  const migratedBanner = migrated ? `<div class="banner ok"><span class="b-ico">✓</span><div>${esc(t('ide.alreadyMigrated'))}<br><span class="mono" style="font-size:10.5px">${esc(ide.runtime.target || targetPathFor(ide))}</span></div></div>` : '';
  return `<div class="detail">
    <div class="detail-head">
      <div class="detail-title">
        <span class="ide-mark" style="background:${migrated ? 'linear-gradient(135deg,#5ed36a,#34ad3c)' : 'linear-gradient(135deg,#63b8ff,#2f8bf5)'};width:32px;height:32px">${esc(ide.name.slice(0, 2).toUpperCase())}</span>
        <div>
          <h2>${esc(ide.name)}</h2>
          <div class="detail-path" title="${esc(ide.runtime.root)}">${esc(ide.runtime.root)}</div>
        </div>
      </div>
      <div class="detail-badges">
        <span class="badge b-plain">${esc(t('ide.kind.' + ide.kind))}</span>
        <span class="badge ${migrated ? 'b-green' : 'b-gray'}">${esc(migrated ? t('common.migrated') : t('common.onC'))}</span>
        ${running.length ? `<span class="badge b-amber"><i class="run-dot"></i>${esc(t('common.running'))}</span>` : ''}
      </div>
    </div>
    ${migratedBanner}
    ${runBanner}
    <div class="kvbar">
      <div class="kv-item wide"><span class="k">${esc(migrated ? t('rollback.source') : t('ide.target'))}</span><span class="v" title="${esc(migrated ? (ide.runtime.target || targetPathFor(ide)) : targetPathFor(ide))}">${esc(migrated ? (ide.runtime.target || targetPathFor(ide)) : targetPathFor(ide))}</span></div>
      <div class="kv-item"><span class="k">${esc(t('ide.estimatedFree'))}</span><span class="v ok">${fmtGB(selSize / GIB)}</span></div>
      ${migrated ? '' : `<div class="kv-item"><span class="k">${esc(t('ide.needSpace'))}</span><span class="v">${fmtGB(need)}</span></div>
      <div class="kv-item"><span class="k">${esc(t('preview.targetFree'))}</span><span class="v ${enough ? 'ok' : 'warn'}">${DRIVE.targetFreeGB.toFixed(1)} GB · ${esc(enough ? t('preview.spaceOk') : t('preview.spaceBad'))}</span></div>
      <div class="kv-item"><span class="k">${esc(t('ide.migratable'))}</span><span class="v">${esc(t('ide.migratableValue', { n: sel.length, size: fmtGB(selSize / GIB) }))}</span></div>`}
    </div>
    ${redNote}${yellowNote}
    <div class="section-title"><h3>${esc(t('ide.itemsTitle'))}</h3><span class="sub">${esc(t('ide.itemsHint'))}</span></div>
    <div class="rows">
      ${ide.directories.map((d, i) => itemRow(ide, d, i)).join('')}
    </div>
    <div class="actions">
      ${migrated
        ? `<button type="button" class="btn btn-ghost btn-sm" onclick="App.openRollback('${ide.id}')">${esc(t('action.rollback'))}</button>
           <button type="button" class="btn btn-ghost btn-sm" onclick="App.toast(t('toast.opened'))">${esc(t('action.openFolder'))}</button>`
        : `<button type="button" class="btn btn-primary btn-sm" ${g ? '' : 'disabled'} onclick="App.startPreview('${ide.id}')">${esc(t('action.migrate'))}</button>
           <button type="button" class="btn btn-ghost btn-sm" onclick="App.cleanCaches('${ide.id}')">${esc(t('action.clean'))}</button>
           <button type="button" class="btn btn-ghost btn-sm" onclick="App.toast(t('toast.opened'))">${esc(t('action.openFolder'))}</button>
           <button type="button" class="btn btn-ghost btn-sm" onclick="App.openModal('feedback')">${esc(t('action.feedback'))}</button>`}
      <span class="spacer"></span>
      <span class="note">${esc(migrated ? t('rollback.note', { app: ide.name }) : t('ide.cleanHint'))}</span>
    </div>
  </div>`;
}

function itemRow(ide, d, i) {
  const checked = isChecked(ide.id, i, d);
  const badge = d.safety === 'green' ? `<span class="badge b-green">${esc(t('common.green'))}</span>`
    : d.safety === 'red' ? `<span class="badge b-red">⛨ ${esc(t('common.red'))}</span>`
    : `<span class="badge b-amber">? ${esc(t('common.yellow'))}</span>`;
  const left = d.safety === 'red'
    ? `<span class="tcell lockcell"><span class="lock" title="${esc(t('ide.redLocked'))}" aria-label="${esc(t('ide.redLocked'))}">⛨</span></span>`
    : `<span class="tcell lockcell"><input class="row-check" type="checkbox" ${checked ? 'checked' : ''} ${d.safety === 'yellow' && !isConfirmed(ide.id, i) ? 'disabled' : ''} onclick="App.toggleCheck('${ide.id}',${i})" aria-label="${esc(d.path)}"></span>`;
  const confirmed = d.safety === 'yellow' && isConfirmed(ide.id, i);
  const reason = t(d.reason) + (d.safety === 'red' ? ' · ' + t('ide.redLocked') : '');
  const act = d.safety === 'yellow' && !confirmed
    ? `<button type="button" class="btn btn-ghost btn-xs" onclick="App.openYellow('${ide.id}',${i})">${esc(t('action.confirmYellow'))}</button>`
    : confirmed ? `<span class="badge b-gray">${esc(t('common.confirmed'))}</span>`
    : d.handling ? `<span class="tag tag-code">${esc(d.handling)}</span>` : '';
  return `<div class="trow dir risk-${d.safety}" title="${esc(d.path)} · ${esc(reason)}">
    ${left}
    <span class="tcell tpath badged">${badge}<span class="tp" title="${esc(d.path)}">${esc(d.path)}</span></span>
    <span class="tcell tdesc">${esc(reason)}</span>
    <span class="tcell tsize">${fmtBytes(d.size_bytes)}</span>
    <span class="tcell acts">${act}</span>
  </div>`;
}

function renderScanning() {
  const pct = state.scanning ? state.scanPct : 62;
  const stages = ['enumerate', 'match', 'size', 'process', 'classify', 'done'];
  const active = pct < 18 ? 0 : pct < 38 ? 1 : pct < 68 ? 2 : pct < 84 ? 3 : pct < 96 ? 4 : 5;
  return `<div class="content narrow">
    <section class="panel scanning">
      <h3>${esc(t('scan.title'))}</h3>
      <p class="lead">${esc(t('scan.lead'))}</p>
      <div class="progress"><i style="width:${pct}%"></i></div>
      <div class="progress-meta"><span>${esc(t('common.progress'))} · ${pct}%</span><span>${esc(t('meta.scope'))}</span></div>
      <div class="stage-list">
        ${stages.map((s, i) => `<div class="stage ${i < active ? 'done' : i === active ? 'active' : ''}">
          <span class="s-ico">${i < active ? '✓' : ''}</span><span>${esc(t('scan.stage.' + s))}</span>
          <span class="s-meta">${i < active ? esc(t('progress.done')) : i === active ? esc(t('progress.running')) : esc(t('progress.waiting'))}</span>
        </div>`).join('')}
      </div>
      <div class="sk-row skeleton" style="margin-top:16px"></div>
      <div class="skeleton"><div class="sk-row"></div><div class="sk-row" style="width:82%"></div><div class="sk-row" style="width:64%"></div></div>
      <div class="actions" style="border:none;padding-top:16px">
        <button type="button" class="btn btn-ghost btn-sm" onclick="App.cancelScan()">${esc(t('action.cancelScan'))}</button>
        <span class="note">${esc(t('common.simulated'))}</span>
      </div>
    </section>
  </div>`;
}

  if (h.result === 'failed') return `<span class="badge b-red">${esc(t('history.result.failed'))}</span>`;
  if (h.result === 'rolledback') return `<span class="badge b-violet">${esc(t('history.result.rolledback'))}</span>`;
  return `<span class="badge b-green">✓ ${esc(t('history.result.success'))}</span>`;
}
function typeBadge(h) {
  return `<span class="badge ${h.type === 'migrate' ? 'b-blue' : h.type === 'rollback' ? 'b-violet' : 'b-gray'}">${esc(t('history.type.' + h.type))}</span>`;
}

/* ---------- 弹窗 ---------- */
function modalKind() {
  const info = parseRoute();
  if (info.modal) return info.modal;
  const subs = ['migrate-preview', 'migrate-progress', 'migrate-failed', 'migrate-success', 'rollback-confirm', 'process-blocked', 'yellow-confirm'];
  return subs.indexOf(info.sub) >= 0 ? info.sub : '';
}

function modalShell(title, sub, body, foot, wide) {
  return `<div class="modal-head">
      <div><h3>${esc(title)}</h3>${sub ? `<div class="sub">${esc(sub)}</div>` : ''}</div>
      <button type="button" class="modal-x" onclick="App.closeModal()" aria-label="${esc(t('action.close'))}">✕</button>
    </div>
    <div class="modal-body">${body}</div>
    <div class="modal-foot">${foot}</div>`;
}

function renderModal() {
  const kind = modalKind();
  const root = document.getElementById('modal-root');
  if (!kind) { root.innerHTML = ''; return; }
  let html = '';
  if (kind === 'settings') html = modalSettings();
  else if (kind === 'feedback') html = modalFeedback();
  else if (kind === 'migrate-preview') html = modalPreview();
  else if (kind === 'migrate-progress') html = modalProgress();
  else if (kind === 'migrate-failed') html = modalFailed();
  else if (kind === 'migrate-success') html = modalSuccess();
  else if (kind === 'rollback-confirm') html = modalRollback();
  else if (kind === 'process-blocked') html = modalBlocked();
  else if (kind === 'yellow-confirm') html = modalYellow();
  if (!html) { root.innerHTML = ''; return; }
  root.innerHTML = `<div class="modal-mask" onclick="App.closeModal()">
    <div class="modal ${kind === 'migrate-preview' || kind === 'process-blocked' ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(kind)}" onclick="event.stopPropagation()">${html}</div>
  </div>`;
}

    ${yellow ? `<div class="banner warn"><span class="b-ico">?</span><div>${esc(t('preview.yellowPending', { n: yellow }))}</div></div>` : ''}`;
  const foot = `<button type="button" class="btn btn-ghost btn-sm" onclick="App.closeModal()">${esc(t('preview.back'))}</button>
    <button type="button" class="btn btn-primary btn-sm" ${dirs.length && spaceOk(ide) ? '' : 'disabled'} onclick="App.go('#ide/migrate-progress')">${esc(t('preview.start'))}</button>`;
  return modalShell(t('preview.title'), t('preview.sub'), body, foot);
}

function modalProgress() {
  const ide = getIde(state.selectedIde);
  const pct = state.demo.pct;
  const stages = ['backup', 'copy', 'verify', 'delete', 'link', 'verifyLink'];
  const active = 2;
  const body = `
    <div class="preview-card">
      <div class="preview-top"><span class="t">${esc(ide.name)}</span><span class="badge b-blue">${pct}%</span></div>
      <div class="progress"><i style="width:${pct}%"></i></div>
      <div class="progress-meta"><span>${esc(t('progress.files', { done: state.demo.filesDone.toLocaleString(), total: state.demo.filesTotal.toLocaleString() }))}</span><span>${esc(t('progress.percent', { pct: pct }))}</span></div>
    </div>
    <div class="stage-list">
      ${stages.map((s, i) => `<div class="stage ${i < active ? 'done' : i === active ? 'active' : ''}">
        <span class="s-ico">${i < active ? '✓' : ''}</span><span>${esc(t('progress.stage.' + s))}</span>
        <span class="s-meta">${i < active ? esc(t('progress.done')) : i === active ? esc(t('progress.running')) : esc(t('progress.waiting'))}</span>
      </div>`).join('')}
    </div>
    <div class="banner warn"><span class="b-ico">△</span><div>${esc(t('progress.keepOpen'))}</div></div>`;
  const foot = `<span class="left">${esc(t('progress.cancelDisabled'))}</span>
    <button type="button" class="btn btn-ghost btn-sm" disabled>${esc(t('action.cancel'))}</button>`;
  return modalShell(t('progress.title'), ide.name + ' · ' + fmtGB(selectedSize(ide) / GIB), body, foot, true);
}

    <button type="button" class="btn btn-ghost btn-sm" onclick="App.confirmYellow('red')">${esc(t('yellow.markRed'))}</button>
    <button type="button" class="btn btn-primary btn-sm" onclick="App.confirmYellow('green')">${esc(t('yellow.confirm'))}</button>`;
  return modalShell(t('yellow.title'), t('yellow.sub', { path: d.path }), body, foot, true);

/* ---------- 原型状态切换 ---------- */
function renderProtoPanel() {
  const panel = document.getElementById('proto-panel');
  const fab = document.getElementById('proto-fab');
  if (!panel) return;
  panel.classList.toggle('show', !!state.protoOpen);
  if (fab) fab.classList.toggle('active', !!state.protoOpen);
  const current = (location.hash || '#ide').replace(/^#/, '');
  const groups = [
    { key: 'proto.section.core', items: [
      { h: 'ide', k: 'proto.route.ide' },
      { h: 'projects', k: 'proto.route.projects' },
      { h: 'disk', k: 'proto.route.disk' },
      { h: 'rules', k: 'proto.route.rules' },
      { h: 'history', k: 'proto.route.history' }
    ] },
    { key: 'proto.section.states', items: [
      { h: 'ide/scanning', k: 'proto.route.scanning' },
      { h: 'ide/empty', k: 'proto.route.empty' },
      { h: 'ide/migrate-preview', k: 'proto.route.preview' },
      { h: 'ide/migrate-progress', k: 'proto.route.progress' },
      { h: 'ide/migrate-failed', k: 'proto.route.failed' },
      { h: 'ide/migrate-success', k: 'proto.route.success' },
      { h: 'ide/process-blocked', k: 'proto.route.blocked' },
      { h: 'ide/rollback-confirm', k: 'proto.route.rollback' },
      { h: 'ide/yellow-confirm', k: 'proto.route.yellow' }
    ] },
    { key: 'proto.section.other', items: [
      { h: 'settings', k: 'proto.route.settings' },
      { h: 'feedback', k: 'proto.route.feedback' }
    ] }
  ];
  panel.innerHTML = `<h4>${esc(t('proto.title'))}</h4><p>${esc(t('proto.desc'))}</p>
    <div class="proto-routes">
      ${groups.map((g, gi) => `${gi ? '<div class="proto-sep"></div>' : ''}<div class="nav-label" style="padding:2px 7px 4px">${esc(t(g.key))}</div>
        ${g.items.map(it => `<button type="button" class="proto-route ${current === it.h ? 'active' : ''}" onclick="App.go('#${it.h}')"><span>${esc(t(it.k))}</span><span class="pr-k">#${esc(it.h)}</span></button>`).join('')}`).join('')}
    </div>`;
  document.getElementById('proto-fab-label').textContent = t('proto.title');
}
/* ---------- 交互动作（原型，不改真实文件） ---------- */
const App = {
  go(hash) {
    state.protoOpen = false;
    if (location.hash === hash) { render(); return; }
    location.hash = hash;
  },
  nav(tab) {
    state.returnHash = '';
    this.go('#' + tab);
  },
  openModal(kind) {
    const activeKind = modalKind();
    if (!activeKind) state.returnHash = location.hash || '#ide';
    this.go('#' + kind);
  },
  closeModal() {
    const back = state.returnHash;
    state.returnHash = '';
    this.go(back && back !== location.hash ? back : '#ide');
  },
  toggleLang() {
    this.setLang(LANG === 'zh-CN' ? 'en' : 'zh-CN');
  },
  setLang(lang) {
    if (lang !== 'en' && lang !== 'zh-CN') return;
    LANG = lang;
    try { localStorage.setItem('dw-lang', lang); } catch (e) {}
    render();
  },
  toggleSetting(key) {
    const root = document.getElementById('settings-root');
    if (root) state.settings.targetRoot = root.value;
    state.settings[key] = !state.settings[key];
    render();
  },
  saveSettings() {
    const root = document.getElementById('settings-root');
    if (root) state.settings.targetRoot = root.value.trim() || 'D:\\DiskWarden\\';
    const un = document.getElementById('settings-uninstall');
    if (un) state.settings.uninstall = un.value;
    this.toast(t('toast.saved'));
    this.closeModal();
  },
  rescan() {
    state.scanning = true;
    state.scanPct = 62;
    this.go('#ide/scanning');
  },
  cancelScan() {
    state.scanning = false;
    this.toast(t('toast.scanCancelled'));
    this.go('#ide');
  },
  search(value) {
    state.search = value;
    const list = filteredIdes();
    const el = document.querySelector('.ide-bar');
    if (!el) return;
    el.innerHTML = list.length
      ? list.map(i => ideRow(i)).join('')
      : `<div class="note dim" style="padding:10px 2px">${esc(t('ide.listEmpty'))}</div>`;
  },
  setFilter(filter) {
    state.filter = filter;
    render();
  },
  selectIde(id) {
    state.selectedIde = id;
    render();
  },
  toggleCheck(ideId, idx) {
    const ide = getIde(ideId);
    const dir = ide.directories[idx];
    if (!dir || dir.safety === 'red') return;
    if (dir.safety === 'yellow' && !isConfirmed(ideId, idx)) return;
    state.checked[ideId] = state.checked[ideId] || {};
    state.checked[ideId][idx] = !state.checked[ideId][idx];
    render();
  },
  openYellow(ideId, idx) {
    state.selectedIde = ideId;
    state.pendingYellow = { ide: ideId, idx: idx };
    state.returnHash = '#ide';
    this.go('#ide/yellow-confirm');
  },
  confirmYellow(action) {
    const py = state.pendingYellow;
    const ide = getIde(py.ide);
    const dir = ide.directories[py.idx];
    state.selectedIde = ide.id;
    if (!dir) { this.go('#ide'); return; }
    if (action === 'green') {
      state.confirmed[yellowKey(ide.id, py.idx)] = true;
      state.checked[ide.id] = state.checked[ide.id] || {};
      state.checked[ide.id][py.idx] = true;
      this.toast(t('toast.yellowConfirmed'));
    } else if (action === 'red') {
      dir.safety = 'red';
      if (state.checked[ide.id]) delete state.checked[ide.id][py.idx];
      this.toast(t('rules.markedRed'));
    }
    this.go('#ide');
  },
  startPreview(ideId) {
    const ide = getIde(ideId);
    state.selectedIde = ide.id;
    if (!selectedDirs(ide).length) { this.toast(t('toast.needSelect')); return; }
    state.returnHash = '#ide';
    if (ide.runtime.running.length) { this.go('#ide/process-blocked'); return; }
    if (!spaceOk(ide)) { this.toast(t('toast.spaceShort')); return; }
    this.go('#ide/migrate-preview');
  },
  cleanCaches(ideId) {
    const ide = getIde(ideId);
    const total = sum(ide.directories.filter(d => d.safety === 'green'), 'size_bytes') / GIB;
    this.toast(t('toast.cleaned', { size: fmtGB(total) }));
  },
  openRollback(ideId) {
    state.selectedIde = ideId;
    state.returnHash = '#ide';
    this.go('#ide/rollback-confirm');
  },
  confirmRollback() {
    const ide = getIde(state.selectedIde);
    const target = ide.runtime.target || targetPathFor(ide);
    ide.runtime.migrated = false;
    ide.runtime.location = 'C';
    delete ide.runtime.target;
    HISTORY.unshift({
      id: 'h' + Date.now(), at: '2026-10-19 10:05', type: 'rollback', app: ide.name,
      from: target, to: 'C:', freed: 0, duration: '2m 20s', result: 'rolledback',
      canRollback: false, note: 'history.rollbackDone',
      steps: ['rollbackStep1', 'rollbackStep2', 'rollbackStep3']
    });
    state.selectedHistory = HISTORY[0].id;
    state.historyFilter = 'all';
    state.returnHash = '';
    this.toast(t('toast.rollbackStarted'));
    this.go('#history');
  },
  retryMigrate() {
    this.toast(t('toast.retry'));
    this.go('#ide/migrate-progress');
  },
  rollbackFailed() {
    this.toast(t('toast.rollbackStarted'));
    this.go('#ide');
  },
  recheckProcess() {
    this.toast(t('blocked.stillBlocked'));
  },
  showForceWarn() {
    this.toast(t('blocked.forceWarn'));
  },
  viewLog() {
    this.toast(t('toast.copied'));
  },
  selectProject(id) {
    state.selectedProject = id;
    render();
  },
  cleanProject(kind) {
    const p = PROJECTS.find(x => x.id === state.selectedProject);
    if (!p) return;
    let freed = 0;
    if (kind === 'deps' || kind === 'all') { freed += p.deps; p.deps = 0; }
    if (kind === 'dist' || kind === 'all') { freed += p.dist; p.dist = 0; }
    this.toast(t('toast.cleaned', { size: fmtGB(freed) }));
    render();
  },
  selectHistory(id) {
    state.selectedHistory = id;
    render();
  },
  setHistoryFilter(filter) {
    state.historyFilter = filter;
    const current = HISTORY.find(x => x.id === state.selectedHistory);
    const visible = filter === 'all' || (current && current.type === filter);
    if (!visible) {
      const first = HISTORY.find(x => filter === 'all' || x.type === filter);
      if (first) state.selectedHistory = first.id;
    }
    render();
  },
  exportHistory() {
    this.toast(t('history.exported'));
  },
  rollbackHistory(id) {
    const h = HISTORY.find(x => x.id === id);
    if (!h || !h.canRollback) return;
    state.selectedHistory = h.id;
    const ide = CATALOG.ides.find(x => x.name === h.app);
    if (ide) state.selectedIde = ide.id;
    state.returnHash = '#history';
    this.go('#ide/rollback-confirm');
  },
  addRule() {
    const matchEl = document.getElementById('rule-match');
    const match = matchEl ? matchEl.value.trim() : '';
    if (!match) {
      if (matchEl) matchEl.focus();
      this.toast(t('rules.required'));
      return;
    }
    const typeEl = document.getElementById('rule-type');
    const safetyEl = document.getElementById('rule-safety');
    const reasonEl = document.getElementById('rule-reason');
    RULES.unshift({
      id: 'r' + Date.now(), match: match,
      type: typeEl ? typeEl.value : 'exact',
      safety: safetyEl ? safetyEl.value : 'green',
      source: 'user', hits: 0, enabled: true,
      reason: reasonEl && reasonEl.value.trim() ? reasonEl.value.trim() : ''
    });
    render();
    this.toast(t('rules.added'));
  },
  toggleRule(id) {
    const r = RULES.find(x => x.id === id);
    if (!r) return;
    r.enabled = !r.enabled;
    render();
  },
  deleteRule(id) {
    const i = RULES.findIndex(x => x.id === id);
    if (i < 0) return;
    RULES.splice(i, 1);
    render();
    this.toast(t('rules.deleted'));
  },
  resolvePending(id, action) {
    const i = PENDING.findIndex(x => x.id === id);
    if (i < 0) return;
    const pd = PENDING[i];
    PENDING.splice(i, 1);
    if (action === 'green' || action === 'red') {
      const name = pd.path.replace(/[\\/]+$/, '').split(/[\\/]/).pop() || pd.path;
      RULES.unshift({ id: 'r' + Date.now(), match: name, type: 'exact', safety: action, source: 'user', hits: 0, enabled: true });
      this.toast(t(action === 'green' ? 'rules.markedGreen' : 'rules.markedRed'));
    } else {
      this.toast(t('rules.ignored'));
    }
    render();
  },
  copyDiagnostics() {
    const diag = [
      'Disk Warden v0.1.0 (prototype)',
      'OS: Windows 10 22H2 x64',
      'Locale: ' + LANG,
      'Last scan: ' + KPI.lastScan + ' (' + KPI.scanDuration + ')',
      'IDEs: ' + CATALOG.ides.length + ' · dirs: ' + CATALOG.ides.reduce((a, i) => a + i.directories.length, 0),
      'Target root: ' + state.settings.targetRoot
    ].join('\n');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(diag).catch(() => {});
    }
    this.toast(t('feedback.copied'));
  },
  toast(message) {
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = message;
    el.classList.add('show');
    clearTimeout(state.toastTimer);
    state.toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
  }
};

/* ---------- 初始化 ---------- */
function init() {
  let saved = null;
  try { saved = localStorage.getItem('dw-lang'); } catch (e) {}
  const query = new URLSearchParams(location.search).get('lang');
  const initial = query || saved;
  if (initial === 'en' || initial === 'zh-CN') LANG = initial;

  if (!location.hash) {
    try { history.replaceState(null, '', location.pathname + location.search + '#projects'); }
    catch (e) { location.hash = 'projects'; }
  }

  window.addEventListener('hashchange', render);
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (modalKind()) App.closeModal();
    else if (state.protoOpen) { state.protoOpen = false; renderProtoPanel(); }
  });
  document.getElementById('proto-fab').addEventListener('click', e => {
    e.stopPropagation();
    state.protoOpen = !state.protoOpen;
    renderProtoPanel();
  });
  document.addEventListener('click', e => {
    if (!state.protoOpen) return;
    if (e.target.closest('#proto-panel') || e.target.closest('#proto-fab')) return;
    state.protoOpen = false;
    renderProtoPanel();
  });

  render();
}

init();
