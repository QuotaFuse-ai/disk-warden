<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disk Warden</title>
<link rel="icon" href="assets/brand/favicon.ico">
<style>
/* ============================================================
   Disk Warden — 主机端 · 原生桌面工具风格
   层级靠描边和留白，不靠阴影与渐变；图标一律内置 SVG，不用文本符号。
   颜色/字号/圆角/动效全部收进 :root Token，做暗色只需换 Token 值。
   ============================================================ */
:root{
  /* 品牌绿（顶栏用单值平面色，保证白字 4.5:1 以上） */
  --green:#3fbf44; --green-dark:#2fa838; --green-deep:#238b2c;
  --green-soft:#eef8ed; --green-line:#d5ecd3; --green-ink:#2f8e35;
  --brand-bar:#1e7d27; --brand-bar-line:#14581c;
  --bg:#f4f6f7; --panel:#ffffff; --panel-2:#fafbfc; --panel-3:#f2f5f7;
  --line:#e3e7eb; --line-soft:#edf0f3; --line-strong:#d7dee4; --line-row:#eaeef2;
  --ink-1:#2f3439; --ink-2:#33383d; --ink-3:#4a545e;
  --text:#2f3439; --text-2:#5b646d; --muted:#7d8791; --dim:#98a2ac; --dim-2:#8a949e;
  --blue:#2f8bf5; --blue-2:#1d74dc; --blue-ink:#1f6fd0; --blue-line:#cfe2fb; --blue-bg:#eef5ff;
  --red:#e5484d; --red-ink:#d9363e; --red-ink-2:#c92f36; --red-line:#f2c9c6; --red-bg:#fdf7f7; --red-bg-2:#fff0ef;
  --amber:#d98500; --amber-ink:#8a5c00; --amber-line:#f1dcaa; --amber-bar:#cc7300; --amber-bg:#fffbf3;
  --disabled-ink:#838d97; --disabled-bg:#f1f3f5; --disabled-line:#e3e7eb;
  --violet:#7c5cff; --violet-ink:#6f4bd8; --violet-line:#ddd0fb; --violet-bg:#f5f1ff;
  --focus:#1560c9;
  --radius:4px; --radius-sm:2px; --radius-lg:6px;
  /* 西文/数字先走系统 UI 字体，中文再回退 YaHei UI；数字用 tabular-nums 对齐 */
  --font-ui:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  --font-mono:"Cascadia Mono","Segoe UI Mono",Consolas,"SFMono-Regular",monospace;
  /* 桌面端字号阶梯：最小 11px，正文 14px；标题层收到 16px 以内 */
  --fs-micro:11px; --fs-meta:12px; --fs-body:13px; --fs-strong:14px;
  --fs-sub:14px; --fs-title:15px; --fs-page:16px; --fs-kpi:22px;
  --shadow:0 6px 18px rgba(24,35,46,.16); --shadow-sm:0 1px 2px rgba(24,35,46,.10);
  --dur:110ms; --dur-slow:240ms;
  --row-h:34px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--font-ui);
  background:var(--bg); color:var(--text); overflow:hidden; font-size:var(--fs-strong); line-height:1.4;
  -webkit-font-smoothing:auto;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border-radius:var(--radius-sm)}
a{color:var(--blue);text-decoration:none}
/* 自绘细滚动条：描边与所在容器无关，靠 background-clip 留缝 */
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-thumb{background:#c3ccd4;background-clip:padding-box;border:3px solid transparent;border-radius:7px}
::-webkit-scrollbar-thumb:hover{background:#a9b4be;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px;border-radius:var(--radius-sm)}
.topnav :focus-visible{outline-color:#fff}

.app{display:flex;flex-direction:column;height:100vh;min-width:1024px;background:var(--bg)}

/* ---------- 顶部导航：48px 单色平面 + 1px 下描边 ---------- */
.topnav{
  height:48px;flex-shrink:0;display:flex;align-items:stretch;gap:4px;padding:0 10px;
  background:var(--brand-bar);color:#fff;
  position:relative;z-index:30;border-bottom:1px solid var(--brand-bar-line);
}
.brand{width:184px;flex-shrink:0;display:flex;align-items:center;gap:8px;min-width:0}
.brand-logo{width:22px;height:22px;flex-shrink:0;border-radius:var(--radius-sm)}
.brand-text{min-width:0;display:flex;align-items:baseline;gap:7px}
.brand-name{font-size:var(--fs-body);font-weight:600;line-height:1.2;white-space:nowrap}
.brand-name em{font-style:normal;font-weight:400;color:rgba(255,255,255,.72)}
.brand-sub{font-size:var(--fs-micro);color:rgba(255,255,255,.66);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;align-items:stretch;gap:0;height:100%;flex:1;min-width:0;overflow:hidden}
.nav-item{
  min-width:78px;max-width:132px;flex:0 1 auto;display:flex;align-items:center;justify-content:center;gap:7px;
  padding:0 12px;border:none;background:transparent;color:#fff;position:relative;
  transition:background var(--dur);font-size:var(--fs-body);white-space:nowrap;overflow:hidden;
}
.nav-item:hover{background:rgba(255,255,255,.10)}
.nav-item.active{background:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.16)}
.nav-item.active::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:2px;background:#fff;opacity:.92}
.nav-ico{
  width:16px;height:16px;display:flex;align-items:center;justify-content:center;
  color:#fff;opacity:.78;position:relative;flex-shrink:0;
}
.nav-item.active .nav-ico{opacity:1}
.nav-ico svg{width:16px;height:16px}
.nav-count{
  min-width:17px;height:16px;padding:0 4px;border-radius:var(--radius-sm);flex-shrink:0;
  background:rgba(255,255,255,.16);color:#fff;font-size:var(--fs-micro);font-weight:600;line-height:16px;text-align:center;
  font-variant-numeric:tabular-nums;
}
.nav-item.active .nav-count{background:rgba(255,255,255,.3)}
.nav-name{line-height:1;overflow:hidden;text-overflow:ellipsis}
.system{display:flex;align-items:center;gap:5px;margin-left:auto;padding-left:8px;flex-shrink:0}
.system-chip{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;height:26px;padding:0 9px;
  border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,.30);background:transparent;
  color:#fff;font-size:var(--fs-meta);white-space:nowrap;transition:background var(--dur),border-color var(--dur);
}
.system-chip:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.5)}
.system-chip.icon{width:26px;padding:0}
.system-chip.icon svg{width:15px;height:15px}
.system-chip .ai-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.45);flex-shrink:0}
.system-chip .ai-dot.on{background:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.3)}
.system-ver{font-size:var(--fs-meta);color:rgba(255,255,255,.7);margin-left:2px;white-space:nowrap}

/* ---------- 主区 ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.topbar{
  flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);z-index:5;
}
.topbar h1{font-size:var(--fs-page);font-weight:600;color:var(--ink-1);line-height:1.3}
.scan-meta{font-size:var(--fs-meta);color:var(--dim);margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.scan-meta .live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
.top-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.main-scroll{flex:1;min-height:0;overflow:hidden;padding:10px 12px 12px;background:var(--bg);display:flex;flex-direction:column}
#view{flex:1;min-height:0;display:flex;flex-direction:column}

/* ---------- 按钮：主次清晰，hover / active / disabled 三态齐全 ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:5px 12px;border-radius:var(--radius-sm);
  font-size:var(--fs-body);font-weight:400;border:1px solid transparent;line-height:1.3;min-height:26px;
  transition:background var(--dur),border-color var(--dur),color var(--dur);white-space:nowrap;
}
.btn-primary{background:var(--green-dark);color:#fff;border-color:var(--green-deep)}
.btn-primary:hover{background:#2a9a33;border-color:#238b2c}
.btn-primary:active{background:var(--green-deep);border-color:#1c7323}
.btn-ghost{background:var(--panel);color:var(--ink-3);border-color:var(--line-strong)}
.btn-ghost:hover{background:var(--panel-3);border-color:#bcc6cf;color:var(--ink-1)}
.btn-ghost:active{background:#e7ecf0;border-color:#aeb9c3}
.btn-danger{background:var(--panel);color:var(--red-ink);border-color:#ecc0be}
.btn-danger:hover{background:var(--red);border-color:var(--red);color:#fff}
.btn-danger:active{background:var(--red-ink-2);border-color:var(--red-ink-2);color:#fff}
.btn-soft{background:var(--green-soft);color:var(--green-ink);border-color:var(--green-line)}
.btn-soft:hover{background:#ddf3db;border-color:#c2e5bf}
.btn-soft:active{background:#cdeccd}
.btn-sm{padding:4px 10px;font-size:var(--fs-body);min-height:24px}
.btn-xs{padding:2px 7px;font-size:var(--fs-meta);min-height:21px}
.btn[disabled],.btn.disabled{background:var(--disabled-bg);color:var(--disabled-ink);border-color:var(--disabled-line);cursor:not-allowed;opacity:1}
.btn[disabled]:hover,.btn.disabled:hover{background:var(--disabled-bg);color:var(--disabled-ink);border-color:var(--disabled-line)}
.btn-primary[disabled],.btn-primary.disabled,.btn-primary[disabled]:hover{background:var(--disabled-bg);color:var(--disabled-ink);border-color:var(--disabled-line)}
.modal-foot .btn{padding:4px 14px}

.v-red{color:var(--red-ink)} .v-blue{color:var(--blue)} .v-green{color:var(--green-ink)} .v-amber{color:var(--amber-ink)} .v-violet{color:var(--violet-ink)}

/* ---------- 内容与分栏 ---------- */
.content{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:2px}
.content > .panel{flex-shrink:0}
.split-layout{display:grid;grid-template-columns:264px minmax(0,1fr);align-items:stretch;gap:8px;min-width:0;flex:1;min-height:0;overflow:hidden}
.split-layout > .bar{min-width:0;padding:8px;min-height:0;overflow:hidden}
.split-layout > .panel{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.narrow{max-width:860px;width:100%;margin:0 auto}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);min-width:0}
.panel-head{padding:8px 12px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel-head h2{font-size:var(--fs-sub);font-weight:600;color:var(--ink-1);display:flex;align-items:center;gap:7px}
.panel-head .hint{font-size:var(--fs-meta);color:var(--dim)}
.panel-body{padding:10px 12px}
/* 面板内滚动：标题栏与表单固定，列表自身滚动（规则页） */
.panel-scroll{display:flex;flex-direction:column;min-height:0;flex:1}
.content > .panel.panel-scroll{flex-shrink:1}
.panel-scroll > .panel-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.panel-scroll > .panel-body > *{flex-shrink:0}
.panel-scroll .scroll-y{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:3px}
.panel-scroll .scroll-y .table thead th{position:sticky;top:0;z-index:1;box-shadow:inset 0 -1px 0 var(--line)}
/* 规则表原先直接挂在 overflow:hidden 的 panel-body 上：超出高度就被裁掉，滚不动也看不到表头 */
.panel-scroll .table-wrap.scroll-y{flex:1;min-height:0;overflow:auto;padding-right:3px}
.content > .cols{display:grid;gap:8px;flex:1;min-height:0;grid-template-rows:minmax(0,1fr);align-items:stretch;grid-template-columns:minmax(0,1fr) minmax(0,1.22fr)}
.content > .cols.cols-disk{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.content > .cols > .panel{min-height:0;max-height:100%}
.panel-scroll .scroll-y.scroll-fit{flex:0 1 auto}
.cols .trow.pend,.modal .trow.pend{grid-template-columns:minmax(0,1fr) auto;row-gap:3px;align-items:center;white-space:normal;padding:8px 10px}
.cols .trow.pend .tcell.tpath,.modal .trow.pend .tcell.tpath{grid-column:1;grid-row:1}
.cols .trow.pend .tcell.tsize,.modal .trow.pend .tcell.tsize{grid-column:2;grid-row:1;justify-self:end}
.cols .trow.pend .tcell.tdesc,.modal .trow.pend .tcell.tdesc,.cols .trow.pend .tcell.wrap,.modal .trow.pend .tcell.wrap{grid-column:1/-1;grid-row:2}
.cols .trow.pend .tcell.acts,.modal .trow.pend .tcell.acts{grid-column:1/-1;grid-row:3;justify-content:flex-end}
.rule-form{grid-template-columns:1.2fr .8fr .8fr 1.3fr 1.1fr auto;align-items:end}
.cols .rule-form{grid-template-columns:minmax(0,1fr) minmax(0,1fr);row-gap:6px;align-items:end}
.cols .rule-form > button{justify-self:end;white-space:nowrap}
.toolbar{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.search{flex:1;min-width:100px;background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:4px 8px;font-size:var(--fs-body);color:var(--text);transition:border-color var(--dur)}
.search::placeholder{color:#aab3bc}
.search:focus{outline:none;border-color:var(--focus);box-shadow:inset 0 0 0 1px var(--focus)}

.legend{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:var(--fs-meta);color:var(--muted)}
.legend .dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:3px}
.dot-green{background:var(--green)} .dot-red{background:var(--red)} .dot-amber{background:var(--amber-bar)} .dot-blue{background:var(--blue)} .dot-gray{background:#aab3bc}

/* 列表栏 */
.bar{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;gap:8px;min-width:0}
.bar-title{font-size:var(--fs-body);font-weight:600;color:var(--ink-1);white-space:nowrap;display:flex;align-items:center;gap:6px}
.bar-hint{font-size:var(--fs-meta);color:var(--dim);white-space:nowrap}
.chip-row{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.split-layout .bar-top{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 8px;min-width:0}
.split-layout .bar-top .bar-hint{text-align:right}
.split-layout .bar-top .search{grid-column:1/-1;width:100%;flex:none}
.split-layout .bar-top .chip-row{grid-column:1/-1}
.split-layout .bar-top .legend{grid-column:1/-1;margin-left:0;flex-direction:column;align-items:flex-start;gap:1px;font-size:var(--fs-meta);line-height:1.45}

/* 竖向 Tab 列表：列表栏头固定，列表区自身滚动 */
.split-layout .bar-top{flex:0 0 auto}
.split-layout .ide-bar{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:1px;padding:1px 3px 2px 0}
.split-layout .proj-bar,
.split-layout .hist-bar{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:1px 3px 2px 0}
.split-layout .ide-item,
.split-layout .proj-card,
.split-layout .hist-card{
  width:100%;min-width:0;flex:none;border-radius:var(--radius-sm);border:1px solid transparent;
  background:transparent;box-shadow:none;text-align:left;transition:background var(--dur),border-color var(--dur);
}
.split-layout .ide-item:hover,
.split-layout .proj-card:hover,
.split-layout .hist-card:hover{background:var(--panel-3);border-color:#e4e9ee}
.split-layout .ide-item.active,
.split-layout .proj-card.active,
.split-layout .hist-card.active{background:var(--green-soft);border-color:var(--green-line);box-shadow:inset 2px 0 0 var(--green-dark)}

.split-layout .ide-item{display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:8px;padding:5px 7px}
.split-layout .ide-top{display:contents}
.ide-mark{width:24px;height:24px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:var(--fs-micro);font-weight:600;color:#fff;flex-shrink:0}
.ide-mark.mig{background:var(--green-dark)}
.ide-mark.onc{background:#2f8bf5}
.ide-mark.lg{width:32px;height:32px;font-size:var(--fs-meta)}
.split-layout .ide-mark{width:24px;height:24px}
.split-layout .ide-name{font-size:var(--fs-body);font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.split-layout .ide-sub{font-size:var(--fs-micro);color:var(--dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.split-layout .ide-foot{display:flex;flex-direction:column;align-items:flex-end;gap:1px;white-space:nowrap}
.split-layout .ide-size{font-size:var(--fs-meta);color:var(--ink-3)}
.split-layout .ide-item .badge{font-size:var(--fs-micro);padding:0 4px;line-height:1.6}
.split-layout .run-dot{width:4px;height:4px;margin-right:2px}

.split-layout .proj-card{padding:6px 8px;gap:3px}
.split-layout .pc-name{font-size:var(--fs-body);font-weight:600}
.split-layout .pc-path{font-size:var(--fs-micro)}
.split-layout .pc-size{font-size:var(--fs-meta)}
.split-layout .pc-foot .dim{display:none}
.split-layout .hist-card{padding:6px 8px;gap:3px}
.split-layout .hc-name{font-size:var(--fs-body);font-weight:600}
.split-layout .hc-meta{font-size:var(--fs-micro)}
.split-layout .hc-size{font-size:var(--fs-meta)}

/* ---------- 徽标 ---------- */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-micro);font-weight:600;padding:0 5px;border-radius:var(--radius-sm);line-height:1.5;white-space:nowrap}
.badge .ico{width:11px;height:11px}
.run-dot{width:5px;height:5px;border-radius:50%;background:var(--amber-bar);display:inline-block;flex-shrink:0}
.b-green{background:#eaf7e8;color:var(--green-ink);border:1px solid #d0eccd}
.b-red{background:var(--red-bg-2);color:var(--red-ink);border:1px solid var(--red-line)}
.b-amber{background:#fff7e6;color:var(--amber-ink);border:1px solid var(--amber-line)}
.b-blue{background:var(--blue-bg);color:var(--blue-ink);border:1px solid var(--blue-line)}
.b-gray{background:var(--panel-3);color:var(--muted);border:1px solid #e1e6ea}
.b-violet{background:#f3efff;color:var(--violet-ink);border:1px solid var(--violet-line)}
.b-plain{background:var(--panel);color:var(--muted);border:1px solid #e1e6ea;font-weight:600}

.detail{display:flex;flex-direction:column;gap:10px;padding:12px 14px 14px}
.split-layout .detail{padding:10px 12px 12px;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column}
.split-layout .detail > *{flex-shrink:0}
.split-layout .detail > .actions{position:sticky;bottom:0;z-index:2;background:var(--panel);margin:auto -12px -12px;padding:9px 12px 11px;border-top:1px solid var(--line-soft)}
.detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.detail-title{display:flex;align-items:center;gap:8px;min-width:0}
.detail-title > div{min-width:0}
.detail-title h2{font-size:var(--fs-title);font-weight:600;color:var(--ink-1)}
.detail-path{font-size:var(--fs-meta);color:var(--dim);font-family:var(--font-mono);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(660px,60vw)}
.detail-badges{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;flex-shrink:0}

.banner{display:flex;gap:8px;padding:7px 9px;border-radius:var(--radius-sm);font-size:var(--fs-body);line-height:1.5;border:1px solid}
.banner .b-ico{flex-shrink:0;display:inline-flex;align-items:center;line-height:1.3}
.banner .b-ico .ico{width:15px;height:15px}
.banner.warn{background:#fff9ea;border-color:var(--amber-line);color:var(--amber-ink)}
.banner.danger{background:#fff1f0;border-color:var(--red-line);color:var(--red-ink-2)}
.banner.info{background:#eff6ff;border-color:var(--blue-line);color:var(--blue-ink)}
.banner.ok{background:#f0faf0;border-color:#d0eccd;color:var(--green-ink)}
.banner b{font-weight:600}
.banner .btn{margin-top:4px}
.banner-actions{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap}
.banner>div{min-width:0}
.banner-actions .tag{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.proc-list{max-height:80px;overflow-y:auto;padding-right:2px}

.preview-card{background:#f6f9f6;border:1px solid #e0ece0;border-radius:var(--radius-sm);padding:9px 11px}
.preview-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.preview-top .t{font-size:var(--fs-meta);font-weight:600;color:var(--green-ink)}
.kv{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:var(--fs-body);padding:1px 0}
.kv .k{color:var(--muted)}
.kv .v{font-family:var(--font-mono);color:var(--ink-1);font-weight:600;text-align:right;word-break:break-all}
.kv .v.ok{color:var(--green-ink)}
.kv .v.warn{color:var(--amber-ink)}

.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:1px}
.section-title h3{font-size:var(--fs-body);font-weight:600;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.section-title .sub{font-size:var(--fs-meta);color:var(--dim)}
.rows{display:flex;flex-direction:column;gap:4px;min-width:0}
.row{display:flex;align-items:center;gap:8px;padding:6px 9px;background:var(--panel-2);border:1px solid var(--line-row);border-radius:var(--radius-sm);min-height:30px}
.row:hover{background:var(--panel-3);border-color:#e0e6eb}
.row.risk-green{box-shadow:inset 2px 0 0 var(--green)}
.row.risk-red{box-shadow:inset 2px 0 0 var(--red);background:var(--red-bg)}
.row.risk-yellow{box-shadow:inset 2px 0 0 var(--amber-bar)}
.row-check{flex-shrink:0;width:16px;height:16px;accent-color:var(--green-dark);cursor:pointer}
.row-main{flex:1;min-width:0}
.row-name{font-size:var(--fs-body);font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-desc{font-size:var(--fs-meta);color:var(--dim);margin-top:1px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0}
.row-size{font-size:var(--fs-body);color:var(--ink-3);font-variant-numeric:tabular-nums}
.lock{display:inline-flex;align-items:center;color:var(--red-ink);flex-shrink:0;width:16px;height:16px;justify-content:center}
.lock .ico{width:14px;height:14px}

/* 详情行：桌面列表 34px 行高，单行省略 */
.trow{display:grid;align-items:center;gap:10px;min-height:var(--row-h);padding:0 10px;background:var(--panel-2);border:1px solid var(--line-row);border-radius:var(--radius-sm);white-space:nowrap;transition:background var(--dur),border-color var(--dur)}
.trow:hover{background:var(--panel-3);border-color:#e0e6eb}
.trow.risk-green{box-shadow:inset 2px 0 0 var(--green)}
.trow.risk-red{box-shadow:inset 2px 0 0 var(--red);background:var(--red-bg)}
.trow.risk-yellow{box-shadow:inset 2px 0 0 var(--amber-bar);background:var(--amber-bg)}
.trow.dir{grid-template-columns:16px minmax(0,1.6fr) minmax(0,1.15fr) 80px 104px}
.trow.proj{grid-template-columns:16px minmax(0,1.6fr) minmax(0,1.2fr) 80px 104px}
.trow.pend{grid-template-columns:minmax(0,1.6fr) minmax(0,1.1fr) 80px auto}
.trow.cap{grid-template-columns:minmax(0,1.6fr) minmax(0,1.1fr) 80px 96px}
.tcell{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcell.lockcell{display:flex;align-items:center;justify-content:center;overflow:visible}
.tcell.tpath{font-size:var(--fs-body);font-weight:600;color:var(--ink-2);font-family:var(--font-mono)}
.tcell.tpath.badged{display:flex;align-items:center;gap:6px}
.tcell.tpath.badged .badge{flex-shrink:0}
.tcell.tpath.badged .tp{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcell.tdesc{font-size:var(--fs-meta);color:var(--dim)}
.tcell.tsize{font-size:var(--fs-body);color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums}
.tcell.acts{display:flex;align-items:center;justify-content:flex-end;gap:5px;overflow:visible}
.trow.pend.has-sug{align-items:start;padding:8px 10px;white-space:normal}
.trow.pend.has-sug .tcell.wrap{white-space:normal;overflow:visible}
.trow.pend.has-sug .tcell.tpath{padding-top:1px}

.kvbar{display:flex;align-items:stretch;background:var(--panel-2);border:1px solid var(--line-row);border-radius:var(--radius-sm);overflow:hidden}
.kvbar .kv-item{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:7px 10px;min-width:0;flex:1}
.kvbar .kv-item.wide{flex:2.2}
.kvbar .kv-item + .kv-item{border-left:1px solid var(--line-row)}
.kvbar .k{font-size:var(--fs-meta);color:var(--muted);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.kvbar .v{font-size:var(--fs-strong);color:var(--ink-1);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.kvbar .v.ok{color:var(--green-ink)}
.kvbar .v.warn{color:var(--amber-ink)}

/* 错误明细 / 失败项：逐条独占一行，路径在上、原因在下（长路径不截断、不与原因叠字） */
.err-list{display:flex;flex-direction:column;gap:4px;min-width:0}
.err-item{display:flex;flex-direction:column;gap:2px;min-width:0;padding:7px 10px;border-radius:var(--radius-sm);background:var(--red-bg);border:1px solid var(--red-line)}
.err-item .e-path{font-size:var(--fs-meta);font-family:var(--font-mono);color:var(--ink-2);line-height:1.5;overflow-wrap:anywhere}
.err-item .e-msg{font-size:var(--fs-meta);color:var(--red-ink-2);line-height:1.5;overflow-wrap:anywhere}
.err-item.plain{background:var(--panel-2);border-color:var(--line-row)}
.err-item.plain .e-msg{color:var(--text-2)}
/* 需要核对/复制的长值：纵向逐条、自动换行、附复制入口 */
.err-item .val-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.err-item .val-head .e-k{font-size:var(--fs-meta);color:var(--muted);line-height:1.4;overflow-wrap:anywhere}
.copy-btn{flex-shrink:0;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink-3);border-radius:var(--radius-sm);padding:1px 7px;font-size:var(--fs-micro);line-height:16px;cursor:pointer;transition:border-color var(--dur),background var(--dur)}
.copy-btn:hover{border-color:#a9bacb;background:var(--panel-3);color:var(--ink-1)}
.copy-btn:active{background:#e6ebf0}
.sw{width:34px;height:19px;border-radius:10px;background:#c6ced6;position:relative;border:none;flex-shrink:0;transition:background var(--dur)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:var(--shadow-sm);transition:left var(--dur)}
.sw.on{background:var(--green-dark)}
.sw.on::after{left:18px}
.sw:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--line-soft)}
.actions .spacer{flex:1}
.actions .note{font-size:var(--fs-meta);color:var(--dim)}

.tag{display:inline-flex;align-items:center;gap:3px;font-size:var(--fs-micro);color:var(--muted);background:var(--panel-3);border:1px solid #e1e6ea;border-radius:var(--radius-sm);padding:0 5px;white-space:nowrap;line-height:1.6}
.tag-code{font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--green-ink);background:var(--green-soft);border-color:var(--green-line)}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 20px;gap:7px}
.empty-ico{width:34px;height:34px;color:var(--green-dark);display:flex;align-items:center;justify-content:center;margin-bottom:2px}
.empty-ico .ico{width:30px;height:30px;stroke-width:1.3}
.empty h3{font-size:var(--fs-title);color:var(--ink-1);font-weight:600}
.empty p{font-size:var(--fs-body);color:var(--muted);line-height:1.6;max-width:440px}
/* 连接中 / 主机不可用：这两个空态用的是 div.empty-title/.empty-sub，原来没有任何样式（裸文本） */
.empty-title{font-size:var(--fs-title);color:var(--ink-1);font-weight:600}
.empty-sub{font-size:var(--fs-body);color:var(--muted);line-height:1.6;max-width:440px}
.empty .actions{border:none;padding-top:4px}
.empty-list{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-top:2px}

.scanning{padding:14px 16px}
.scanning h3{font-size:var(--fs-title);color:var(--ink-1);margin-bottom:2px;font-weight:600}
.scanning .lead{font-size:var(--fs-body);color:var(--muted);margin-bottom:10px}
.progress{height:6px;background:#e9eef0;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:var(--green-dark);transition:width var(--dur-slow) ease}
.progress-meta{display:flex;justify-content:space-between;font-size:var(--fs-meta);color:var(--dim);margin-top:5px}
.stage-list{display:flex;flex-direction:column;gap:0;margin-top:10px}
.stage{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:var(--radius-sm);font-size:var(--fs-body);color:var(--dim)}
.stage .s-ico{width:16px;height:16px;border-radius:50%;border:1px solid #d3dae1;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:transparent}
.stage .s-ico .ico{width:10px;height:10px}
.stage.done{color:var(--green-ink)}
.stage.done .s-ico{border-color:#8fd68b;background:#eaf7e8;color:var(--green-ink)}
.stage.active{background:var(--green-soft);color:var(--ink-2)}
.stage.active .s-ico{border-color:var(--green-dark);border-top-color:transparent;animation:spin 1s linear infinite}
.stage .s-meta{margin-left:auto;font-size:var(--fs-micro);color:var(--dim);font-family:var(--font-mono)}
@keyframes spin{to{transform:rotate(360deg)}}
.skeleton{margin-top:10px;display:flex;flex-direction:column;gap:4px;opacity:.7}
.sk-row{height:26px;border-radius:var(--radius-sm);background:linear-gradient(90deg,#eef2f5 25%,#f7f9fb 37%,#eef2f5 63%);background-size:400% 100%;animation:shimmer 1.4s infinite}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}

/* 项目 / 历史卡片（非分栏时） */
.proj-bar{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding-bottom:2px}
.proj-card{flex:1 1 0;min-width:190px;display:flex;flex-direction:column;gap:4px;padding:8px 10px;border-radius:var(--radius-sm);border:1px solid #e7ecf1;background:var(--panel);text-align:left}
.proj-card:hover{background:var(--panel-3);border-color:#cfd9e0}
.proj-card.active{background:var(--green-soft);border-color:#8fd68b;box-shadow:inset 0 -2px 0 var(--green-dark)}
.pc-top{display:flex;align-items:center;gap:7px;min-width:0}
.pc-name{font-size:var(--fs-body);font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.pc-path{font-size:var(--fs-micro);color:var(--dim);font-family:var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;white-space:nowrap}
.pc-size{font-size:var(--fs-meta);color:var(--ink-3);font-variant-numeric:tabular-nums}
.hist-bar{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding-bottom:2px}
.hist-card{flex:1 1 0;min-width:186px;display:flex;flex-direction:column;gap:3px;padding:7px 10px;border-radius:var(--radius-sm);border:1px solid #e7ecf1;background:var(--panel);text-align:left}
.hist-card:hover{background:var(--panel-3);border-color:#cfd9e0}
.hist-card.active{background:var(--green-soft);border-color:#8fd68b;box-shadow:inset 0 -2px 0 var(--green-dark)}
.hc-top{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0}
.hc-name{font-size:var(--fs-body);font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hc-meta{font-size:var(--fs-micro);color:var(--dim);font-family:var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;white-space:nowrap}
.hc-size{font-size:var(--fs-meta);color:var(--dim-2);font-variant-numeric:tabular-nums}

/* ---------- 表格：表头 sticky、斑马纹、行 hover、长列省略 ---------- */
.table{width:100%;border-collapse:collapse;font-size:var(--fs-body)}
.table th{font-size:var(--fs-meta);font-weight:600;color:var(--dim-2);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel-2)}
.table td{padding:6px 8px;border-bottom:1px solid var(--line-soft);color:var(--ink-3);vertical-align:middle;line-height:1.45}
.table tbody tr:nth-child(even) td{background:#fcfdfe}
.table tbody tr:nth-child(even):hover td{background:var(--panel-3)}
.table tr:last-child td{border-bottom:none}
.table tbody tr:hover td{background:var(--panel-3)}
.table .mono{font-family:var(--font-mono);font-size:var(--fs-meta);color:var(--ink-2)}
.table .num{text-align:right;font-variant-numeric:tabular-nums}
.table .right{text-align:right}
.table-wrap{overflow-x:auto}
.table-wrap > .table thead th{position:sticky;top:0;z-index:1;box-shadow:inset 0 -1px 0 var(--line)}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 规则表列宽策略：路径列固定占比 + 省略，其余列按内容 */
.learned-table{table-layout:fixed}
.learned-table th:nth-child(1),.learned-table td:nth-child(1){width:34%}
.learned-table th:nth-child(2),.learned-table td:nth-child(2){width:13%}
.learned-table th:nth-child(3),.learned-table td:nth-child(3){width:11%}
.learned-table th:nth-child(4),.learned-table td:nth-child(4){width:19%}
.learned-table th:nth-child(5),.learned-table td:nth-child(5){width:12%}
.learned-table th:nth-child(6),.learned-table td:nth-child(6){width:12%}
.plan-table{table-layout:fixed}
.plan-table .path-cell{white-space:normal;overflow-wrap:break-word}
.cell-val{display:flex;align-items:flex-start;gap:6px;min-width:0}
.cell-val .mono{flex:1;min-width:0;white-space:normal;overflow-wrap:anywhere;word-break:break-word;line-height:1.5}
.yellow-path{min-width:0;overflow-wrap:anywhere;word-break:break-word}

.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:var(--fs-meta);color:var(--muted);font-weight:600}
.field input,.field select{background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:4px 8px;font-size:var(--fs-body);color:var(--text);width:100%;min-height:26px}
.field input:focus,.field select:focus{outline:none;border-color:var(--focus);box-shadow:inset 0 0 0 1px var(--focus)}
.field .hint{font-size:var(--fs-micro);color:var(--dim)}
.field.full{grid-column:1/-1}

.diskbar{display:flex;height:10px;border-radius:var(--radius-sm);overflow:hidden;background:#e9eef0;border:1px solid var(--line)}
.diskbar span{height:100%}
.disk-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:7px;font-size:var(--fs-meta);color:var(--muted)}
.disk-legend i{width:7px;height:7px;border-radius:1px;display:inline-block;margin-right:4px}
.cat-cell{display:flex;align-items:center;gap:8px;min-width:0}
.cat-swatch{width:8px;height:8px;border-radius:1px;flex-shrink:0}
.cat-name{color:var(--ink-2);font-weight:600;white-space:nowrap}
.cat-desc{font-size:var(--fs-meta);color:#9aa3ac;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.timeline{display:flex;flex-direction:column;gap:0;padding-left:3px}
.tl-item{display:flex;gap:10px;position:relative;padding-bottom:12px}
.tl-item:not(:last-child)::before{content:"";position:absolute;left:7.5px;top:16px;bottom:0;width:1px;background:#e1e7ec}
.tl-dot{width:16px;height:16px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:var(--fs-micro);border:1px solid #cfd7de;background:var(--panel);color:#98a2ac;z-index:1}
.tl-dot .ico{width:9px;height:9px}
.tl-dot.ok{border-color:#8fd68b;background:#eaf7e8;color:var(--green-ink)}
.tl-dot.err{border-color:#f0b6b3;background:var(--red-bg-2);color:var(--red-ink)}
.tl-dot.now{border-color:#8fd68b;background:#eaf7e8;color:var(--green-ink)}
.tl-body{flex:1;min-width:0}
.tl-title{font-size:var(--fs-body);color:var(--ink-2);font-weight:600;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.tl-meta{font-size:var(--fs-meta);color:var(--dim);margin-top:2px;line-height:1.45;word-break:break-all}
.tl-code{font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--red-ink);background:var(--red-bg-2);border:1px solid var(--red-line);padding:0 4px;border-radius:var(--radius-sm);display:inline-block;margin-top:3px}

/* ---------- 弹窗 ---------- */
.modal-mask{position:fixed;inset:0;background:rgba(32,42,51,.40);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--panel);border:1px solid #ccd5dd;border-radius:var(--radius-lg);box-shadow:var(--shadow);width:580px;max-width:100%;max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.modal.wide{width:740px}
.modal:focus{outline:none}
.modal-head{padding:10px 14px 9px;border-bottom:1px solid var(--line-soft);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;background:var(--panel-2)}
.modal-head h3{font-size:var(--fs-title);font-weight:600;color:var(--ink-1);display:flex;align-items:center;gap:7px}
.modal-head .sub{font-size:var(--fs-meta);color:var(--dim);margin-top:2px;line-height:1.45}
.modal-x{background:none;border:none;color:var(--disabled-ink);width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;padding:0;border-radius:var(--radius-sm);transition:background var(--dur),color var(--dur)}
.modal-x .ico{width:13px;height:13px}
.modal-x:hover{color:var(--ink-1);background:#e6ebef}
.modal-body{padding:12px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.modal-body > *{flex-shrink:0}
.modal-foot{padding:9px 14px;border-top:1px solid var(--line-soft);display:flex;gap:6px;justify-content:flex-end;align-items:center;flex-wrap:wrap;background:var(--panel-2)}
.modal-foot .left{margin-right:auto;font-size:var(--fs-meta);color:var(--dim)}

.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sum-box{background:var(--panel-2);border:1px solid var(--line-row);border-radius:var(--radius-sm);padding:8px 10px}
.sum-box .k{font-size:var(--fs-micro);color:var(--dim)}
.sum-box .v{font-size:var(--fs-strong);font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums;color:var(--ink-1)}

.settings-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.settings-row:last-child{border-bottom:none}
.settings-row .k{font-size:var(--fs-body);color:var(--ink-2)}
.settings-row .d{font-size:var(--fs-meta);color:var(--dim);margin-top:2px}
.settings-row .ctrl{flex-shrink:0}
.settings-row select,.settings-row input[type=text]{background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:4px 8px;font-size:var(--fs-body);color:var(--text);min-height:26px}
.settings-row select:focus,.settings-row input[type=text]:focus{outline:none;border-color:var(--focus);box-shadow:inset 0 0 0 1px var(--focus)}
.settings-row input[type=text]{width:280px;font-family:var(--font-mono)}

.toast{position:fixed;bottom:14px;left:50%;transform:translate(-50%,6px);background:#333b43;border:1px solid #454e57;color:#fff;padding:6px 12px;border-radius:var(--radius-sm);font-size:var(--fs-body);box-shadow:0 4px 14px rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:opacity var(--dur),transform var(--dur);z-index:300;max-width:70vw;overflow-wrap:anywhere}
.toast.show{opacity:1;transform:translate(-50%,0)}

.nav-label{font-size:var(--fs-micro);font-weight:600;color:#a0a9b2;padding:3px 6px 2px}

/* ---------- 规则：按软件列表（扁平行，点击开弹窗） ---------- */
.appgrp{background:transparent;border-bottom:1px solid var(--line-soft)}
.appgrp:last-child{border-bottom:none}
.ag-head{display:flex;align-items:center;gap:10px;width:100%;padding:8px 8px;background:transparent;border:none;text-align:left;border-radius:var(--radius-sm);transition:background var(--dur)}
.ag-head:hover{background:var(--panel-3)}
.ag-mark{width:22px;height:22px;border-radius:var(--radius-sm);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:var(--fs-micro);font-weight:600}
.ag-main{flex:1;min-width:0}
.ag-name{display:block;font-size:var(--fs-body);font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-sub{display:block;font-size:var(--fs-meta);color:var(--dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-stats{display:flex;align-items:center;gap:9px;flex-shrink:0;font-size:var(--fs-meta);color:var(--muted)}
.ag-dot{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.ag-hits{font-variant-numeric:tabular-nums;color:var(--ink-3);white-space:nowrap}
.ag-go{font-size:var(--fs-meta);color:var(--green-ink);flex-shrink:0;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}

.rule-form.mform{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);row-gap:6px;align-items:end}
.mform > .mwide{grid-column:span 2}
.mform > button{justify-self:end;white-space:nowrap}

/* ---------- AI ---------- */
.btn-ai{background:var(--violet-bg);color:var(--violet-ink);border-color:var(--violet-line)}
.btn-ai:hover{background:#eae3ff;border-color:#c8b6fb;color:#5b35c8}
.btn-ai:active{background:#e0d7fb}
.ai-key{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--violet-ink);background:#f6f2ff;border:1px solid #e2d8fb;border-radius:var(--radius-sm);padding:1px 7px;white-space:nowrap}
.suggest{display:flex;flex-direction:column;gap:3px}
.sug-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sug-reason{font-size:var(--fs-body);color:var(--ink-3)}
.conf{font-family:var(--font-mono);font-weight:600;color:var(--violet-ink)}

.muted{color:var(--muted)} .dim{color:var(--dim)} .ok{color:var(--green-ink)} .warn{color:var(--amber-ink)} .bad{color:var(--red)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.nowrap{white-space:nowrap} .truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-flex{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mt-2{margin-top:8px} .mt-3{margin-top:12px} .mt-4{margin-top:16px}
.center{text-align:center}
.divider{height:1px;background:var(--line-soft);margin:2px 0}

/* 内置图标：统一 1.7 描边、跟随 currentColor，不再混用文本符号 */
.ico{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:-.14em}
.ico-lg{width:16px;height:16px}

@media (max-width:1280px){
  .topnav{height:46px;padding:0 8px}
  .brand{width:150px}
  .brand-sub{display:none}
  .nav-item{min-width:70px;padding:0 9px}
  .system-ver{display:none}
  .main-scroll{padding:9px 10px 14px}
  .topbar{padding:7px 10px}
  .trow.dir{grid-template-columns:16px minmax(0,1.55fr) minmax(0,1.05fr) 76px 98px;gap:9px}
  .trow.proj,.trow.pend,.trow.cap{gap:9px}
  .detail-path{max-width:min(520px,52vw)}
}
@media (max-width:1180px){
  .split-layout{grid-template-columns:212px minmax(0,1fr)}
  .split-layout .bar{padding:6px}
  .split-layout .ide-item{grid-template-columns:22px minmax(0,1fr) auto;gap:6px;padding:4px 6px}
  .split-layout .ide-mark{width:22px;height:22px;font-size:var(--fs-micro)}
  .split-layout .ide-name{font-size:var(--fs-body)}
  .split-layout .ide-item .badge{font-size:var(--fs-micro)}
  .split-layout .bar-top .legend{font-size:var(--fs-meta)}
  .kvbar .kv-item{padding:6px 9px}
  .kvbar .v{font-size:var(--fs-body)}
}
@media (max-width:1239px){
  .content > .cols{display:flex;flex-direction:column;flex:none;min-height:0}
  .content > .cols > .panel.panel-scroll{flex:none}
  .content > .cols > .panel.panel-scroll > .panel-body{overflow:visible;flex:none}
  .content > .cols .scroll-y{overflow:visible;flex:none}
}
/* ---------- ≤1080：最小可用宽度 1024 档（设计文档 §11.4.1 / §4.4） ---------- */
@media (max-width:1080px){
  .topnav{height:44px}
  .nav-item{min-width:62px;padding:0 7px;gap:5px;font-size:var(--fs-meta)}
  .nav-ico,.nav-ico svg{width:14px;height:14px}
  .brand{width:146px}
  .system-chip{padding:0 7px;font-size:var(--fs-meta)}
  .system-chip.icon{width:24px}
  .empty{padding:22px 16px}
  .modal,.modal.wide{width:min(580px,calc(100vw - 32px))}
  /* 表格 → 行卡：横向滚动只允许在 ≥1080 生效 */
  .table-wrap{overflow:visible}
  .table,.table tbody{display:block;width:100%}
  .table thead{display:none}
  .table tr{display:flex;flex-wrap:wrap;align-items:center;gap:3px 10px;min-height:38px;padding:7px 10px;margin-bottom:5px;background:var(--panel-2);border:1px solid var(--line-row);border-radius:var(--radius-sm)}
  .table td{display:block;padding:0;border:none;text-align:left;white-space:normal}
  .table td:first-child{flex:1 1 100%;min-width:0}
  /* 待确认/失败项：不折叠成横排，保持纵向列表 */
  .cols .trow.pend,.modal .trow.pend{grid-template-columns:minmax(0,1fr);row-gap:4px;padding:8px 10px;align-items:start}
  .cols .trow.pend .tcell.tpath,.modal .trow.pend .tcell.tpath,
  .cols .trow.pend .tcell.tsize,.modal .trow.pend .tcell.tsize,
  .cols .trow.pend .tcell.tdesc,.modal .trow.pend .tcell.tdesc,
  .cols .trow.pend .tcell.wrap,.modal .trow.pend .tcell.wrap,
  .cols .trow.pend .tcell.acts,.modal .trow.pend .tcell.acts{grid-column:1;grid-row:auto;justify-self:start;text-align:left}
  .cols .trow.pend .tcell.acts,.modal .trow.pend .tcell.acts{justify-content:flex-start}
}
/* ---------- 欢迎页（T16 · 本地优先） ---------- */
.welcome-mask{
  position:fixed;inset:0;z-index:120;overflow:auto;padding:20px;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg);
}
.welcome-card{width:660px;max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden}
.welcome-head{display:flex;align-items:center;gap:12px;padding:16px 22px 14px;border-bottom:1px solid var(--line-soft);background:var(--panel-2)}
.welcome-logo{width:32px;height:32px;border-radius:var(--radius);flex-shrink:0}
.welcome-head h2{font-size:var(--fs-title);font-weight:600;color:var(--ink-1);line-height:1.25}
.welcome-head .sub{font-size:var(--fs-meta);color:var(--dim);margin-top:2px}
.welcome-tag{margin-left:auto;flex-shrink:0;font-size:var(--fs-micro);color:var(--green-ink);background:var(--green-soft);border:1px solid var(--green-line);border-radius:var(--radius-sm);padding:1px 7px;white-space:nowrap}
.welcome-body{padding:14px 22px 16px;display:flex;flex-direction:column;gap:11px}
.welcome-lead{font-size:var(--fs-body);color:var(--text-2);line-height:1.7}
.welcome-points{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px}
.welcome-point{display:flex;gap:7px;font-size:var(--fs-body);color:var(--text-2);line-height:1.55}
.welcome-point i{font-style:normal;color:var(--green-dark);font-weight:600;flex-shrink:0;display:inline-flex}
.welcome-point .ico{width:13px;height:13px;margin-top:3px}
.login-box{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel-2);padding:11px 13px;display:flex;flex-direction:column;gap:8px}
.login-box .lb-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.login-box .lb-title{font-size:var(--fs-body);font-weight:600;color:var(--ink-1)}
.login-box .lb-note{font-size:var(--fs-micro);color:var(--dim);line-height:1.55;flex:1;min-width:200px;text-align:right}
.login-btns{display:flex;gap:7px;flex-wrap:wrap}
.login-btn{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:var(--radius-sm);border:1px solid var(--line-strong);background:var(--panel);color:var(--ink-1);font-size:var(--fs-body);min-height:28px;transition:border-color var(--dur),background var(--dur),color var(--dur)}
.login-btn:hover:not(:disabled){border-color:#bcc6cf;background:var(--panel-3)}
.login-btn:active:not(:disabled){background:#e6ebf0}
.login-btn:disabled{background:var(--disabled-bg);color:var(--disabled-ink);border-color:var(--disabled-line);cursor:not-allowed}
.login-btn .p-ico{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:var(--radius-sm);background:var(--panel-3);color:var(--text-2);font-size:9px;font-weight:600;flex-shrink:0}
.login-btn:disabled .p-ico{background:#e9edf1;color:#a8b1b9}
.login-btn .p-state{font-size:var(--fs-micro);color:#6d7781;background:var(--panel-3);border-radius:var(--radius-sm);padding:1px 6px}
.login-btn:disabled .p-state{background:#e9edf1;color:var(--dim)}
.login-flow{display:flex;flex-direction:column;gap:7px;border-top:1px dashed var(--line);padding-top:8px}
.login-flow .lf-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:var(--fs-body);color:var(--text-2)}
.login-flow .lf-dot{width:7px;height:7px;border-radius:50%;background:var(--amber);flex-shrink:0;animation:dw-pulse 1.5s ease-in-out infinite}
.login-flow .lf-usercode{font-family:var(--font-mono);font-size:18px;font-weight:600;letter-spacing:2px;color:var(--ink-1);background:var(--panel);border:1px solid #cfd8df;border-radius:var(--radius-sm);padding:4px 12px;user-select:all;-webkit-user-select:all}
.login-flow .lf-actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.login-flow .lf-hint{font-size:var(--fs-micro);color:var(--dim);line-height:1.6}
@keyframes dw-pulse{0%,100%{opacity:1}50%{opacity:.3}}
.welcome-foot{padding:11px 22px;border-top:1px solid var(--line-soft);background:var(--panel-2);display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.welcome-foot .hint{font-size:var(--fs-micro);color:var(--dim);line-height:1.55;flex:1;min-width:180px}

/* ---------- Star 蒙版（T16 · 可关闭） ---------- */
.star-mask{position:fixed;inset:0;z-index:110;background:rgba(30,40,49,.38);display:flex;align-items:center;justify-content:center;padding:20px}
.star-card{width:430px;max-width:100%;background:var(--panel);border:1px solid #ccd5dd;border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:18px 20px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.star-ico{font-size:0;line-height:1;color:#e8a600;display:inline-flex}
.star-ico .ico{width:22px;height:22px;fill:#f2a900;stroke:#d99000;stroke-width:1.2}
.star-title{font-size:var(--fs-title);font-weight:600;color:var(--ink-1)}
.star-body{font-size:var(--fs-body);color:var(--text-2);line-height:1.65}
.star-actions{display:flex;gap:7px;margin-top:2px;flex-wrap:wrap;justify-content:center}
.star-actions .btn[disabled]{opacity:1}
.star-note{font-size:var(--fs-micro);color:var(--dim);line-height:1.5}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

class RpcError extends Error {

  const req = { v: 1, id: 'ui-' + (++rpcSeq), method: method, params: params || {} };

    let res;

    catch (e) { throw new RpcError({ code: 'INTERNAL', detail: { reason: 'invalid response' } }); }

    access_errors: item.access_errors || 0,
    is_reparse: !!item.is_reparse,
    target_exists: !!item.target_exists
  };
}

function synthDirectories(tool) {
  const out = [];
  ((tool && tool.directories) || []).forEach(d => {
    const paths = (d.resolved && d.resolved.length) ? d.resolved : [];
    paths.forEach(p => {
      out.push({
        path: String(p), target_path: '', type: d.type || 'dir',
        safety: d.safety || 'yellow', reason: d.reason || d.reason_key || '',
        handling: d.handling || d.status_label || '', size_bytes: 0,
        item_id: '', can_migrate: d.safety !== 'red', requires_confirm: d.safety === 'yellow',
        blocked_code: '', blocked_reason: '', migrated: false, source: '', rule_id: '',
        file_count: 0, access_errors: 0, is_reparse: false, target_exists: false
      });
    });
  });
  return out;
}

function adapterIde(tool) {
  const items = itemsFor(tool);
  const root = toolRoot(tool);
  const target = String(migratedTarget(tool) || '').replace(/[\\/][^\\/]*$/, '');
  return {
    id: tool.id,
    name: tool.name,
    kind: tool.kind || 'ide',
    platform: 'windows',
    processes: ((tool.runtime && tool.runtime.catalog_names) || []),
    directories: items.length ? items.map(adapterDir) : synthDirectories(tool),
    runtime: {
      root: root,
      location: driveOf(root).replace(':', '') || 'C',
      migrated: isToolMigrated(tool),
      target: target,
      running: runningProcs(tool).map(p => ({ name: p.name, pid: p.pid }))
    }
  };
}

function preselectGreen() {
  state.checked = {};
  state.confirmed = {};
  state.pendingYellow = null;
  allItems().forEach(it => {
    if (it.safety === 'green' && it.can_migrate !== false && !it.migrated_job_id && !it.blocked_reason) {
      state.checked[it.item_id] = true;
    }
  });
}

function setSnapshot(snap) {
  state.data.snapshot = snap || null;
  const ides = toolList().map(adapterIde);
  CATALOG.ides.length = 0;
  Array.prototype.push.apply(CATALOG.ides, ides);
  if (!CATALOG.ides.some(x => x.id === state.selectedIde)) {
    state.selectedIde = CATALOG.ides.length ? CATALOG.ides[0].id : '';
  }
  preselectGreen();
  syncKpi();
  syncDiskView();
}

function applySettings(s) {
  if (!s) return;
  state.data.settings = s;
  const ai = s.ai || null;
  state.settings = {
    targetRoot: s.target_root || '',
    autoStart: !!s.launch_at_startup,
    autoStartSupported: s.launch_at_startup_supported !== false,
    autoStartError: s.launch_at_startup_error || '',
    autoMaintenance: !!s.auto_maintenance,
    logsDir: (s.paths && s.paths.logs_dir) || '',
    uninstall: s.uninstall_policy === 'rollback' ? 'remove' : (s.uninstall_policy || 'keep'),
    dataRoot: s.data_root || '',
    appVersion: s.app_version || '',
    ai: ai,
    aiEnabled: !!(ai && ai.enabled),
    aiProvider: aiPresetFor(ai && ai.base_url),
    aiBaseUrl: (ai && ai.base_url) || '',
    aiModel: (ai && ai.model) || '',
    aiKeySet: !!(ai && ai.api_key_set),
    aiKeySource: (ai && ai.api_key_source) || 'none',
    aiKeyError: (ai && ai.api_key_error) || ''
  };
}

function applyDisk(d) {
  if (!d) return;
  state.data.disk = d;
  const src = d.source || {};
  const tgt = d.target || {};
  DRIVE.totalGB = src.available ? (src.total || 0) / GIB : 0;
  DRIVE.usedGB = src.available ? (src.used || 0) / GIB : 0;
  DRIVE.freeGB = src.available ? (src.free || 0) / GIB : 0;
  DRIVE.targetFreeGB = tgt.available ? (tgt.free || 0) / GIB : 0;
  DRIVE.targetDrive = driveOf(tgt.path) || DRIVE.targetDrive;
  syncDiskView();
}

function setSeg(key, gb) {
  const s = DISK_SEGMENTS.find(x => x.key === key);
  if (s) s.gb = Math.max(0, gb || 0);
}

function syncDiskView() {
  const tools = {};
  allTools().forEach(t => { tools[t.id] = t; });
  const bucket = { 'ai-ide': 0, 'ai-cli': 0, 'pkg': 0, 'jetbrains': 0, 'models': 0 };
  allItems().forEach(it => {
    const tool = tools[it.tool_id];
    const kind = (tool && tool.kind) || 'ide';
    const rel = String(it.rel_path || '').toLowerCase();
    let cat = kind === 'ide' ? 'ai-ide' : 'ai-cli';
    if (/(^|[\\/])(npm|npm-cache|pnpm|yarn|pip|cargo|m2|gradle)([\\/]|$)/.test(rel)) cat = 'pkg';
    else if (/jetbrains|\.idea/.test(rel)) cat = 'jetbrains';
    else if (/ollama|huggingface/.test(rel)) cat = 'models';
    bucket[cat] += it.bytes || 0;
  });
  DISK_CATEGORIES.forEach(c => { c.gb = (bucket[c.id] || 0) / GIB; });
  const ideGB = (bucket['ai-ide'] + bucket['ai-cli']) / GIB;
  const devGB = (bucket.pkg + bucket.jetbrains) / GIB;
  const modelsGB = bucket.models / GIB;
  setSeg('disk.ide', ideGB);
  setSeg('disk.dev', devGB);
  setSeg('disk.sys', 0);
  setSeg('disk.models', modelsGB);
  setSeg('disk.other', Math.max(0, DRIVE.usedGB - ideGB - devGB - modelsGB));
  setSeg('disk.free', DRIVE.freeGB);
}

function syncKpi() {
  const snap = snapshot();
  const st = (snap && snap.stats) || {};
  KPI.reclaimableGB = (st.migratable_bytes || 0) / GIB;
  KPI.lastScan = snap && snap.scanned_at ? fmtDate(snap.scanned_at) : '';
  const migrates = historyItems().filter(x => x.type === 'migrate' && x.result === 'success');
  KPI.freedGB = migrates.reduce((a, x) => a + (x.freed || 0), 0) / GIB;
  KPI.freedOps = migrates.length;
}

/* ---------- 启动握手 ---------- */
function hostReady() {
  const has = () => !!(window.pywebview && window.pywebview.api && typeof window.pywebview.api.rpc === 'function');
  if (has()) return Promise.resolve(true);
  return new Promise(resolve => {
    let settled = false;
    let tries = 0;
    const finish = ok => {
      if (settled) return;
      settled = true;
      clearInterval(timer);
      window.removeEventListener('pywebviewready', onReady);
      resolve(ok);
    };
    const onReady = () => finish(has());
    window.addEventListener('pywebviewready', onReady);
    const timer = setInterval(() => {
      tries++;
      if (has()) finish(true);
      else if (tries >= 120) finish(false);
    }, 100);
  });
}

function bootstrap() {
  state.booting = true;
  state.bootError = '';
  bindAuthKeys();
  return hostReady().then(ok => {
    if (!ok) {
      state.booting = false;
      state.connected = false;
      state.bootError = t('conn.hostBody');
      return null;
    }
    return rpc('app.hello').then(hello => {
      applySettings(hello.settings);
      applyAuth(hello.auth || null);
      applyDisk(hello.disk || null);
      state.data.recovery = hello.recovery || null;
      state.connected = true;
      const scan = hello.scan || {};
      const ready = scan.available
        ? rpc('scan.result').then(snap => setSnapshot(snap)).catch(() => {})
        : Promise.resolve();
      return ready
        .then(() => rpc('rules.learned.list')).then(l => { state.data.learned = l; }).catch(() => {})
        .then(() => rpc('job.list', { active_only: true })).catch(() => ({ jobs: [] }))
        .then(list => {
          const active = (list && list.jobs && list.jobs[0]) || null;
          if (active && active.kind === 'scan' && ['queued', 'running', 'cancelling'].indexOf(active.state) >= 0) {
            state.data.scanJob = active;
            state.scanning = true;
            state.scanPct = scanPercent(active);
            startScanPolling(active.job_id);
          }
        })
        .then(() => refreshRecovery())
        .then(() => loadHistory());
    }).catch(err => {
      state.connected = false;
      state.bootError = errText(err);
    }).then(() => { state.booting = false; });
  }).then(() => { render(); });
}

/* ---------- 扫描任务 ---------- */
const SCAN_STAGES = ['discover', 'measure', 'classify', 'done'];

function scanStage(job) {
  const p = (job && job.progress) || {};
  const s = p.stage || p.step || 'discover';
  return SCAN_STAGES.indexOf(s) >= 0 ? s : 'discover';
}

function scanPercent(job) {
  if (!job) return 0;
  if (job.state === 'done') return 100;
  const p = job.progress || {};
  const stage = p.stage || p.step || '';
  if (stage === 'measure') {
    const total = p.targets_total || 0, done = p.targets_done || 0;
    if (total > 0) return Math.min(88, 10 + Math.round(done / total * 78));
    return 15;
  }
  if (stage === 'classify') return 92;
  if (stage === 'discover') return 6;
  return job.state === 'running' ? 10 : 3;
}

function stopScanPolling() {
  if (state.data.scanTimer) {
    clearInterval(state.data.scanTimer);
    state.data.scanTimer = null;
  }
}

/* 扫描是后台操作，可以从任意页面发起：记住发起时的位置，扫完回到原页面，
   而不是一律把人丢到 IDE 数据页（规则学习里点「重新扫描」最明显）。 */
function enterScanRoute() {
  const here = location.hash || ('#' + state.tab);
  state.data.scanFrom = state.tab === 'ide' ? '' : here;
  if (state.data.scanFrom) render();
  else App.go('#ide/scanning');
}
function leaveScanRoute() {
  const back = state.data.scanFrom || '';
  state.data.scanFrom = '';
  const here = location.hash || ('#' + state.tab);
  if (!back) { App.go('#ide' + (CATALOG.ides.length ? '' : '/empty')); return; }
  if (back !== here) return;            /* 用户自己走开了，不再把人拽回去 */
  return rpc('rules.learned.list')
    .then(l => { state.data.learned = l; })
    .catch(() => {})
    .then(() => render());
}

function startScanPolling(jobId) {
  stopScanPolling();
  state.data.scanTimer = setInterval(() => pollScan(jobId), 350);
  pollScan(jobId);
}

function scanFailed(err) {
  state.data.scanError = errText(err) || t('scan.failed');
  state.scanning = false;
  App.toast(t('scan.failed') + ': ' + state.data.scanError);
  if (state.data.scanFrom) { state.data.scanFrom = ''; render(); return; }
  if (state.tab !== 'ide' || state.sub !== 'scanning') App.go('#ide/scanning');
  else render();
}

function pollScan(jobId) {
  if (!jobId) return Promise.resolve();
  return rpc('scan.status', { job_id: jobId }).then(res => {
    const job = res && res.job ? res.job : null;
    if (!job) { stopScanPolling(); return; }
    state.data.scanJob = job;
    state.scanPct = scanPercent(job);
    if (job.state === 'done') {
      stopScanPolling();
      KPI.scanDuration = fmtDuration(jobDuration(job));
      return rpc('scan.result').then(snap => {
        setSnapshot(snap);
        state.scanning = false;
        state.data.scanJob = null;
        state.scanPct = 100;
        const n = (snap && snap.stats && snap.stats.tools_present) || 0;
        App.toast(t('scan.done', { n: n }));
        return rpc('disk.info').then(applyDisk).catch(() => {});
      }).then(() => {
        return leaveScanRoute();
      }).catch(scanFailed);
    }
    if (job.state === 'cancelled') {
      stopScanPolling();
      state.scanning = false;
      state.data.scanJob = null;
      App.toast(t('scan.cancelled'));
      const back = state.data.scanFrom || '';
      state.data.scanFrom = '';
      if (back) {
        if (back === (location.hash || ('#' + state.tab))) render();
        return;
      }
      App.go('#ide' + (snapshot() ? '' : '/empty'));
      return;
    }
    if (job.state === 'failed') {
      stopScanPolling();
      freshRenderIfScanning();
      scanFailed(job.error);
      return;
    }
    freshRenderIfScanning();
  }).catch(err => {
    stopScanPolling();
    scanFailed(err);
  });
}

function freshRenderIfScanning() {
  if (state.tab === 'ide' && state.sub === 'scanning') { render(); return; }
  /* 就地重扫（规则学习等页面）：只刷顶栏的进度，不动正文。 */
  if (state.scanning) renderTopbar();
}

/* ---------- 操作历史（src/core/store/history） ---------- */
function historyItems() {
  const h = state.data.history;
  return (h && h.items) || [];
}
function historyStats() {
  const h = state.data.history;
  return (h && h.stats) || {};
}
function fmtDuration(sec) {
  if (sec === null || sec === undefined || isNaN(sec)) return '—';
  const s = Math.max(0, Math.round(Number(sec)));
  const m = Math.floor(s / 60);
  return m ? m + 'm ' + (s % 60) + 's' : s + 's';
}
function jobDuration(job) {
  if (!job || !job.started_at) return null;
  const end = job.finished_at || job.updated_at;
  const a = Date.parse(job.started_at), b = Date.parse(end);
  if (isNaN(a) || isNaN(b)) return null;
  return Math.max(0, Math.round((b - a) / 1000));
}

function applyHistory(res) {
  const items = (res && res.items) || [];
  HISTORY.length = 0;
  items.forEach(h => {
    const type = h.type === 'rollback' ? 'rollback' : (h.type === 'clean' ? 'clean' : 'migrate');
    const failed = h.result === 'failed';
    const steps = type === 'rollback'
      ? ['rollbackStep1', 'rollbackStep2', failed ? 'failedStep' : 'rollbackStep3']
      : type === 'clean'
        ? ['cleanStep1']
        : ['migrateStep1', 'migrateStep2', 'migrateStep3', failed ? 'failedStep' : 'migrateStep4'];
    let note;
    if (failed) note = 'failed.sourceSafe';
    else if (type === 'rollback') note = 'history.rollbackDone';
    else if (h.can_rollback) note = 'history.canRollback';
    else note = 'history.noRollback';
    HISTORY.push({
      id: h.id,
      at: fmtDate(h.at),
      type: type,
      app: h.app || h.tool_id || '',
      from: h.from || '',
      to: h.to || '',
      freed: (h.freed || 0) / GIB,
      duration: fmtDuration(h.duration_seconds),
      result: h.result === 'rolledback' ? 'rolledback' : (failed ? 'failed' : 'success'),
      canRollback: !!h.can_rollback,
      code: h.code || '',
      note: note,
      steps: steps,
      job_id: h.job_id || '',
      tool_id: h.tool_id || ''
    });
  });
  if (!HISTORY.some(x => x.id === state.selectedHistory)) {
    state.selectedHistory = HISTORY.length ? HISTORY[0].id : '';
  }
  syncKpi();
}

function loadHistory() {
  if (state.data.historyLoading) return Promise.resolve();
  state.data.historyLoading = true;
  return rpc('history.list', { filter: 'all', limit: 500 }).then(res => {
    state.data.history = res || { items: [], count: 0, stats: {} };
    state.data.historyError = '';
    applyHistory(state.data.history);
  }).catch(err => {
    state.data.historyError = errText(err);
    applyHistory({ items: [] });
  }).then(res => {
    state.data.historyLoading = false;
    return res;
  });
}

/* ---------- 迁移 / 回滚任务流 ---------- */
const MIGRATE_STAGES = ['prepare', 'backup', 'copy', 'verify', 'swap', 'link', 'link_verify', 'cleanup', 'done'];
const ROLLBACK_STAGES = ['precheck', 'link_remove', 'copy', 'verify', 'restore', 'config', 'cleanup', 'record', 'done'];

function flowOpen(kind) { return !!(state.data.flow && state.data.flow.kind === kind); }
function flowBusy() {
  const f = state.data.flow;
  return !!(f && (f.phase === 'loading' || f.phase === 'starting' || f.phase === 'progress'));
}
function stopFlowPolling() {
  if (state.data.jobTimer) {
    clearInterval(state.data.jobTimer);
    state.data.jobTimer = null;
  }
}
function closeFlow() {
  stopFlowPolling();
  state.data.flow = null;
}
function refreshAfterJob() {
  return Promise.all([
    rpc('scan.result').then(snap => setSnapshot(snap)).catch(() => {}),
    rpc('disk.info').then(applyDisk).catch(() => {}),
    loadHistory()
  ]);
}

/* ---------- 启动恢复（journal 状态由 src/app 判定，UI 只负责展示与发起） ---------- */
function recoveryItems() {
  const r = state.data.recovery;
  return (r && r.items) || [];
}
function refreshRecovery() {
  return rpc('recovery.list').then(r => {
    state.data.recovery = r || { items: [], count: 0, warnings: [] };
    return state.data.recovery;
  }).catch(() => state.data.recovery);
}
function stopRecoveryPolling() {
  if (state.data.recoveryTimer) {
    clearInterval(state.data.recoveryTimer);
    state.data.recoveryTimer = null;
  }
}
function recoveryPct(job) {
  if (!job) return 4;
  if (job.state === 'done') return 100;
  const p = job.progress || {};
  if (p.done) return 100;
  const stages = ['precheck', 'copy', 'verify', 'swap', 'link', 'link_verify', 'restore', 'config', 'cleanup', 'record', 'recover'];
  const idx = stages.indexOf(p.stage || '');
  if (idx < 0) return 35;
  return Math.max(5, Math.min(96, Math.round((idx + 1) / (stages.length + 1) * 100)));
}
function recoveryStageText(job) {
  const p = (job && job.progress) || {};
  const stage = p.stage || p.step;
  if (!stage || stage === 'done') return t('recovery.running');
  const key = 'progress.stage.' + stage;
  const label = t(key);
  return label === key ? String(stage) : label;
}
function startRecoveryPolling(runnerJobId) {
  stopRecoveryPolling();
  state.data.recoveryTimer = setInterval(() => pollRecovery(runnerJobId), 400);
  pollRecovery(runnerJobId);
}
function pollRecovery(runnerJobId) {
  return rpc('job.status', { job_id: runnerJobId }).then(res => {
    const run = state.data.recoveryRun;
    if (!run || run.runnerJobId !== runnerJobId) return;
    const job = res && res.job;
    if (!job) { render(); return; }
    run.job = job;
    if (job.state === 'done') {
      stopRecoveryPolling();
      run.summary = job.summary || {};
      run.phase = run.summary.ok === false ? 'failed' : 'success';
      if (run.phase === 'failed') {
        run.error = {
          code: run.summary.error_code || 'RECOVERY_REQUIRED',
          detail: { message: run.summary.error_message || '' }
        };
      }
      refreshAfterJob().then(() => refreshRecovery()).then(() => render());
      return;
    }
    if (job.state === 'failed' || job.state === 'cancelled') {
      stopRecoveryPolling();
      run.phase = 'failed';
      run.error = job.error || { code: 'INTERNAL', detail: {} };
      refreshAfterJob().then(() => refreshRecovery()).then(() => render());
      return;
    }
    render();
  }).catch(err => {
    stopRecoveryPolling();
    const run = state.data.recoveryRun;
    if (run && run.runnerJobId === runnerJobId) {
      run.phase = 'failed';
      run.error = err;
      render();
    }
  });
}
function recoveryBanner() {
  const items = recoveryItems();
  const run = state.data.recoveryRun;
  if (!items.length && !run) return '';
  let html = '';
  if (items.length) {
    const busy = !!(run && (run.phase === 'starting' || run.phase === 'progress'));
    const rows = items.map(it => {
      const actions = (it.actions && it.actions.length ? it.actions : ['recover']);
      const buttons = actions.map(a => `<button type="button" class="btn btn-xs ${a === 'rollback' ? 'btn-ghost' : 'btn-soft'}" ${busy ? 'disabled' : ''} onclick="App.recoveryStart('${esc(it.job_id)}','${esc(a)}')">${esc(t(a === 'rollback' ? 'recovery.rollback' : 'recovery.recover'))}</button>`).join('');
      const human = it.needs_human ? ` · <b>${esc(t('recovery.needsHuman'))}</b>` : '';
      const ignore = it.ignorable ? `<button type="button" class="btn btn-ghost btn-xs" title="${esc(t('recovery.ignoreHint'))}" ${busy ? 'disabled' : ''} onclick="App.recoveryIgnore('${esc(it.job_id)}')">${esc(t('recovery.ignore'))}</button>` : '';
      const detail = it.detail ? `<span class="dim" style="font-size:var(--fs-meta);white-space:normal">${esc(it.detail)}</span>` : '';
      return `<div class="kv-item wide">
        <span class="k">${esc(it.tool_name || it.tool_id || '')} · ${esc(it.label || it.state_label || it.state || '')}${human}${it.type === 'rollback' ? ' · ' + esc(t('history.type.rollback')) : ''}</span>
        <span class="v" style="font-weight:500;white-space:normal;font-size:var(--fs-meta)">${esc(it.source_path || '')}</span>
        <span class="dim" style="font-size:var(--fs-meta)">${esc(fmtBytes(it.bytes || 0))} · ${esc(fmtDate(it.updated_at))}</span>
        ${detail}
        <div class="banner-actions">${buttons}${ignore}</div>
      </div>`;
    }).join('');
    html += `<div class="banner danger" style="margin-bottom:10px;align-items:flex-start">
      <span class="b-ico">${ico('shield')}</span>
      <div style="flex:1;min-width:0">
        <b>${esc(t('recovery.title'))}</b> · ${esc(t('recovery.count', { n: items.length }))}
        <div style="margin-top:2px">${esc(t('recovery.desc'))}</div>
        <div class="kvbar mt-3" style="flex-direction:column;background:#fff8f7;border-color:#f2c9c6">${rows}</div>
      </div>
    </div>`;
  }
  if (run) {
    const phase = run.phase;
    if (phase === 'starting' || phase === 'progress') {
      const pct = recoveryPct(run.job);
      html += `<div class="banner info" style="margin-bottom:10px;align-items:flex-start">
        <span class="b-ico">${ico('info')}</span>
        <div style="flex:1;min-width:0">
          <b>${esc(t('recovery.running'))}</b>
          <div class="progress mt-3"><i style="width:${pct}%"></i></div>
          <div class="progress-meta"><span>${esc(t('progress.percent', { pct: pct }))}</span><span>${esc(recoveryStageText(run.job))}</span></div>
        </div>
      </div>`;
    } else if (phase === 'success') {
      const s = run.summary || {};
      html += `<div class="banner ok" style="margin-bottom:10px;align-items:flex-start">
        <span class="b-ico">${ico('check')}</span>
        <div style="flex:1;min-width:0">
          <b>${esc(t('recovery.done'))}</b><br>${esc(t('recovery.successHint'))}
          <div class="mono" style="font-size:var(--fs-meta);margin-top:2px">${esc(s.source_path || run.sourcePath || '')}</div>
          <div class="banner-actions"><button type="button" class="btn btn-ghost btn-xs" onclick="App.dismissRecovery()">${esc(t('action.close'))}</button></div>
        </div>
      </div>`;
    } else {
      const err = run.error || {};
      const msg = (err.detail && err.detail.message) || (run.summary && run.summary.error_message) || '';
      html += `<div class="banner danger" style="margin-bottom:10px;align-items:flex-start">
        <span class="b-ico">${ico('cross')}</span>
        <div style="flex:1;min-width:0">
          <b>${esc(t('recovery.failed'))}</b>${err.code ? ` · <span class="mono">${esc(err.code)}</span>` : ''}<br>${esc(msg || t('recovery.failedHint'))}
          <div class="banner-actions">
            <button type="button" class="btn btn-ghost btn-xs" onclick="App.retryRecovery()">${esc(run.action === 'rollback' ? t('recovery.rollback') : t('recovery.recover'))}</button>
            <button type="button" class="btn btn-ghost btn-xs" onclick="App.dismissRecovery()">${esc(t('action.close'))}</button>
          </div>
        </div>
      </div>`;
    }
  }
  return html;
}

/* ---------- 迁移 / 回滚轮询 ---------- */
function startFlowPolling(kind, jobId) {
  stopFlowPolling();
  state.data.jobTimer = setInterval(() => pollFlow(kind, jobId), 350);
  pollFlow(kind, jobId);
}
function pollFlow(kind, jobId) {
  return rpc('job.status', { job_id: jobId }).then(res => {
    const job = res && res.job;
    const flow = state.data.flow;
    if (!flow || flow.kind !== kind || (flow.runnerJobId || flow.jobId) !== jobId) return;
    if (!job) { render(); return; }
    flow.job = job;
    if (job.state === 'done') {
      stopFlowPolling();
      flow.summary = job.summary || {};
      const ok = kind === 'rollback'
        ? flow.summary.ok !== false
        : !flow.summary.failed && !flow.summary.cancelled;
      flow.phase = ok ? 'success' : 'failed';
      if (!ok) {
        flow.errorScope = 'job';
        if (kind === 'rollback') {
          flow.error = {
            code: flow.summary.error_code || 'ROLLBACK_FAILED',
            detail: { message: flow.summary.error_message || '' }
          };
        } else {
          const first = (flow.summary.items || []).find(x => !x.ok) || {};
          flow.error = {
            code: first.state || 'MIGRATION_FAILED',
            detail: { message: first.error_message || '' }
          };
        }
      }
      refreshAfterJob().then(() => render());
      return;
    }
    if (job.state === 'failed' || job.state === 'cancelled') {
      stopFlowPolling();
      flow.phase = 'failed';
      flow.errorScope = 'job';
      flow.error = job.error || { code: 'INTERNAL', detail: {} };
      refreshAfterJob().then(() => render());
      return;
    }
    render();
  }).catch(err => {
    stopFlowPolling();
    const flow = state.data.flow;
    if (flow && flow.kind === kind && (flow.runnerJobId || flow.jobId) === jobId) {
      flow.phase = 'failed';
      flow.error = err;
      render();
    }
  });
}
function migratePct(flow) {
  const job = flow.job || {};
  const p = job.progress || {};
  if (job.state === 'done' || p.done) return 100;
  const total = Math.max(1, p.items_total || ((flow.plan && flow.plan.items && flow.plan.items.length) || 1));
  const done = Math.max(p.items_done || 0, p.index || 0);
  const idx = Math.max(0, MIGRATE_STAGES.indexOf(p.stage || 'prepare'));
  const span = MIGRATE_STAGES.length - 1;
  const partial = Math.min(1, (idx + (p.status === 'done' ? 1 : 0.4)) / span);
  return Math.min(99, Math.max(2, Math.round((done + partial) / total * 100)));
}
function rollbackPct(flow) {
  const job = flow.job || {};
  const p = job.progress || {};
  if (job.state === 'done' || p.stage === 'done') return 100;
  const idx = Math.max(0, ROLLBACK_STAGES.indexOf(p.stage || 'precheck'));
  return Math.min(99, Math.max(3, Math.round(idx / (ROLLBACK_STAGES.length - 1) * 100)));
}
function stageRows(stages, current, doneFlag, prefix) {
  const active = Math.max(0, stages.indexOf(current || stages[0]));
  return stages.map((s, i) => {
    const done = doneFlag || i < active;
    const act = !done && i === active;
    return `<div class="stage ${done ? 'done' : act ? 'active' : ''}">
      <span class="s-ico">${done ? ico('check') : ''}</span><span>${esc(t(prefix + s))}</span>
      <span class="s-meta">${done ? esc(t('progress.done')) : act ? esc(t('progress.running')) : esc(t('progress.waiting'))}</span>
    </div>`;
  }).join('');
}
function errDetailList(lines, cls) {
  if (!lines.length) return '';
  return `<div class="err-list${cls ? ' ' + cls : ''}">${lines.map(line => `<div class="err-item plain"><span class="e-msg">${esc(line)}</span></div>`).join('')}</div>`;
}
/* 长路径/任务号：沿用失败明细的纵向条目，值完整换行并逐项提供复制 */
function valueList(entries, cls) {
  const rows = entries.filter(e => e && e.value !== undefined && e.value !== null && String(e.value) !== '');
  if (!rows.length) return '';
  return `<div class="err-list${cls ? ' ' + cls : ''}">${rows.map(e => `<div class="err-item plain val-item">
      <div class="val-head"><span class="e-k">${esc(e.label)}</span><button type="button" class="copy-btn" onclick="App.copyValue(this)">${esc(t('common.copy'))}</button></div>
      <span class="e-path">${esc(e.value)}</span>
    </div>`).join('')}</div>`;
}
function pathCell(value) {
  /* 只在反斜杠后断行：路径不会像 "Co\nde\Cache" 那样被腰斩，复制按钮取到的仍是原文 */
  const shown = esc(value || '').replace(/\\/g, '\\<wbr>');
  return `<td class="path-cell"><div class="cell-val"><span class="mono">${shown}</span><button type="button" class="copy-btn" onclick="App.copyValue(this)">${esc(t('common.copy'))}</button></div></td>`;
}

function errorDetailLines(err) {
  if (!err) return [];
  const d = err.detail || {};
  const code = err.code || '';
  const lines = [];
  if (code === 'BLOCKED_PROCESS') {
    (d.items || []).forEach(it => {
      const proc = it.process || {};
      const names = (proc.processes || []).map(p => (p.name || '') + ' · PID ' + (p.pid || '')).join(' | ');
      lines.push([it.tool_name || it.tool_id || '', it.source_path || '', names].filter(Boolean).join(' · '));
    });
  } else if (code === 'BLOCKED_RED_PATH') {
    (d.items || []).forEach(it => lines.push([it.tool_id || '', it.source_path || '', it.reason || ''].filter(Boolean).join(' · ')));
  } else if (code === 'PERMISSION_DENIED') {
    (d.items || []).forEach(it => {
      const errs = it.access_errors;
      const count = Array.isArray(errs) ? errs.length : (typeof errs === 'number' ? errs : 0);
      lines.push([
        it.source_path || '',
        count ? t('blocked.accessErrors', { n: count }) : '',
        it.is_reparse ? t('blocked.reparse') : ''
      ].filter(Boolean).join(' · '));
    });
  } else if (code === 'INSUFFICIENT_SPACE') {
    lines.push(t('blocked.space', { free: fmtBytes(d.free_bytes || 0), need: fmtBytes(d.required_bytes || 0) }));
  } else if (code === 'DUPLICATE_TARGET') {
    (d.duplicates || []).forEach(x => lines.push((x.target_path || '') + ' × ' + ((x.items || []).length)));
    (d.existing || []).forEach(x => lines.push([x.source_path, x.target_path].filter(Boolean).join(' → ')));
  } else if (code === 'TARGET_NOT_NTFS') {
    lines.push(t('blocked.ntfs', { fs: d.fs || '?' }));
  } else if (d.message) {
    lines.push(String(d.message));
  } else if (d.reason) {
    lines.push(String(d.reason));
  }
  return lines.filter(Boolean);
}
