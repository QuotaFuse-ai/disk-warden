function reasonText(dir) {
  if (!dir) return '';
  const key = dir.reason || '';
  if (key) {
    const label = t(key);
    if (label !== key) return label;
  }
  return dir.blocked_reason || key || t('reason.unknown');
}

function diagnosticsText() {
  const s = state.data.settings || {};
  const st = (snapshot() && snapshot().stats) || {};
  return [
    'Disk Warden v' + (s.app_version || '0.1.0'),
    'Protocol: ' + (s.protocol_version || '-'),
    'OS: ' + (navigator.userAgent || 'unknown'),
    'Locale: ' + LANG,
    'Last scan: ' + (KPI.lastScan || t('meta.neverScan')) + ' (' + (KPI.scanDuration || '—') + ')',
    'IDEs: ' + (st.tools_present || 0) + ' · dirs: ' + (st.items || 0),
    'Target root: ' + state.settings.targetRoot,
    'Data root: ' + (s.data_root || '-')
  ].join('\n');
}

function copyText(text) {
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).then(() => true).catch(fallback);
  }
  return Promise.resolve(fallback());
}

/* ---------- 登录 / 欢迎页 / Star 蒙版（T16） ---------- */
/* Device Flow 只有一个进行中的状态；其余都是终态。 */
const AUTH_ACTIVE_STATES = ['pending'];
/* 后端没有返回 providers 时（老版本主机端）也要把按钮画成「未配置」，绝不假装能登录。 */
const AUTH_PROVIDER_FALLBACK = [
  { provider: 'github', label: 'GitHub', configured: false, client_id_env: 'DISK_WARDEN_GITHUB_CLIENT_ID' }
];

function applyAuth(auth) {
  if (!auth || typeof auth !== 'object') return;
  const star = auth.star || {};
  const login = auth.login && typeof auth.login === 'object' ? auth.login : null;
  const gitee = auth.gitee && typeof auth.gitee === 'object' ? auth.gitee : {};
  state.auth = {
    providers: Array.isArray(auth.providers) ? auth.providers : [],
    signed_in: !!auth.signed_in,
    login: login,
    welcome_seen: auth.welcome_seen !== false,
    star: { pending: !!star.pending, dismissed: !!star.dismissed, starred: !!star.starred },
    secure_storage: auth.secure_storage !== false,
    flow: auth.flow && typeof auth.flow === 'object' ? auth.flow : null,
    repository_url: auth.repository_url || state.auth.repository_url || '',
    gitee: {
      provider: 'gitee',
      label: gitee.label || 'Gitee',
      url: gitee.url || state.auth.gitee.url || '',
      available: !!gitee.available
    }
  };
}

function authProviders() {
  return state.auth.providers.length ? state.auth.providers : AUTH_PROVIDER_FALLBACK;
}

function authFlowActive() {
  const f = state.auth.flow;
  return !!f && AUTH_ACTIVE_STATES.indexOf(f.state) >= 0;
}

/* Gitee 只有「打开仓库页」这一种行为：不授权、不读 token、不做服务端判定。 */
function giteeStarButton(cls) {
  const g = state.auth.gitee || {};
  const label = t('star.gitee') + (g.available ? '' : ' · ' + t('star.giteeSoon'));
  if (g.available && g.url) {
    return `<button type="button" class="${esc(cls)}" onclick="App.openGitee()">${esc(label)}</button>`;
  }
  return `<button type="button" class="${esc(cls)}" disabled aria-disabled="true">${esc(label)}</button>`;
}

function authErrorText(errOrCode) {
  const raw = typeof errOrCode === 'string'
    ? errOrCode
    : (errOrCode && (errOrCode.code || errOrCode.message_key)) || '';
  const code = String(raw).replace(/^error\./, '');
  if (code) {
    const dict = I18N[LANG] || I18N['zh-CN'];
    const text = dict['error.' + code] || I18N['zh-CN']['error.' + code];
    if (text) return text;
  }
  return t('error.AUTH_FAILED');
}

function authFlowSeconds(flow) {
  if (!flow || !flow.expires_at) return 0;
  const left = Math.round((new Date(flow.expires_at).getTime() - Date.now()) / 1000);
  return left > 0 ? left : 0;
}

function stopAuthPolling() {
  if (state.data.authTimer) {
    clearInterval(state.data.authTimer);
    state.data.authTimer = null;
  }
}

function finishLogin() {
  stopAuthPolling();
  App.toast(t('toast.signedIn'));
  render();
}

function startAuthPolling() {
  stopAuthPolling();
  state.data.authTimer = setInterval(() => {
    if (!authFlowActive()) { stopAuthPolling(); return; }
    rpc('auth.status').then(auth => {
      const wasActive = authFlowActive();
      applyAuth(auth);
      if (wasActive && authFlowActive()) { renderWelcome(); return; }
      stopAuthPolling();
      if (state.auth.signed_in && !state.auth.welcome_seen) {
        rpc('welcome.seen')
          .then(res => { applyAuth(res); finishLogin(); })
          .catch(() => finishLogin());
        return;
      }
      const flow = state.auth.flow || {};
      const err = flow.error || null;
      if (flow.state === 'authenticated' && state.auth.signed_in) { finishLogin(); return; }
      if (flow.state === 'expired') App.toast(authErrorText('AUTH_TIMEOUT'));
      else if (flow.state === 'failed' && err && err.code) App.toast(authErrorText(err.code));
      render();
    }).catch(() => { stopAuthPolling(); });
  }, 700);
}

function authFlowBanner(flow) {
  const err = flow.error || {};
  const st = flow.state;
  if (AUTH_ACTIVE_STATES.indexOf(st) >= 0) {
    const sec = authFlowSeconds(flow);
    const code = String(flow.user_code || '');
    const uri = String(flow.verification_uri || '');
    return `<div class="login-flow" role="status" aria-live="polite">
      <div class="lf-row"><span class="lf-dot" aria-hidden="true"></span><b>${esc(t('welcome.deviceTitle'))}</b></div>
      <div class="lf-row"><span class="lf-usercode" id="auth-user-code">${esc(code)}</span></div>
      <div class="lf-hint">${esc(t('welcome.deviceHint', { uri: uri }))}</div>
      <div class="lf-actions">
        <button type="button" class="btn btn-primary btn-xs" onclick="App.authCopyCode()">${esc(t('welcome.deviceCopy'))}</button>
        <button type="button" class="btn btn-ghost btn-xs" onclick="App.authOpenVerify()">${esc(t('welcome.deviceOpen'))}</button>
        <button type="button" class="btn btn-ghost btn-xs" onclick="App.authCancel()">${esc(t('welcome.cancelLogin'))}</button>
      </div>
      ${sec ? `<div class="lf-row"><span class="dim">${esc(t('welcome.waitingTime', { sec: sec }))}</span></div>` : ''}
    </div>`;
  }
  if (st === 'failed') {
    const reason = String(err.reason || '');
    const provider = authProviders().find(p => p.provider === flow.provider) || {};
    const retry = provider.configured
      ? `<button type="button" class="btn btn-ghost btn-xs" onclick="App.authStart('${esc(flow.provider)}')">${esc(t('welcome.retryLogin'))}</button>`
      : '';
    return `<div class="banner danger"><span class="b-ico">${ico('warn')}</span><div><b>${esc(authErrorText(err.code))}</b>${reason ? `<br><span class="dim">${esc(t('welcome.errorReason', { reason: reason }))}</span>` : ''}${retry ? `<div class="banner-actions">${retry}</div>` : ''}</div></div>`;
  }
  if (st === 'cancelled' || st === 'expired') {
    return `<div class="banner info"><span class="b-ico">${ico('info')}</span><div>${esc(authErrorText(st === 'expired' ? 'AUTH_TIMEOUT' : 'AUTH_CANCELLED'))}</div></div>`;
  }
  return '';
}

      <div class="welcome-body">

        <div class="welcome-points">
          ${[1, 2, 3, 4].map(n => `<div class="welcome-point"><i aria-hidden="true">${ico('check')}</i><span>${esc(t('welcome.point' + n))}</span></div>`).join('')}
        </div>
        <div class="login-box">
          <div class="lb-top"><span class="lb-title">${esc(t('welcome.loginTitle'))}</span><span class="lb-note">${esc(t('welcome.loginNote'))}</span></div>
          <div class="login-btns">${providerBtns}</div>
          ${envHint}

          ${auth.signed_in ? `<div class="banner ok"><span class="b-ico">${ico('check')}</span><div>${esc(t('welcome.signedIn', { login: login.login || '' }))}</div></div>` : ''}
          ${auth.secure_storage ? '' : `<div class="banner warn"><span class="b-ico">${ico('warn')}</span><div>${esc(t('welcome.insecure'))}</div></div>`}

function filteredIdes() {
  const q = state.search.trim().toLowerCase();

    if (!q) return true;
    return i.name.toLowerCase().indexOf(q) >= 0 || i.directories.some(d => d.path.toLowerCase().indexOf(q) >= 0);

/* 进程列表可能很长（Cursor 一次就开十几个进程）。整串塞进一个 nowrap 标签会撑破
   卡片、溢出窗口，所以按进程拆成可换行的标签，超过 6 个折叠成「另 N 个」，
   完整列表放进 title，鼠标悬停可见。 */
const PROC_CHIP_LIMIT = 6;
function processChips(running) {
  const shown = running.slice(0, PROC_CHIP_LIMIT);
  const rest = running.length - shown.length;
  const all = running.map(p => p.name + ' · PID ' + p.pid).join(' | ');
  const chips = shown.map(p => `<span class="tag mono">${esc(p.name)} · PID ${esc(String(p.pid))}</span>`).join('');
  const more = rest > 0
    ? `<span class="tag mono" title="${esc(all)}">${esc(t('ide.processMore', { n: rest }))}</span>`
    : '';
  return `<div class="banner-actions proc-list">${chips}${more}</div>`;
}

function itemRow(ide, d, i) {
  const checked = isChecked(ide.id, i, d);
  const badge = d.migrated ? `<span class="badge b-green">${ico('check')} ${esc(t('common.migrated'))}</span>`
    : d.safety === 'green' ? `<span class="badge b-green">${esc(t('common.green'))}</span>`
    : d.safety === 'red' ? `<span class="badge b-red">${ico('shield')} ${esc(t('common.red'))}</span>`
    : `<span class="badge b-amber">${ico('question')} ${esc(t('common.yellow'))}</span>`;
  const left = d.migrated
    ? `<span class="tcell lockcell"><span class="lock" title="${esc(t('ide.migratedLocked'))}" aria-label="${esc(t('ide.migratedLocked'))}">${ico('check')}</span></span>`
    : d.safety === 'red'
    ? `<span class="tcell lockcell"><span class="lock" title="${esc(t('ide.redLocked'))}" aria-label="${esc(t('ide.redLocked'))}">${ico('shield')}</span></span>`
    : `<span class="tcell lockcell"><input class="row-check" type="checkbox" ${checked ? 'checked' : ''} ${d.safety === 'yellow' && !isConfirmed(ide.id, i) ? 'disabled' : ''} onclick="App.toggleCheck('${ide.id}',${i})" aria-label="${esc(d.path)}"></span>`;
  const confirmed = d.safety === 'yellow' && isConfirmed(ide.id, i);
  const reason = d.migrated
    ? t('ide.migratedRowReason')
    : reasonText(d) + (d.safety === 'red' ? ' · ' + t('ide.redLocked') : '');
  const act = d.migrated
    ? `<button type="button" class="btn btn-ghost btn-xs" onclick="App.rollbackDir('${ide.id}',${i})">${esc(t('action.rollback'))}</button>`
    : d.safety === 'yellow' && !confirmed
    ? `<button type="button" class="btn btn-ghost btn-xs" onclick="App.openYellow('${ide.id}',${i})">${esc(t('action.confirmYellow'))}</button>`
    : confirmed ? `<span class="badge b-gray">${esc(t('common.confirmed'))}</span>`
    : d.handling ? `<span class="tag tag-code">${esc(d.handling)}</span>` : '';
  return `<div class="trow dir risk-${d.migrated ? 'green' : d.safety}" title="${esc(d.path)} · ${esc(reason)}">
    ${left}
    <span class="tcell tpath badged">${badge}<span class="tp" title="${esc(d.path)}">${esc(d.path)}</span></span>

    <span class="tcell tsize">${fmtBytes(d.size_bytes)}</span>
    <span class="tcell acts">${act}</span>
  </div>`;
}

function scanDisplayStage(stage) {
  if (stage === 'discover') return 'enumerate';
  if (stage === 'measure') return 'size';
  return stage;
}

function renderScanning() {
  const job = state.data.scanJob;
  const bridgeStage = scanStage(job);
  const pct = state.scanning ? (state.scanPct || 0) : (job && job.state === 'done' ? 100 : (job && job.progress && job.progress.done ? 100 : 0));
  const stages = ['enumerate', 'match', 'size', 'process', 'classify', 'done'];
  const active = Math.max(0, stages.indexOf(scanDisplayStage(bridgeStage)));
  return `<div class="content narrow">
    <section class="panel scanning">
      <h3>${esc(t('scan.title'))}</h3>
      <p class="lead">${esc(t('scan.lead'))}</p>
      <div class="progress"><i style="width:${pct}%"></i></div>
      <div class="progress-meta"><span>${esc(t('common.progress'))} · ${pct}%</span><span>${esc(t('meta.scope'))}</span></div>
      <div class="stage-list">
        ${stages.map((s, i) => `<div class="stage ${i < active ? 'done' : i === active ? 'active' : ''}">
          <span class="s-ico">${i < active ? ico('check') : ''}</span><span>${esc(t('scan.stage.' + s))}</span>
          <span class="s-meta">${i < active ? esc(t('progress.done')) : i === active ? esc(t('progress.running')) : esc(t('progress.waiting'))}</span>

function renderModal() {
  const kind = modalKind();
  const root = document.getElementById('modal-root');
  if (!kind) {
    root.innerHTML = '';
    const back = renderModal.returnFocus;
    renderModal.lastKind = '';
    renderModal.returnFocus = null;
    if (back && document.contains(back)) back.focus();
    return;
  }
  let html = '';
  if (kind === 'settings') html = modalSettings();
  else if (kind === 'ai') html = modalAi();
  else if (kind === 'feedback') html = modalFeedback();
  else if (kind === 'process-blocked') html = modalBlocked();
  else if (kind === 'yellow-confirm') html = modalYellow();
  else if (kind === 'migrate') html = modalMigrateFlow();
  else if (kind === 'rollback') html = modalRollbackFlow();
  if (!html) { root.innerHTML = ''; return; }
  const opened = renderModal.lastKind !== kind;
  if (opened) renderModal.returnFocus = document.activeElement;
  renderModal.lastKind = kind;
  root.innerHTML = `<div class="modal-mask" onclick="App.closeModal()">
    <div class="modal ${kind === 'process-blocked' || kind === 'settings' || kind === 'ai' || kind === 'migrate' || kind === 'rollback' ? 'wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1" onclick="event.stopPropagation()">${html}</div>

  /* 只在弹窗打开那一次抢焦点：重渲染时不动，否则弹窗里的输入框会被打断 */
  const box = root.querySelector('.modal');
  if (box && opened) box.focus();
}

const DIALOG_FOCUSABLE = 'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
/* 焦点圈：Tab 不允许跑到弹窗背后的页面上去（pywebview 没有独立窗口，遮罩不是真边界） */
function trapDialogFocus(ev) {
  if (ev.key !== 'Tab') return;
  const box = document.querySelector('.modal-mask .modal, .welcome-card, .star-card');
  if (!box) return;
  const items = Array.prototype.filter.call(box.querySelectorAll(DIALOG_FOCUSABLE), el => el.offsetParent !== null);
  if (!items.length) { ev.preventDefault(); box.focus(); return; }
  const first = items[0];
  const last = items[items.length - 1];
  const active = document.activeElement;
  const inside = box === active || box.contains(active);
  if (ev.shiftKey && (!inside || active === first || active === box)) { ev.preventDefault(); last.focus(); }
  else if (!ev.shiftKey && (!inside || active === last)) { ev.preventDefault(); first.focus(); }
}

/* ---------- 迁移 / 回滚任务流弹窗 ---------- */
function flowPlanErrorBody(err) {
  const lines = errorDetailLines(err);
  return `<div class="banner danger"><span class="b-ico">${ico('cross')}</span><div><b>${esc(t('blocked.planTitle'))}</b><br>${esc(t('blocked.planDesc'))}</div></div>
    ${errDetailList(lines, 'mt-3')}`;
}

function modalMigrateFlow() {
  const f = state.data.flow;
  if (!f) return '';
  const ide = getIde(f.toolId);
  const toolName = (f.plan && f.plan.items && f.plan.items[0] && f.plan.items[0].tool_name) || (ide && ide.name) || f.toolId || '';
  if (f.phase === 'loading') {
    return modalShell(t('preview.title'), t('preview.sub'),
      `<div class="banner info"><span class="b-ico">${ico('info')}</span><div>${esc(t('progress.stage.prepare'))}</div></div>`,
      `<button type="button" class="btn btn-ghost btn-sm" onclick="App.closeFlow()">${esc(t('action.cancel'))}</button>`, true);
  }
  if (f.phase === 'confirm' || f.phase === 'starting') return modalMigrateConfirm(f, ide, toolName);
  if (f.phase === 'progress') return modalMigrateProgress(f, toolName);
  if (f.phase === 'success') return modalMigrateSuccess(f, toolName);
  return modalMigrateFailed(f, toolName);
}

function modalMigrateConfirm(f, ide, toolName) {
  const plan = f.plan || { items: [] };
  const items = plan.items || [];
  const total = plan.total_bytes || 0;
  const need = plan.need_bytes || 0;
  const free = plan.free_bytes || 0;
  const enough = need <= free;
  const yellow = items.filter(it => it.requires_confirm || it.safety === 'yellow');
  const pending = yellow.filter(it => !f.yellowConfirmed[it.item_id]);
  const busy = f.phase === 'starting';
  const reds = ide ? safetyCount(ide, 'red') : 0;
  const rows = items.map(it => `<tr>
      ${pathCell(it.source_path)}
      ${pathCell(it.final_path)}
      <td>${it.safety === 'green' ? `<span class="badge b-green">${esc(t('common.green'))}</span>` : `<span class="badge b-amber">${ico('question')} ${esc(t('common.yellow'))}</span>`}</td>
      <td>${esc(fmtBytes(it.bytes || 0))}</td>
    </tr>`).join('');
  const yellowBlock = yellow.length ? `<div class="banner warn mt-3"><span class="b-ico">${ico('warn')}</span><div>
      <div>${esc(t('preview.yellowPending', { n: pending.length }))}</div>
      ${yellow.map(it => `<label style="display:flex;align-items:center;gap:8px;margin-top:6px;font-size:var(--fs-meta)">
        <input type="checkbox" ${f.yellowConfirmed[it.item_id] ? 'checked' : ''} onchange="App.toggleYellowConfirm('${esc(it.item_id)}')">
        <span class="mono yellow-path">${esc(it.source_path)}</span>
      </label>`).join('')}
    </div></div>` : '';
  const redBlock = reds ? `<div class="banner info mt-3"><span class="b-ico">${ico('shield')}</span><div>${esc(t('preview.willExcludeRedDesc', { n: reds }))}</div></div>` : '';
  const errBlock = f.error ? `<div class="mt-3">${flowPlanErrorBody(f.error)}</div>` : '';
  const body = `
    <div class="kvbar">
      <div class="kv-item"><span class="k">${esc(t('preview.summary'))}</span><span class="v">${esc(t('common.items', { n: items.length }))} · ${esc(fmtBytes(total))}</span></div>
      <div class="kv-item"><span class="k">${esc(t('ide.needSpace'))}</span><span class="v">${esc(fmtBytes(need))}</span></div>
      <div class="kv-item"><span class="k">${esc(t('preview.targetFree'))}</span><span class="v ${enough ? 'ok' : 'warn'}">${esc(fmtBytes(free))} · ${esc(enough ? t('preview.spaceOk') : t('preview.spaceBad'))}</span></div>
    </div>
    <div class="table-wrap mt-3"><table class="table plan-table">
      <colgroup><col style="width:38%"><col style="width:38%"><col style="width:12%"><col style="width:12%"></colgroup>
      <thead><tr><th>${esc(t('preview.from'))}</th><th>${esc(t('preview.to'))}</th><th>${esc(t('common.safety'))}</th><th>${esc(t('common.size'))}</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    ${redBlock}${yellowBlock}
    <div class="banner info mt-3"><span class="b-ico">${ico('info')}</span><div>${esc(t('preview.junction'))}</div></div>
    ${errBlock}`;
  const foot = `<button type="button" class="btn btn-ghost btn-sm" ${busy ? 'disabled' : ''} onclick="App.closeFlow()">${esc(t('preview.back'))}</button>
    <span class="spacer"></span>
    <button type="button" class="btn btn-primary btn-sm" ${busy || pending.length ? 'disabled' : ''} title="${esc(pending.length ? t('preview.yellowPending', { n: pending.length }) : '')}" onclick="App.confirmMigrate()">${esc(t('preview.start'))}</button>`;
  return modalShell(t('preview.title'), toolName + ' · ' + t('preview.sub'), body, foot, true, !busy);
}

function modalMigrateProgress(f, toolName) {
  const job = f.job || {};
  const p = job.progress || {};
  const pct = migratePct(f);
  const done = !!(p.done || job.state === 'done');
  const total = p.items_total || ((f.plan && f.plan.items && f.plan.items.length) || 0);
  const body = `
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div class="progress-meta"><span>${esc(t('progress.percent', { pct: pct }))}</span><span>${esc(t('common.items', { n: (p.items_done || 0) + ' / ' + total }))}</span></div>
    <div class="stage-list mt-3">${stageRows(MIGRATE_STAGES, p.stage || 'prepare', done, 'progress.stage.')}</div>
    <div class="banner warn mt-3"><span class="b-ico">${ico('warn')}</span><div>${esc(t('progress.keepOpen'))}</div></div>`;
  const foot = `<span class="note">${esc(t('progress.cancelDisabled'))}</span>`;
  return modalShell(t('progress.title'), toolName, body, foot, true, false);
}

function modalMigrateSuccess(f, toolName) {
  const summary = f.summary || {};
  const plan = f.plan || {};
  const bytes = summary.bytes || plan.total_bytes || 0;
  const results = (summary.items && summary.items.length) ? summary.items : (plan.items || []);
  const values = [];
  results.forEach((it, i) => {
    const suffix = results.length > 1 ? ' ' + (i + 1) : '';
    values.push({ label: t('preview.from') + suffix, value: it.source_path || '' });
    values.push({ label: t('preview.to') + suffix, value: it.target_path || it.final_path || '' });
    values.push({ label: t('history.job') + suffix, value: it.job_id || '' });
  });
  if (!results.length) values.push({ label: t('history.job'), value: f.jobId || '' });
  const body = `
    <div class="banner ok"><span class="b-ico">${ico('check')}</span><div>${esc(t('success.sub'))}</div></div>
    <div class="kvbar mt-3">
      <div class="kv-item"><span class="k">${esc(t('success.freed'))}</span><span class="v ok">${esc(fmtBytes(bytes))}</span></div>
      <div class="kv-item"><span class="k">${esc(t('success.verified'))}</span><span class="v">${esc(t('success.verifiedValue'))}</span></div>
      <div class="kv-item"><span class="k">${esc(t('success.duration'))}</span><span class="v">${esc(fmtDuration(jobDuration(f.job)))}</span></div>
    </div>
    ${valueList(values, 'mt-3')}
    <div class="note mt-3">${esc(t('success.rollbackable'))}</div>`;
  const foot = `<button type="button" class="btn btn-ghost btn-sm" onclick="App.gotoHistory()">${esc(t('success.viewHistory'))}</button>
    <span class="spacer"></span>
    <button type="button" class="btn btn-primary btn-sm" onclick="App.closeFlow()">${esc(t('success.done'))}</button>`;
  return modalShell(t('success.title'), toolName, body, foot, true);
}

function modalMigrateFailed(f, toolName) {
  const summary = f.summary || {};
  const failed = (summary.items || []).filter(x => !x.ok);
  const err = f.error || {};
  const fromPlan = f.errorScope === 'plan';
  const code = err.code || (failed[0] && failed[0].state) || '';
  const lines = errorDetailLines(err);
  const failedRows = failed.map(it => `<div class="err-item"><span class="e-path">${esc(it.source_path || '')}</span><span class="e-msg">${esc(it.error_message || it.state_label || it.state || '')}</span></div>`).join('');
  const body = `
    <div class="banner danger"><span class="b-ico">${ico('cross')}</span><div>${esc(fromPlan ? t('blocked.planDesc') : t('failed.sub'))}</div></div>
    ${code || lines.length ? `<div class="mt-3">
      ${code ? `<div class="kvbar"><div class="kv-item"><span class="k">${esc(t('failed.code'))}</span><span class="v mono" style="color:#d9363e">${esc(code)}</span></div></div>` : ''}
      ${errDetailList(lines, code ? 'mt-3' : '')}
    </div>` : ''}
    ${failed.length ? `<div class="section-title mt-3"><h3>${esc(t('failed.items'))}</h3><span class="sub">${esc(t('common.items', { n: failed.length }))}</span></div><div class="err-list">${failedRows}</div>` : ''}
    ${fromPlan ? '' : `<div class="banner warn mt-3"><span class="b-ico">${ico('warn')}</span><div>${esc(t('failed.sourceSafe'))}<br>${esc(t('failed.suggestion'))}</div></div>`}`;
  const foot = `<button type="button" class="btn btn-ghost btn-sm" onclick="App.closeFlow()">${esc(t('action.close'))}</button>
    <span class="spacer"></span>
    <button type="button" class="btn btn-primary btn-sm" onclick="App.retryMigrate()">${esc(t('failed.retry'))}</button>`;
  return modalShell(t(fromPlan ? 'blocked.planTitle' : 'failed.title'), toolName, body, foot, true);
}

function modalRollbackFlow() {
  const f = state.data.flow;
  if (!f) return '';
  const p = f.preview || {};
  const ide = getIde(f.toolId);
  const toolName = p.tool_name || (ide && ide.name) || f.toolId || '';
  if (f.phase === 'loading') {
    return modalShell(t('rollback.title'), toolName,
      `<div class="banner info"><span class="b-ico">${ico('info')}</span><div>${esc(t('rollback.stage.precheck'))}</div></div>`,
      `<button type="button" class="btn btn-ghost btn-sm" onclick="App.closeFlow()">${esc(t('action.cancel'))}</button>`, true);
  }
  if (f.phase === 'residual') {
    const body = `<div class="banner warn"><span class="b-ico">${ico('warn')}</span><div>${esc(t('rollback.residualBody', { size: fmtBytes(p.restore_bytes || 0) }))}</div></div>
      ${valueList([
        { label: t('rollback.source'), value: p.final_path || '' },
        { label: t('rollback.target'), value: p.source_path || '' }
      ], 'mt-3')}`;
    const foot = `<button type="button" class="btn btn-ghost btn-sm" onclick="App.closeFlow()">${esc(t('action.cancel'))}</button>
      <span class="spacer"></span>
      <button type="button" class="btn btn-primary btn-sm" onclick="App.confirmResidual()">${esc(t('rollback.residualConfirm'))}</button>`;
    return modalShell(t('rollback.residualTitle'), toolName, body, foot, true);
  }
  if (f.phase === 'blocked') {
    const code = (f.error && f.error.code) || p.error_code || '';
    const message = (f.error && f.error.detail && f.error.detail.message) || p.error_message || '';
    const detail = f.noticeKey
      ? `<div class="banner info"><span class="b-ico">${ico('info')}</span><div>${esc(t(f.noticeKey))}</div></div>`
      : `<div class="banner danger"><span class="b-ico">${ico('cross')}</span><div>${esc(message || t('blocked.planDesc'))}</div></div>`;
    const body = `${detail}
      ${code ? `<div class="kvbar mt-3"><div class="kv-item"><span class="k">${esc(t('failed.code'))}</span><span class="v mono" style="color:#d9363e">${esc(code)}</span></div></div>` : ''}`;
    const foot = `<button type="button" class="btn btn-primary btn-sm" onclick="App.closeFlow()">${esc(t('blocked.close'))}</button>`;
    return modalShell(t('rollback.blockedTitle'), toolName, body, foot, true);
  }
  if (f.phase === 'confirm' || f.phase === 'starting') {
    const busy = f.phase === 'starting';
    const body = `<div class="note">${esc(t('rollback.desc', { path: p.final_path || '', size: fmtBytes(p.restore_bytes || 0) }))}</div>
      ${valueList([
        { label: t('rollback.source'), value: p.final_path || '' },
        { label: t('rollback.target'), value: p.source_path || '' }
      ], 'mt-3')}
      <div class="banner warn mt-3"><span class="b-ico">${ico('warn')}</span><div>${esc(t('rollback.note', { app: toolName }))}</div></div>
      ${f.error ? `<div class="mt-3">${flowPlanErrorBody(f.error)}</div>` : ''}`;
    const foot = `<button type="button" class="btn btn-ghost btn-sm" ${busy ? 'disabled' : ''} onclick="App.closeFlow()">${esc(t('rollback.cancel'))}</button>
      <span class="spacer"></span>
      <button type="button" class="btn btn-primary btn-sm" ${busy ? 'disabled' : ''} onclick="App.startRollback()">${esc(t('rollback.confirm'))}</button>`;
    return modalShell(t('rollback.title'), toolName, body, foot, true, !busy);
  }
  if (f.phase === 'progress') {
    const job = f.job || {};
    const pr = job.progress || {};
    const pct = rollbackPct(f);
    const done = job.state === 'done' || pr.stage === 'done';
    const body = `
      <div class="progress"><i style="width:${pct}%"></i></div>
      <div class="progress-meta"><span>${esc(t('progress.percent', { pct: pct }))}</span><span>${esc(t('common.progress'))}</span></div>
      <div class="stage-list mt-3">${stageRows(ROLLBACK_STAGES, pr.stage || 'precheck', done, 'rollback.stage.')}</div>
      <div class="banner warn mt-3"><span class="b-ico">${ico('warn')}</span><div>${esc(t('rollback.progressKeepOpen'))}</div></div>`;
    return modalShell(t('rollback.progressTitle'), toolName, body, `<span class="note">${esc(t('progress.cancelDisabled'))}</span>`, true, false);
  }
  if (f.phase === 'success') {
    const s = f.summary || {};
    const body = `<div class="banner ok"><span class="b-ico">${ico('check')}</span><div>${esc(t('rollback.successSub'))}</div></div>
      <div class="kvbar mt-3">
        <div class="kv-item"><span class="k">${esc(t('success.duration'))}</span><span class="v">${esc(fmtDuration(jobDuration(f.job)))}</span></div>
      </div>
      ${valueList([
        { label: t('rollback.target'), value: s.source_path || p.source_path || '' },
        { label: t('rollback.source'), value: s.final_path || p.final_path || '' },
        { label: t('history.job'), value: s.job_id || f.jobId || '' }
      ], 'mt-3')}`;
    const foot = `<button type="button" class="btn btn-ghost btn-sm" onclick="App.gotoHistory()">${esc(t('success.viewHistory'))}</button>
      <span class="spacer"></span>
      <button type="button" class="btn btn-primary btn-sm" onclick="App.closeFlow()">${esc(t('action.done'))}</button>`;
    return modalShell(t('rollback.successTitle'), toolName, body, foot, true);
  }
  const s = f.summary || {};
  const err = f.error || {};
  const code = err.code || s.error_code || '';
  const message = (err.detail && err.detail.message) || s.error_message || '';
  const lines = errorDetailLines(err);
  const body = `<div class="banner danger"><span class="b-ico">${ico('cross')}</span><div>${esc(message || t('failed.sub'))}</div></div>
    ${code || lines.length ? `<div class="mt-3">
      ${code ? `<div class="kvbar"><div class="kv-item"><span class="k">${esc(t('failed.code'))}</span><span class="v mono" style="color:#d9363e">${esc(code)}</span></div></div>` : ''}
      ${errDetailList(lines, code ? 'mt-3' : '')}
    </div>` : ''}`;
  const foot = `<button type="button" class="btn btn-primary btn-sm" onclick="App.closeFlow()">${esc(t('action.close'))}</button>`;
  return modalShell(t('rollback.failedTitle'), toolName, body, foot, true);
}

/* ---------- 交互动作 ---------- */
const App = {
  go(hash) {
    if (location.hash === hash) { render(); return; }
    location.hash = hash;
  },
  nav(tab) {
    state.returnHash = '';
    this.go('#' + tab);
  },
  openModal(kind) {
    const activeKind = modalKind();
    if (!activeKind) state.returnHash = location.hash || '#ide';
    this.go('#' + kind);
  },
  closeModal() {
    if (state.data.flow) { this.closeFlow(); return; }
    state.aiAsk = false;
    const back = state.returnHash;
    state.returnHash = '';
    this.go(back && back !== location.hash ? back : '#ide');
  },
  toggleLang() {
    this.setLang(LANG === 'zh-CN' ? 'en' : 'zh-CN');
  },
  setLang(lang) {
    if (lang !== 'en' && lang !== 'zh-CN') return;
    LANG = lang;
    try { localStorage.setItem('dw-lang', lang); } catch (e) {}
    render();
    rpc('settings.set', { language: lang }).catch(() => {});
  },
  /* ---------- 欢迎页 / 登录 / Star（T16） ---------- */
  skipLogin() {
    rpc('welcome.seen').then(auth => {
      applyAuth(auth);
      render();
    }).catch(err => this.toast(errText(err)));
  },
  openWelcome() {
    this.closeModal();
    state.auth.welcome_seen = false;
    render();
  },
  authStart(provider) {
    const p = authProviders().find(x => x.provider === provider);
    if (p && !p.configured) { this.toast(t('error.AUTH_NOT_CONFIGURED')); return; }
    rpc('auth.start', { provider: provider }).then(auth => {
      applyAuth(auth);
      if (authFlowActive()) startAuthPolling();
      else {
        const flow = state.auth.flow || {};
        if (flow.error && flow.error.code) this.toast(authErrorText(flow.error.code));
      }
      render();
    }).catch(err => this.toast(authErrorText(err)));
  },
  authCopyCode() {
    const flow = state.auth.flow || {};
    const code = String(flow.user_code || '');
    if (!code) return;
    copyText(code).then(ok => { if (ok) this.toast(t('welcome.deviceCopied')); });
  },
  authOpenVerify() {
    const flow = state.auth.flow || {};
    this.openExternal(flow.verification_uri);
  },
  authCancel() {
    rpc('auth.cancel').then(auth => {
      stopAuthPolling();
      applyAuth(auth);
      render();
    }).catch(err => this.toast(authErrorText(err)));
  },
  authSignOut() {
    rpc('auth.sign_out').then(auth => {
      stopAuthPolling();
      applyAuth(auth);
      this.toast(t('toast.signedOut'));
      render();
    }).catch(err => this.toast(errText(err)));
  },
  starShow() {
    rpc('star.show').then(auth => {
      applyAuth(auth);
      this.toast(t('toast.starReopened'));
      this.closeModal();
      render();
    }).catch(err => this.toast(errText(err)));
  },
  starDismiss() {
    rpc('star.dismiss').then(auth => {
      applyAuth(auth);
      renderStarOverlay();
    }).catch(() => {
      state.auth.star.pending = false;
      state.auth.star.dismissed = true;
      renderStarOverlay();
    });
  },
  starGive() {
    rpc('star.give').then(auth => {
      applyAuth(auth);
      if (!state.auth.star.starred) this.toast(t('toast.starOpened'));
      renderStarOverlay();
    }).catch(err => this.toast(authErrorText(err)));
  },
  starCheck() {
    rpc('star.check').then(auth => {
      applyAuth(auth);
      if (!state.auth.star.starred) this.toast(t('toast.starStillPending'));
      renderStarOverlay();
    }).catch(err => this.toast(authErrorText(err)));
  },
  openGitee() {
    const gitee = state.auth.gitee || {};
    if (!gitee.available || !gitee.url) {
      this.toast(t('toast.starGiteeSoon'));
      return;
    }
    this.openExternal(gitee.url);
  },
  openExternal(url) {
    if (!url) return;
    rpc('app.open_external', { url: url }).catch(err => this.toast(errText(err)));
  },
  openRepo() {
    this.openExternal(state.auth.repository_url);
  },
  toggleSetting(key) {
    const root = document.getElementById('settings-root');
    if (root) state.settings.targetRoot = root.value;
    state.settings[key] = !state.settings[key];
    render();
  },
  saveSettings() {
    const root = document.getElementById('settings-root');
    const un = document.getElementById('settings-uninstall');
    const rootVal = root ? (root.value.trim() || state.settings.targetRoot) : state.settings.targetRoot;
    const uninstall = un ? un.value : state.settings.uninstall;
    const patch = {
      launch_at_startup: !!state.settings.autoStart,
      auto_maintenance: !!state.settings.autoMaintenance,
      uninstall_policy: uninstall === 'remove' ? 'rollback' : uninstall
    };
    if (rootVal && normPath(rootVal) !== normPath(state.settings.targetRoot)) patch.target_root = rootVal;
    rpc('settings.set', patch).then(s => {
      applySettings(s);
      this.toast(t('settings.saved'));
      this.closeModal();
    }).catch(err => this.toast(errText(err)));
  },
  reconnect() {
    bootstrap();
  },
  rescan() {
    if (state.scanning) { if (!state.data.scanFrom) this.go('#ide/scanning'); return; }
    rpc('scan.start').then(res => {
      const jobId = res && res.job_id;
      state.scanning = true;
      state.data.scanError = '';
      state.scanPct = 3;
      state.data.scanJob = jobId ? { job_id: jobId, state: (res && res.state) || 'queued' } : null;
      enterScanRoute();
      if (jobId) startScanPolling(jobId);
    }).catch(err => {
      if (err && err.code === 'BUSY') {
        rpc('job.list', { active_only: true }).then(list => {
          const job = list && list.jobs && list.jobs[0];
          if (job && job.kind === 'scan') {
            state.scanning = true;
            state.data.scanJob = job;
            state.scanPct = scanPercent(job);
            enterScanRoute();
            startScanPolling(job.job_id);
            return;
          }
          this.toast(errText(err));
        }).catch(() => this.toast(errText(err)));
        return;
      }
      this.toast(errText(err));
    });
  },
  cancelScan() {
    const job = state.data.scanJob;
    if (!job || !job.job_id) return;
    rpc('scan.cancel', { job_id: job.job_id }).then(j => {
      if (j) state.data.scanJob = j;
      render();
    }).catch(err => this.toast(errText(err)));
  },
  search(value) {
    state.search = value;
    const list = filteredIdes();
    const el = document.querySelector('.ide-bar');
    if (!el) return;
    el.innerHTML = list.length
      ? list.map(i => ideRow(i)).join('')
      : `<div class="note dim" style="padding:10px 2px">${esc(t('ide.listEmpty'))}</div>`;
  },
  setFilter(filter) {
    state.filter = filter;
    render();
  },
  selectIde(id) {
    state.selectedIde = id;
    render();
  },
  toggleCheck(ideId, idx) {
    const ide = getIde(ideId);
    const dir = ide.directories[idx];
    if (!dir || dir.safety === 'red' || dir.can_migrate === false) return;
    if (dir.safety === 'yellow' && !isConfirmed(ideId, idx)) return;
    if (dir.item_id) {
      state.checked[dir.item_id] = !state.checked[dir.item_id];
    } else {
      state.checked[ideId] = state.checked[ideId] || {};
      state.checked[ideId][idx] = !state.checked[ideId][idx];
    }
    render();
  },
  openYellow(ideId, idx) {
    state.selectedIde = ideId;
    state.pendingYellow = { ide: ideId, idx: idx };
    state.returnHash = '#ide';
    this.go('#ide/yellow-confirm');
  },
  confirmYellow(action) {
    const py = state.pendingYellow;
    if (!py) { this.go('#ide'); return; }
    const ide = getIde(py.ide);
    const dir = ide.directories[py.idx];
    state.selectedIde = ide.id;
    if (!dir) { state.pendingYellow = null; this.go('#ide'); return; }
    if (action === 'later') {
      state.pendingYellow = null;
      this.go('#ide');
      return;
    }
    if (!dir.item_id) {
      state.pendingYellow = null;
      this.go('#ide');
      this.toast(t('rules.overrideFailed'));
      return;
    }
    state.pendingYellow = null;
    this.go('#ide');
    this.overrideItem(dir.item_id, action);
  },
  overrideItem(itemId, safety) {
    if (!itemId || (safety !== 'green' && safety !== 'red')) return;
    if (!this._overriding) this._overriding = {};
    if (this._overriding[itemId]) return;
    this._overriding[itemId] = true;
    rpc('rules.override', { item_id: itemId, safety: safety }).then(() => {
      return Promise.all([rpc('scan.result'), rpc('rules.learned.list')]);
    }).then(res => {
      delete this._overriding[itemId];
      const snap = res && res[0];
      if (snap) setSnapshot(snap);
      if (res && res[1]) state.data.learned = res[1];
      render();
      this.toast(t(safety === 'green' ? 'rules.markedGreen' : 'rules.markedRed'));
    }).catch(err => {
      delete this._overriding[itemId];
      this.toast(errText(err));
    });
  },
  clearOverride(itemId) {
    if (!itemId) return;
    if (!this._clearing) this._clearing = {};
    if (this._clearing[itemId]) return;
    this._clearing[itemId] = true;
    rpc('rules.override.clear', { item_id: itemId }).then(() => {
      return Promise.all([rpc('scan.result'), rpc('rules.learned.list')]);
    }).then(res => {
      delete this._clearing[itemId];
      const snap = res && res[0];
      if (snap) setSnapshot(snap);
      if (res && res[1]) state.data.learned = res[1];
      render();
      this.toast(t('rules.unmarked'));
    }).catch(err => {
      delete this._clearing[itemId];
      const reason = err && err.code === 'NOT_FOUND' ? t('rules.unmarkGone') : errText(err);
      this.toast(t('rules.unmarkFailed', { reason: reason }));
    });
  },
  openIssue() {
    if (this._openingIssue) return;
    this._openingIssue = true;
    rpc('app.open_external', { url: ISSUE_URL }).then(() => {
      delete this._openingIssue;
      this.toast(t('feedback.issueOpened'));
    }).catch(err => {
      delete this._openingIssue;
      const reason = err && err.code === 'IO_ERROR' ? t('feedback.browserFailed') : errText(err);
      this.toast(t('feedback.openFailed', { reason: reason }));
    });
  },
  startPreview(ideId) {
    const ide = getIde(ideId);
    state.selectedIde = ide.id;
    if (!selectedDirs(ide).length) { this.toast(t(emptySelectionKey(ide))); return; }
    state.returnHash = '#ide';
    if (ide.runtime.running.length) { this.go('#ide/process-blocked'); return; }
    if (!spaceOk(ide)) { this.toast(t('toast.spaceShort')); return; }
    this._beginMigrate(ideId);
  },
  refreshDisk() {
    rpc('disk.info').then(disk => {
      applyDisk(disk || null);
      render();
    }).catch(err => this.toast(errText(err)));
  },
  openRollback(ideId) {
    this.rollbackTool(ideId);
  },
  startMigrate(ideId) {
    this._beginMigrate(ideId);
  },
  _beginMigrate(ideId, skipRunningCheck) {
    const ide = getIde(ideId);
    const dirs = selectedDirs(ide);
    const items = dirs.filter(d => d.item_id);
    if (!ide || !items.length) { this.toast(t('toast.noGreen')); return; }
    if (!skipRunningCheck && ide.runtime.running.length) { this.toast(t('toast.blocked')); return; }
    if (!spaceOk(ide)) { this.toast(t('toast.spaceShort')); return; }
    if (!state.data.flow) state.returnHash = state.returnHash || location.hash || '#ide';
    state.data.flow = {
      kind: 'migrate', phase: 'loading', toolId: ideId,
      plan: null, yellowConfirmed: {}, error: null, errorScope: '',
      jobId: null, runnerJobId: null, job: null, summary: null
    };
    if (location.hash === '#ide/migrate-preview') render(); else this.go('#ide/migrate-preview');
    rpc('plan.preview', {
      item_ids: items.map(d => d.item_id),
      confirmed_item_ids: items.filter(d => !!state.confirmed['item:' + d.item_id]).map(d => d.item_id)
    }).then(plan => {
      const f = state.data.flow;
      if (!f || f.kind !== 'migrate' || f.toolId !== ideId) return;
      f.plan = plan || {};
      f.phase = 'confirm';
      render();
    }).catch(err => {
      const f = state.data.flow;
      if (!f || f.kind !== 'migrate' || f.toolId !== ideId) return;
      f.phase = 'failed';
      f.errorScope = 'plan';
      f.error = err;
      render();
    });
  },
  toggleYellowConfirm(itemId) {
    const f = state.data.flow;
    if (!f || f.kind !== 'migrate') return;
    if (f.yellowConfirmed[itemId]) delete f.yellowConfirmed[itemId];
    else f.yellowConfirmed[itemId] = true;
    render();
  },
  confirmMigrate() {
    const f = state.data.flow;
    if (!f || f.kind !== 'migrate' || f.phase !== 'confirm' || !f.plan) return;
    const plan = f.plan;
    const all = plan.items || [];
    const isYellow = it => !!(it.requires_confirm || it.safety === 'yellow');
    const accepted = all.filter(it => !isYellow(it) || f.yellowConfirmed[it.item_id]);
    const acceptedYellow = accepted.filter(isYellow).map(it => it.item_id);
    if (!accepted.length) { this.toast(t('toast.noGreen')); return; }
    f.phase = 'starting';
    f.error = null;
    render();
    const preview = accepted.length === all.length
      ? Promise.resolve(plan)
      : rpc('plan.preview', { item_ids: accepted.map(it => it.item_id), confirmed_item_ids: acceptedYellow });
    preview.then(fresh => {
      const cur = state.data.flow;
      if (!cur || cur.kind !== 'migrate') return null;
      cur.plan = fresh || cur.plan;
      return rpc('migrate.start', {
        plan_id: cur.plan.plan_id,
        confirm_token: cur.plan.confirm_token,
        confirmed_item_ids: acceptedYellow
      });
    }).then(res => {
      const cur = state.data.flow;
      if (!cur || cur.kind !== 'migrate' || !res) return;
      cur.phase = 'progress';
      cur.jobId = res.job_id;
      cur.runnerJobId = res.job_id;
      cur.job = { job_id: res.job_id, state: res.state || 'queued', progress: {} };
      render();
      startFlowPolling('migrate', res.job_id);
    }).catch(err => {
      const cur = state.data.flow;
      if (!cur || cur.kind !== 'migrate') return;
      cur.phase = 'failed';
      cur.errorScope = 'plan';
      cur.error = err;
      render();
    });
  },
  rollbackTool(ideId) {
    const ide = getIde(ideId);
    const it = ide.directories.filter(d => !!d.migrated_job_id)[0];
    if (!it) { this.toast(t('history.noRollback')); return; }
    if (ide.runtime.running.length) { this.toast(t('toast.blocked')); return; }
    this._openRollback(it.migrated_job_id);
  },
  rollbackDir(ideId, idx) {
    const ide = getIde(ideId);
    const d = dirAt(ideId, idx);
    if (!d || !d.migrated_job_id) { this.toast(t('history.noRollback')); return; }
    if (ide.runtime.running.length) { this.toast(t('toast.blocked')); return; }
    this._openRollback(d.migrated_job_id);
  },
  historyRollback(id) {
    const h = HISTORY.find(x => x.id === id);
    if (!h) return;
    this._openRollback(h.job_id || h.id);
  },
  _openRollback(jobId) {
    if (!jobId) { this.toast(t('history.noRollback')); return; }
    if (!state.data.flow) state.returnHash = state.tab === 'history' ? '#history' : (location.hash || '#ide');
    state.data.flow = {
      kind: 'rollback', phase: 'loading', jobId: jobId, runnerJobId: null,
      preview: null, error: null, noticeKey: '', job: null, summary: null
    };
    if (location.hash === '#ide/rollback-confirm') render(); else this.go('#ide/rollback-confirm');
    this._previewRollback(false);
  },
  confirmResidual() {
    this._previewRollback(true);
  },
  _previewRollback(confirmResidual) {
    const f = state.data.flow;
    if (!f || f.kind !== 'rollback') return;
    const jobId = f.jobId;
    f.phase = 'loading';
    f.error = null;
    render();
    rpc('rollback.preview', {
      job_id: jobId,
      confirm_residual_delete: !!confirmResidual
    }).then(p => {
      const cur = state.data.flow;
      if (!cur || cur.kind !== 'rollback' || cur.jobId !== jobId) return;
      cur.preview = p || {};
      if (p && p.tool_id) cur.toolId = p.tool_id;
      if (!p || !p.can_proceed) {
        cur.phase = 'blocked';
        cur.noticeKey = p && p.mode === 'already_rolled_back' ? 'rollback.alreadyDone' : '';
        cur.error = cur.noticeKey ? null : {
          code: (p && p.error_code) || 'PRECHECK_FAILED',
          detail: { message: (p && p.error_message) || '' }
        };
        render();
        return;
      }
      cur.phase = p.requires_residual_confirm ? 'residual' : 'confirm';
      render();
    }).catch(err => {
      const cur = state.data.flow;
      if (!cur || cur.kind !== 'rollback' || cur.jobId !== jobId) return;
      cur.phase = 'blocked';
      cur.noticeKey = '';
      cur.error = err;
      render();
    });
  },
  startRollback() {
    const f = state.data.flow;
    if (!f || f.kind !== 'rollback' || f.phase !== 'confirm') return;
    const p = f.preview || {};
    if (!p.plan_id || !p.confirm_token) { this.toast(t('toast.blocked')); return; }
    f.phase = 'starting';
    f.error = null;
    render();
    rpc('rollback.start', { plan_id: p.plan_id, confirm_token: p.confirm_token }).then(res => {
      const cur = state.data.flow;
      if (!cur || cur.kind !== 'rollback' || !res) return;
      cur.phase = 'progress';
      cur.runnerJobId = res.job_id;
      cur.job = { job_id: res.job_id, state: res.state || 'queued', progress: {} };
      render();
      startFlowPolling('rollback', res.job_id);
    }).catch(err => {
      const cur = state.data.flow;
      if (!cur || cur.kind !== 'rollback') return;
      cur.phase = 'failed';
      cur.error = err;
      render();
    });
  },
  closeFlow() {
    if (flowBusy()) return;
    const back = state.returnHash || ('#' + (state.tab || 'ide'));
    state.returnHash = '';
    closeFlow();
    this.go(back);
  },
  gotoHistory() {
    stopFlowPolling();
    state.data.flow = null;
    state.returnHash = '';
    this.nav('history');
  },
  recoveryStart(jobId, action) {
    if (!jobId) return;
    if (action !== 'recover' && action !== 'rollback') return;
    const run = state.data.recoveryRun;
    if (run && (run.phase === 'starting' || run.phase === 'progress')) return;
    if (flowBusy()) { this.toast(t('toast.blocked')); return; }
    const item = recoveryItems().find(x => x.job_id === jobId) || {};
    state.data.recoveryRun = {
      targetJobId: jobId, sourcePath: item.source_path || '', action: action,
      phase: 'starting', runnerJobId: null, job: null, summary: null, error: null
    };
    render();
    rpc('recovery.run', { job_id: jobId, action: action }).then(res => {
      const cur = state.data.recoveryRun;
      if (!cur || cur.targetJobId !== jobId || cur.action !== action) return;
      cur.runnerJobId = res && res.job_id;
      cur.phase = 'progress';
      cur.job = { job_id: cur.runnerJobId, state: (res && res.state) || 'queued', progress: {} };
      render();
      if (cur.runnerJobId) startRecoveryPolling(cur.runnerJobId);
    }).catch(err => {
      const cur = state.data.recoveryRun;
      if (!cur || cur.targetJobId !== jobId) return;
      cur.phase = 'failed';
      cur.error = err;
      render();
    });
  },
  retryRecovery() {
    const run = state.data.recoveryRun;
    if (!run || run.phase === 'starting' || run.phase === 'progress') return;
    this.recoveryStart(run.targetJobId, run.action);
  },
  dismissRecovery() {
    stopRecoveryPolling();
    state.data.recoveryRun = null;
    render();
  },
  recoveryIgnore(jobId) {
    if (!jobId) return;
    const run = state.data.recoveryRun;
    if (run && (run.phase === 'starting' || run.phase === 'progress')) return;
    rpc('recovery.ignore', { job_id: jobId }).then(() => {
      this.toast(t('recovery.ignored'));
      return refreshRecovery();
    }).then(() => render()).catch(err => {
      this.toast((err && err.detail && err.detail.message) || (err && err.code) || String(err));
    });
  },
  retryMigrate() {
    const f = state.data.flow;
    if (!f || f.kind !== 'migrate') { this._beginMigrate(state.selectedIde); return; }
    this._beginMigrate(f.toolId);
  },
  recheckProcess() {
    this._beginMigrate(state.selectedIde, true);
  },
  showForceWarn() {
    this.toast(t('blocked.forceWarn'));
  },
  selectHistory(id) {
    state.selectedHistory = id;
    render();
  },
  setHistoryFilter(filter) {
    state.historyFilter = filter;
    const current = HISTORY.find(x => x.id === state.selectedHistory);
    const visible = filter === 'all' || (current && current.type === filter);
    if (!visible) {
      const first = HISTORY.find(x => filter === 'all' || x.type === filter);
      if (first) state.selectedHistory = first.id;
    }
    render();
  },
  exportHistory() {
    const items = HISTORY.filter(h => state.historyFilter === 'all' || h.type === state.historyFilter);
    if (!items.length) { this.toast(t('history.exportEmpty')); return; }
    try {
      const blob = new Blob([JSON.stringify(items, null, 2)], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'disk-warden-history-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      this.toast(t('history.exported'));
    } catch (e) {
      this.toast(t('history.exportFailed'));
    }
  },
  rollbackHistory(id) {
    const h = HISTORY.find(x => x.id === id);
    if (!h || !h.canRollback) return;
    state.selectedHistory = h.id;
    const ide = CATALOG.ides.find(x => x.name === h.app);
    if (ide) state.selectedIde = ide.id;
    this.historyRollback(id);
  },
  toggleAi() {
    const ai = (state.settings && state.settings.ai) || {};
    if (ai.enabled) {
      rpc('settings.set', { ai: { enabled: false } }).then(s => {
        applySettings(s);
        state.aiAsk = false;
        render();
        this.toast(t('ai.statusOff'));
      }).catch(err => this.toast(errText(err)));
      return;
    }
    state.aiAsk = true;
    render();
  },
  cancelAiAsk() {
    state.aiAsk = false;
    render();
  },
  confirmAiEnable() {
    state.aiAsk = false;
    render();
    rpc('ai.consent').then(() => rpc('settings.set', { ai: { enabled: true } })).then(s => {
      applySettings(s);
      render();
      this.toast(t('ai.consentDone'));
    }).catch(err => {
      render();
      this.toast(errText(err));
    });
  },
  pickAiPreset(value) {
    const preset = AI_PRESETS.find(p => p.id === value);
    if (!preset) return;
    const base = document.getElementById('ai-base');
    const model = document.getElementById('ai-model');
    if (base) base.value = preset.base;
    if (model) model.value = preset.model;
  },
  toggleAiKey() {
    const input = document.getElementById('ai-key');
    const btn = document.getElementById('ai-key-toggle');
    if (!input) return;
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    if (btn) btn.textContent = t(show ? 'ai.keyHide' : 'ai.keyShow');
  },
  clearAiKey() {
    rpc('settings.set', { ai: { api_key: '' } }).then(s => {
      applySettings(s);
      render();
      this.toast(t('ai.keyCleared'));
    }).catch(err => this.toast(errText(err)));
  },
  saveAi() {
    const val = (id) => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
    const provider = val('ai-provider') || 'none';
    const patch = {
      enabled: !!state.settings.aiEnabled,
      base_url: provider === 'none' ? '' : val('ai-base'),
      model: provider === 'none' ? '' : val('ai-model')
    };
    const typedKey = val('ai-key');
    /* 只有用户主动填了新密钥才发送；留空表示保留已保存的密钥 */
    if (typedKey) patch.api_key = typedKey;
    rpc('settings.set', { ai: patch }).then(s => {
      applySettings(s);
      if (typedKey) {
        render();
        this.toast(t('ai.savedWithKey'));
        return;
      }
      this.toast(t('toast.saved'));
      this.closeModal();
    }).catch(err => this.toast(errText(err)));
  },
  aiTest() {
    const val = (id) => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
    const baseUrl = val('ai-base');
    const model = val('ai-model');
    const apiKey = val('ai-key');
    const box = document.getElementById('ai-test-result');
    if (box) box.innerHTML = `<div class="banner info"><span class="b-ico">…</span><div>${esc(t('ai.testing'))}</div></div>`;
    const params = { base_url: baseUrl, model: model };
    /* 表单里刚填、尚未保存的密钥只用于这一次测试，主机端不会写入磁盘 */
    if (apiKey) params.api_key = apiKey;
    rpc('ai.test', params).then(res => {
      const out = document.getElementById('ai-test-result');
      if (!out) return;
      if (res && res.ok) {
        out.innerHTML = `<div class="banner ok"><span class="b-ico">${ico('check')}</span><div>${esc(t('ai.testOk', { model: res.model || model, ms: res.latency_ms || 0 }))}</div></div>`;
        return;
      }
      const reason = aiTestReason((res && res.error_code) || 'internal');
      out.innerHTML = `<div class="banner warn"><span class="b-ico">${ico('warn')}</span><div>${esc(t('ai.testBad', { reason: reason }))}</div></div>`;
    }).catch(err => {
      const out = document.getElementById('ai-test-result');
      if (out) out.innerHTML = `<div class="banner warn"><span class="b-ico">${ico('warn')}</span><div>${esc(t('ai.testBad', { reason: errText(err) }))}</div></div>`;
    });
  },
  copyDiagnostics() {
    copyText(diagnosticsText()).then(ok => {
      this.toast(t(ok ? 'feedback.copied' : 'toast.copyFailed'));
    });
  },
  copyValue(btn) {
    const box = btn.closest('.val-item, .cell-val');
    const el = box && box.querySelector('.e-path, .mono');
    const text = el ? el.textContent : '';
    if (!text) return;
    copyText(text).then(ok => {
      this.toast(t(ok ? 'common.copied' : 'toast.copyFailed'));
    });
  },
  openPath(path) {
    const fail = (reason) => this.toast(t('toast.openFailedReason', { reason: reason || t('error.INTERNAL') }));
    if (!path) { fail(t('error.NO_PATH')); return; }
    rpc('app.reveal', { path: String(path) }).then(res => {
      /* 主机端返回展开后的真实路径：提示里报出它，用户才知道资源管理器停在了哪儿 */
      this.toast(res && res.path ? t('toast.openedPath', { path: res.path }) : t('toast.opened'));
    }).catch(err => fail(errText(err)));
  },
  openIdeFolder(ideId) {
    const ide = getIde(ideId);
    this.openPath((ide.runtime && ide.runtime.root) || '');
  },
  openDiskLocation(categoryId) {
    this.openPath(DISK_LOCATIONS[categoryId] || '');
  },
  toast(message) {
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = message;
    el.classList.add('show');
    clearTimeout(state.toastTimer);
    state.toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
  }
};

/* ---------- 初始化 ---------- */
function init() {
  let saved = null;
  try { saved = localStorage.getItem('dw-lang'); } catch (e) {}
  const query = new URLSearchParams(location.search).get('lang');
  const initial = query || saved;
  if (initial === 'en' || initial === 'zh-CN') LANG = initial;

  if (!location.hash) {
    try { history.replaceState(null, '', location.pathname + location.search + '#projects'); }
    catch (e) { location.hash = 'projects'; }
  }

  window.addEventListener('hashchange', render);
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') { trapDialogFocus(e); return; }
    if (modalKind()) App.closeModal();
  });

  render();
  bootstrap();
}

init();
</script>
</body>
</html>
