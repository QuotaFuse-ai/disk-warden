<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disk Warden</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel-2:#172033; --line:#334155; --line-soft:#263248;
    --text:#e2e8f0; --muted:#94a3b8; --dim:#64748b;
    --blue:#3b82f6; --blue-2:#2563eb; --green:#22c55e; --red:#ef4444; --amber:#f59e0b;
    --violet:#8b5cf6; --cyan:#0ea5e9;
    --radius:10px; --radius-sm:6px;
    --shadow:0 20px 60px rgba(0,0,0,.45);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
    background:var(--bg); color:var(--text); overflow:hidden; font-size:13px;
  }
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer}
  a{color:var(--blue);text-decoration:none}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#334155;border-radius:5px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-track{background:transparent}
  :focus-visible{outline:2px solid #60a5fa;outline-offset:2px;border-radius:4px}

  .app{display:flex;height:100vh;min-width:1080px}
  .sidebar{width:212px;flex-shrink:0;background:#162032;border-right:1px solid var(--line-soft);display:flex;flex-direction:column;padding:18px 12px 14px}
  .logo{display:flex;align-items:center;gap:9px;padding:0 8px 16px;border-bottom:1px solid var(--line-soft);margin-bottom:14px}
  .logo-badge{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;letter-spacing:.5px}
  .logo-name{font-size:14px;font-weight:700;color:#f8fafc;line-height:1.1}
  .logo-sub{font-size:9.5px;color:var(--dim);margin-top:2px;letter-spacing:.6px;text-transform:uppercase}
  .nav-label{font-size:10px;font-weight:700;color:#475569;letter-spacing:1.2px;text-transform:uppercase;padding:0 10px 6px}
  .nav{display:flex;flex-direction:column;gap:3px;margin-bottom:16px}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;background:none;border:none;color:var(--muted);font-size:12.5px;text-align:left;transition:background .15s,color .15s;width:100%}
  .nav-item:hover{background:#1f2c42;color:var(--text)}
  .nav-item.active{background:#1d3a63;color:#fff;box-shadow:inset 2px 0 0 var(--blue)}
  .nav-ico{width:20px;text-align:center;font-size:13px;opacity:.9}
  .nav-count{margin-left:auto;font-size:10px;color:var(--dim);background:#0f172a;padding:1px 6px;border-radius:10px}
  .nav-item.active .nav-count{color:#bfdbfe;background:#1e3a5f}
  .side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line-soft);display:flex;flex-direction:column;gap:8px}
  .side-meta{font-size:10.5px;color:var(--dim);display:flex;justify-content:space-between;align-items:center}
  .lang-chip{border:1px solid var(--line);background:#1e293b;border-radius:20px;padding:2px 9px;font-size:10.5px;color:var(--muted)}
  .lang-chip:hover{color:#fff;border-color:#475569}

  .main{flex:1;min-width:0;overflow-y:auto;padding:18px 22px 26px}
  .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
  .topbar h1{font-size:19px;font-weight:650;color:#f8fafc;letter-spacing:.2px}
  .scan-meta{font-size:11px;color:var(--dim);margin-top:4px;display:flex;align-items:center;gap:6px}
  .scan-meta .live-dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
  .top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 13px;border-radius:6px;font-size:12px;font-weight:600;border:1px solid transparent;transition:background .15s,border-color .15s,opacity .15s;white-space:nowrap}
  .btn-primary{background:var(--blue);color:#fff}
  .btn-primary:hover{background:var(--blue-2)}
  .btn-ghost{background:#273449;color:#cbd5e1;border-color:#3b4b63}
  .btn-ghost:hover{background:#334155;color:#fff}
  .btn-danger{background:#7f1d1d;color:#fecaca;border-color:#991b1b}
  .btn-danger:hover{background:#991b1b;color:#fff}
  .btn-soft{background:rgba(59,130,246,.14);color:#93c5fd;border-color:rgba(59,130,246,.35)}
  .btn-soft:hover{background:rgba(59,130,246,.24)}
  .btn-sm{padding:4px 9px;font-size:11px;border-radius:5px}
  .btn-xs{padding:2px 7px;font-size:10.5px;border-radius:4px}
  .btn[disabled],.btn.disabled{opacity:.42;cursor:not-allowed;filter:grayscale(.35)}
  .btn[disabled]:hover,.btn.disabled:hover{background:inherit;color:inherit}

  .statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .stat{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--radius);padding:14px 16px;min-width:0}
  .stat .label{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:7px}
  .stat .value{font-size:23px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
  .stat .sub{font-size:10.5px;color:var(--dim);margin-top:6px;display:flex;justify-content:space-between;gap:8px}
  .v-red{color:var(--red)} .v-blue{color:#60a5fa} .v-green{color:var(--green)} .v-amber{color:var(--amber)} .v-violet{color:#a78bfa}
  .mini-bar{height:3px;background:#0b1322;border-radius:2px;margin-top:9px;overflow:hidden}
  .mini-bar i{display:block;height:100%;border-radius:2px}

  .content{display:grid;grid-template-columns:302px minmax(0,1fr);gap:14px;align-items:start}
  .panel{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--radius);min-width:0}
  .panel-head{padding:13px 15px 10px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;gap:8px}
  .panel-head h2{font-size:12.5px;font-weight:650;color:#f1f5f9}
  .panel-head .hint{font-size:10.5px;color:var(--dim)}
  .panel-body{padding:12px 14px}
  .toolbar{display:flex;gap:6px;align-items:center;margin-bottom:9px;flex-wrap:wrap}
  .search{flex:1;min-width:110px;background:#0f172a;border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:11.5px;color:var(--text)}
  .search::placeholder{color:#475569}
  .search:focus{outline:none;border-color:var(--blue)}

  .legend{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:10.5px;color:var(--muted)}
  .legend .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px}
  .dot-green{background:var(--green)} .dot-red{background:var(--red)} .dot-amber{background:var(--amber)} .dot-blue{background:var(--blue)} .dot-gray{background:#64748b}

  .ide-list{display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 258px);overflow-y:auto;padding-right:2px}
  .ide-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:7px;border:1px solid transparent;background:none;text-align:left;width:100%;transition:background .15s,border-color .15s;position:relative}
  .ide-item:hover{background:#243249}
  .ide-item.active{background:rgba(59,130,246,.13);border-color:rgba(59,130,246,.45)}
  .ide-mark{width:26px;height:26px;flex-shrink:0;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;letter-spacing:.2px}
  .ide-main{min-width:0;flex:1}
  .ide-name{font-size:12.5px;font-weight:600;color:#e8eef7;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ide-sub{font-size:10px;color:var(--dim);margin-top:3px;display:flex;align-items:center;gap:5px}
  .ide-right{text-align:right;flex-shrink:0}
  .ide-size{font-size:11.5px;font-family:Consolas,"SFMono-Regular",monospace;color:#cbd5e1;font-variant-numeric:tabular-nums}
  .ide-flag{margin-top:3px;display:flex;justify-content:flex-end}
  .run-dot{width:5px;height:5px;border-radius:50%;background:var(--amber);display:inline-block;margin-right:3px}

  .badge{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;padding:1.5px 6px;border-radius:4px;line-height:1.5;white-space:nowrap}
  .b-green{background:rgba(34,197,94,.14);color:#4ade80;border:1px solid rgba(34,197,94,.28)}
  .b-red{background:rgba(239,68,68,.13);color:#f87171;border:1px solid rgba(239,68,68,.3)}
  .b-amber{background:rgba(245,158,11,.14);color:#fbbf24;border:1px solid rgba(245,158,11,.3)}
  .b-blue{background:rgba(59,130,246,.15);color:#93c5fd;border:1px solid rgba(59,130,246,.32)}
  .b-gray{background:#273449;color:#94a3b8;border:1px solid #3b4b63}
  .b-violet{background:rgba(139,92,246,.16);color:#c4b5fd;border:1px solid rgba(139,92,246,.32)}
  .b-plain{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:600}

  .detail{display:flex;flex-direction:column;gap:12px;padding:16px 18px 18px}
  .detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
  .detail-title{display:flex;align-items:center;gap:10px;min-width:0}
  .detail-title h2{font-size:16px;font-weight:650;color:#f8fafc}
  .detail-path{font-size:10.5px;color:var(--dim);font-family:Consolas,monospace;margin-top:5px;word-break:break-all}
  .detail-badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex-shrink:0}

  .banner{display:flex;gap:10px;padding:10px 12px;border-radius:7px;font-size:11.5px;line-height:1.6;border:1px solid}
  .banner .b-ico{flex-shrink:0;font-size:14px;line-height:1.3}
  .banner.warn{background:rgba(245,158,11,.09);border-color:rgba(245,158,11,.32);color:#fcd34d}
  .banner.danger{background:rgba(239,68,68,.09);border-color:rgba(239,68,68,.32);color:#fca5a5}
  .banner.info{background:rgba(59,130,246,.08);border-color:rgba(59,130,246,.28);color:#bfdbfe}
  .banner.ok{background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.28);color:#bbf7d0}
  .banner b{font-weight:700}
  .banner .btn{margin-top:6px}
  .banner-actions{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}

  .preview-card{background:linear-gradient(180deg,rgba(59,130,246,.1),rgba(59,130,246,.03));border:1px solid rgba(59,130,246,.28);border-radius:8px;padding:12px 14px}
  .preview-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .preview-top .t{font-size:11px;font-weight:700;color:#93c5fd;letter-spacing:.3px}
  .kv{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:11.5px;padding:3px 0}
  .kv .k{color:var(--muted)}
  .kv .v{font-family:Consolas,monospace;color:#e2e8f0;font-weight:600;text-align:right;word-break:break-all}
  .kv .v.ok{color:var(--green)}
  .kv .v.warn{color:var(--amber)}

  .section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:2px}
  .section-title h3{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.7px;text-transform:uppercase}
  .section-title .sub{font-size:10.5px;color:var(--dim)}
  .rows{display:flex;flex-direction:column;gap:5px}
  .row{display:flex;align-items:center;gap:10px;padding:9px 11px;background:var(--panel-2);border:1px solid transparent;border-radius:7px;transition:border-color .15s}
  .row:hover{border-color:var(--line)}
  .row.risk-green{box-shadow:inset 2px 0 0 var(--green)}
  .row.risk-red{box-shadow:inset 2px 0 0 var(--red);background:#201c2a}
  .row.risk-yellow{box-shadow:inset 2px 0 0 var(--amber)}
  .row-check{flex-shrink:0;width:15px;height:15px;accent-color:var(--blue);cursor:pointer}
  .row-main{flex:1;min-width:0}
  .row-name{font-size:12px;font-weight:550;color:#e8eef7;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .row-desc{font-size:10.5px;color:var(--dim);margin-top:3px;line-height:1.45;word-break:break-all}
  .row-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
  .row-size{font-size:11.5px;font-family:Consolas,monospace;color:#cbd5e1;font-variant-numeric:tabular-nums}
  .lock{font-size:12px;color:#f87171;flex-shrink:0;width:15px;text-align:center}
  .sw{width:30px;height:17px;border-radius:9px;background:#475569;position:relative;border:none;flex-shrink:0;transition:background .15s}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:left .16s}
  .sw.on{background:var(--green)}
  .sw.on::after{left:15px}

  .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:13px;border-top:1px solid var(--line-soft)}
  .actions .spacer{flex:1}
  .actions .note{font-size:10.5px;color:var(--dim)}

  .tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--muted);background:#273449;border:1px solid #3b4b63;border-radius:4px;padding:1px 6px;white-space:nowrap}
  .tag-code{font-family:Consolas,monospace;font-size:9.5px;color:#93c5fd;background:rgba(59,130,246,.1);border-color:rgba(59,130,246,.3)}

  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:70px 24px;gap:10px}
  .empty-ico{width:62px;height:62px;border-radius:16px;background:#233149;display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:4px}
  .empty h3{font-size:15px;color:#e8eef7;font-weight:650}
  .empty p{font-size:11.5px;color:var(--muted);line-height:1.7;max-width:440px}
  .empty .actions{border:none;padding-top:8px}
  .empty-list{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:2px}

  .scanning{padding:18px 20px}
  .scanning h3{font-size:14px;color:#f1f5f9;margin-bottom:4px}
  .scanning .lead{font-size:11.5px;color:var(--muted);margin-bottom:14px}
  .progress{height:7px;background:#0b1322;border-radius:4px;overflow:hidden;border:1px solid #22304a}
  .progress i{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,#60a5fa);border-radius:3px;transition:width .4s ease}
  .progress-meta{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);margin-top:7px}
  .stage-list{display:flex;flex-direction:column;gap:2px;margin-top:16px}
  .stage{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:6px;font-size:11.5px;color:var(--dim)}
  .stage .s-ico{width:16px;height:16px;border-radius:50%;border:1.5px solid #334155;display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0}
  .stage.done{color:#86efac}
  .stage.done .s-ico{border-color:var(--green);background:rgba(34,197,94,.15);color:var(--green)}
  .stage.active{background:#233149;color:#e2e8f0}
  .stage.active .s-ico{border-color:var(--blue);border-top-color:transparent;animation:spin 1s linear infinite}
  .stage .s-meta{margin-left:auto;font-size:10px;color:var(--dim);font-family:Consolas,monospace}
  @keyframes spin{to{transform:rotate(360deg)}}
  .skeleton{margin-top:16px;display:flex;flex-direction:column;gap:6px;opacity:.6}
  .sk-row{height:30px;border-radius:6px;background:linear-gradient(90deg,#233149 25%,#2b3a53 37%,#233149 63%);background-size:400% 100%;animation:shimmer 1.4s infinite}
  @keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}

  .split{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px;align-items:start}
  .list-col{display:flex;flex-direction:column;gap:4px}
  .item-btn{display:flex;align-items:center;gap:8px;padding:10px;border-radius:7px;background:none;border:1px solid transparent;text-align:left;width:100%;transition:background .15s,border-color .15s}
  .item-btn:hover{background:#243249}
  .item-btn.active{background:rgba(59,130,246,.13);border-color:rgba(59,130,246,.45)}
  .item-btn .t{font-size:12px;font-weight:600;color:#e8eef7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item-btn .s{font-size:10px;color:var(--dim);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item-btn .r{margin-left:auto;text-align:right;flex-shrink:0}

  .table{width:100%;border-collapse:collapse;font-size:11.5px}
  .table th{font-size:10px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  .table td{padding:9px 8px;border-bottom:1px solid var(--line-soft);color:#cbd5e1;vertical-align:middle}
  .table tr:last-child td{border-bottom:none}
  .table tr:hover td{background:#22304a}
  .table .mono{font-family:Consolas,monospace;font-size:11px;color:#e2e8f0}
  .table .num{text-align:right;font-variant-numeric:tabular-nums;font-family:Consolas,monospace}
  .table .right{text-align:right}
  .table-wrap{overflow-x:auto}

  .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:10.5px;color:var(--muted);font-weight:600}
  .field input,.field select{background:#0f172a;border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:12px;color:var(--text);width:100%}
  .field input:focus,.field select:focus{outline:none;border-color:var(--blue)}
  .field .hint{font-size:10px;color:var(--dim)}
  .field.full{grid-column:1/-1}

  .diskbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:#0b1322;border:1px solid #22304a}
  .diskbar span{height:100%}
  .disk-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:9px;font-size:10.5px;color:var(--muted)}
  .disk-legend i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px}

  .timeline{display:flex;flex-direction:column;gap:0;padding-left:4px}
  .tl-item{display:flex;gap:11px;position:relative;padding-bottom:14px}
  .tl-item:not(:last-child)::before{content:"";position:absolute;left:7px;top:16px;bottom:0;width:1px;background:#334155}
  .tl-dot{width:15px;height:15px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:8px;border:1.5px solid #475569;background:#1e293b;color:#94a3b8;z-index:1}
  .tl-dot.ok{border-color:var(--green);background:rgba(34,197,94,.15);color:var(--green)}
  .tl-dot.err{border-color:var(--red);background:rgba(239,68,68,.15);color:var(--red)}
  .tl-dot.now{border-color:var(--blue);background:rgba(59,130,246,.18);color:#93c5fd}
  .tl-body{flex:1;min-width:0;padding-top:0}
  .tl-title{font-size:11.5px;color:#e2e8f0;font-weight:550;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .tl-meta{font-size:10px;color:var(--dim);margin-top:3px;line-height:1.5;word-break:break-all}
  .tl-code{font-family:Consolas,monospace;font-size:10px;color:#fca5a5;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);padding:2px 5px;border-radius:3px;display:inline-block;margin-top:4px}

  .modal-mask{position:fixed;inset:0;background:rgba(2,6,23,.68);backdrop-filter:blur(2px);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .15s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{background:#1b263b;border:1px solid #34445e;border-radius:12px;box-shadow:var(--shadow);width:520px;max-width:100%;max-height:86vh;display:flex;flex-direction:column;animation:pop .16s ease}
  @keyframes pop{from{transform:translateY(6px) scale(.99);opacity:.6}to{transform:none;opacity:1}}
  .modal.wide{width:660px}
  .modal-head{padding:16px 20px 13px;border-bottom:1px solid var(--line-soft);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .modal-head h3{font-size:14px;font-weight:650;color:#f8fafc}
  .modal-head .sub{font-size:11px;color:var(--dim);margin-top:4px;line-height:1.5}
  .modal-x{background:none;border:none;color:var(--dim);font-size:18px;line-height:1;padding:2px 4px;border-radius:4px}
  .modal-x:hover{color:#fff;background:#334155}

  .muted{color:var(--muted)} .dim{color:var(--dim)} .ok{color:var(--green)} .warn{color:var(--amber)} .bad{color:var(--red)}

  .nowrap{white-space:nowrap} .truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

function t(key, vars) {
  const dict = I18N[LANG] || I18N['zh-CN'];
  let s = dict[key];
  if (s === undefined) s = I18N['zh-CN'][key];
  if (s === undefined) return key;
  if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] !== undefined ? vars[k] : m));
  return s;
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmtGB(gb) {
  if (!gb) return '0 MB';
  if (gb >= 1) return gb.toFixed(1) + ' GB';
  const mb = gb * 1024;
  if (mb >= 1) return Math.round(mb) + ' MB';
  return Math.max(1, Math.round(mb * 1024)) + ' KB';
}
const GIB = 1024 * 1024 * 1024;
function fmtBytes(bytes) {
  return fmtGB(bytes / GIB);
}
function sum(items, key) {
  return items.reduce((a, b) => a + (b[key] || 0), 0);

const TABS = ['ide', 'projects', 'disk', 'rules', 'history'];

function parseRoute() {
  const raw = (location.hash || '').replace(/^#/, '');
  if (raw === 'settings' || raw === 'feedback') return { tab: 'ide', sub: '', modal: raw };
  const parts = raw.split('/');
  const tab = TABS.indexOf(parts[0]) >= 0 ? parts[0] : 'ide';
  return { tab: tab, sub: parts[1] || '', modal: '' };
}
function getIde(id) { return CATALOG.ides.find(x => x.id === id) || CATALOG.ides[0]; }
function ideSize(ide) { return sum(ide.directories, 'size_bytes'); }
function safetyCount(ide, safety) { return ide.directories.filter(d => d.safety === safety).length; }
function yellowKey(ideId, idx) { return ideId + '|' + idx; }
function isConfirmed(ideId, idx) { return !!state.confirmed[yellowKey(ideId, idx)]; }
function isChecked(ideId, idx, dir) {
  if (dir.safety === 'red') return false;
  if (dir.safety === 'yellow' && !isConfirmed(ideId, idx)) return false;
  return !!state.checked[ideId] && !!state.checked[ideId][idx];
}
function selectedDirs(ide) {
  return ide.directories.filter((d, i) => isChecked(ide.id, i, d));
}
function selectedSize(ide) { return sum(selectedDirs(ide), 'size_bytes'); }
function targetAvailableGB() { return state.settings.targetRoot ? DRIVE.targetFreeGB : 0; }
function needBytes(ide) { return Math.ceil(selectedSize(ide) * 1.05 + 64 * 1024 * 1024); }
function needsGB(ide) { return needBytes(ide) / GIB; }
function spaceOk(ide) { return needsGB(ide) <= targetAvailableGB(); }
function targetPathFor(ide) { return (state.settings.targetRoot.replace(/\\$/, '') + '\\' + ide.name.replace(/\s+/g, '')); }
function appTitle() { return document.title; }

function render() {
  const info = parseRoute();
  state.tab = info.tab; state.sub = info.sub; state.modal = info.modal || '';
  if (!modalKind()) state.returnHash = '';
  if (state.sub) {
    if (state.sub === 'process-blocked') {
      const cur = getIde(state.selectedIde);
      if (!cur.runtime.running.length) state.selectedIde = 'cursor';
    } else if (state.sub === 'rollback-confirm') {
      const cur = getIde(state.selectedIde);
      if (!cur.runtime.migrated) { state.selectedIde = 'vscode'; state.selectedHistory = 'h3'; }
    } else if (state.sub.indexOf('migrate-') === 0) {
      const cur = getIde(state.selectedIde);
      if (cur.runtime.migrated || cur.runtime.running.length) state.selectedIde = 'trae-cn';
    }
  }
  renderSidebar();
  renderTopbar();
  renderStats();
  let html = '';
  if (state.tab === 'ide') {
    if (state.sub === 'scanning') html = renderScanning();
    else if (state.sub === 'empty') html = renderEmpty();
    else html = renderIde();
  } else if (state.tab === 'projects') html = renderProjects();
  else if (state.tab === 'disk') html = renderDisk();
  else if (state.tab === 'rules') html = renderRules();
  else if (state.tab === 'history') html = renderHistory();
  document.getElementById('view').innerHTML = html;
  renderModal();
  renderProtoPanel();
  document.documentElement.lang = LANG;
}

function filteredIdes() {
  const q = state.search.trim().toLowerCase();
  return CATALOG.ides.filter(i => {
    if (state.filter === 'c' && i.runtime.migrated) return false;
    if (state.filter === 'migrated' && !i.runtime.migrated) return false;
    if (state.filter === 'running' && !i.runtime.running.length) return false;
    if (!q) return true;
    return i.name.toLowerCase().indexOf(q) >= 0 || i.directories.some(d => d.path.toLowerCase().indexOf(q) >= 0);
  });
}

function itemRow(ide, d, i) {
  const checked = isChecked(ide.id, i, d);
  const color = d.safety === 'green' ? 'var(--green)' : d.safety === 'red' ? 'var(--red)' : 'var(--amber)';
  const badge = d.safety === 'green' ? `<span class="badge b-green">${esc(t('common.green'))}</span>`
    : d.safety === 'red' ? `<span class="badge b-red">⛨ ${esc(t('common.red'))}</span>`
    : `<span class="badge b-amber">? ${esc(t('common.yellow'))}</span>`;
  const left = d.safety === 'red'
    ? `<span class="lock" title="${esc(t('ide.redLocked'))}" aria-label="${esc(t('ide.redLocked'))}">⛨</span>`
    : `<input class="row-check" type="checkbox" ${checked ? 'checked' : ''} ${d.safety === 'yellow' && !isConfirmed(ide.id, i) ? 'disabled' : ''} onclick="App.toggleCheck('${ide.id}',${i})" aria-label="${esc(d.path)}">`;
  const confirmed = d.safety === 'yellow' && isConfirmed(ide.id, i);
  return `<div class="row risk-${d.safety === 'yellow' ? 'yellow' : d.safety}">
    ${left}
    <div class="row-main">
      <div class="row-name">${esc(d.path)}</div>

    </div>
  </div>`;
}

/* ---------- 弹窗 ---------- */
function modalKind() {
  const info = parseRoute();
  if (info.modal) return info.modal;
  const subs = ['migrate-preview', 'migrate-progress', 'migrate-failed', 'migrate-success', 'rollback-confirm', 'process-blocked', 'yellow-confirm'];
  return subs.indexOf(info.sub) >= 0 ? info.sub : '';
}

function modalShell(title, sub, body, foot, wide) {
  return `<div class="modal-head">
      <div><h3>${esc(title)}</h3>${sub ? `<div class="sub">${esc(sub)}</div>` : ''}</div>
      <button type="button" class="modal-x" onclick="App.closeModal()" aria-label="${esc(t('action.close'))}">✕</button>
    </div>
    <div class="modal-body">${body}</div>
    <div class="modal-foot">${foot}</div>`;
}

function renderModal() {
  const kind = modalKind();
  const root = document.getElementById('modal-root');
  if (!kind) { root.innerHTML = ''; return; }
  let html = '';
  if (kind === 'settings') html = modalSettings();
  else if (kind === 'feedback') html = modalFeedback();
  else if (kind === 'migrate-preview') html = modalPreview();
  else if (kind === 'migrate-progress') html = modalProgress();
  else if (kind === 'migrate-failed') html = modalFailed();
  else if (kind === 'migrate-success') html = modalSuccess();
  else if (kind === 'rollback-confirm') html = modalRollback();
  else if (kind === 'process-blocked') html = modalBlocked();
  else if (kind === 'yellow-confirm') html = modalYellow();
  if (!html) { root.innerHTML = ''; return; }
  root.innerHTML = `<div class="modal-mask" onclick="App.closeModal()">
    <div class="modal ${kind === 'migrate-preview' || kind === 'process-blocked' ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(kind)}" onclick="event.stopPropagation()">${html}</div>
  </div>`;
}

      <div class="sum-box"><div class="k">${esc(t('yellow.size'))}</div><div class="v">${fmtBytes(d.size_bytes)}</div></div>
      <div class="sum-box"><div class="k">${esc(t('yellow.detected'))}</div><div class="v" style="font-size:12px">${esc(t(d.reason))}</div></div>
      <div class="sum-box"><div class="k">${esc(t('common.safety'))}</div><div class="v" style="font-size:12px">${esc(t('common.yellow'))}</div></div>
    </div>
    <div class="preview-card"><div class="kv"><span class="k">${esc(t('common.path'))}</span><span class="v">${esc(d.path)}</span></div></div>
    ${confirmed ? `<div class="banner ok"><span class="b-ico">✓</span><div>${esc(t('common.confirmed'))}</div></div>` : ''}`;
  const foot = `<button type="button" class="btn btn-ghost btn-sm" onclick="App.confirmYellow('later')">${esc(t('yellow.later'))}</button>
    <button type="button" class="btn btn-ghost btn-sm" onclick="App.confirmYellow('red')">${esc(t('yellow.markRed'))}</button>
    <button type="button" class="btn btn-primary btn-sm" onclick="App.confirmYellow('green')">${esc(t('yellow.confirm'))}</button>`;
  return modalShell(t('yellow.title'), t('yellow.sub', { path: d.path }), body, foot, true);
}

/* ---------- 原型状态切换 ---------- */
function renderProtoPanel() {
  const panel = document.getElementById('proto-panel');
  const fab = document.getElementById('proto-fab');
  if (!panel) return;
  panel.classList.toggle('show', !!state.protoOpen);
  if (fab) fab.classList.toggle('active', !!state.protoOpen);
  const current = (location.hash || '#ide').replace(/^#/, '');
  const groups = [
    { key: 'proto.section.core', items: [
      { h: 'ide', k: 'proto.route.ide' },
      { h: 'projects', k: 'proto.route.projects' },
      { h: 'disk', k: 'proto.route.disk' },
      { h: 'rules', k: 'proto.route.rules' },
      { h: 'history', k: 'proto.route.history' }
    ] },
    { key: 'proto.section.states', items: [
      { h: 'ide/scanning', k: 'proto.route.scanning' },
      { h: 'ide/empty', k: 'proto.route.empty' },
      { h: 'ide/migrate-preview', k: 'proto.route.preview' },
      { h: 'ide/migrate-progress', k: 'proto.route.progress' },
      { h: 'ide/migrate-failed', k: 'proto.route.failed' },
      { h: 'ide/migrate-success', k: 'proto.route.success' },
      { h: 'ide/process-blocked', k: 'proto.route.blocked' },
      { h: 'ide/rollback-confirm', k: 'proto.route.rollback' },
      { h: 'ide/yellow-confirm', k: 'proto.route.yellow' }
    ] },
    { key: 'proto.section.other', items: [
      { h: 'settings', k: 'proto.route.settings' },
      { h: 'feedback', k: 'proto.route.feedback' }
    ] }
  ];
  panel.innerHTML = `<h4>${esc(t('proto.title'))}</h4><p>${esc(t('proto.desc'))}</p>
    <div class="proto-routes">
      ${groups.map((g, gi) => `${gi ? '<div class="proto-sep"></div>' : ''}<div class="nav-label" style="padding:2px 7px 4px">${esc(t(g.key))}</div>
        ${g.items.map(it => `<button type="button" class="proto-route ${current === it.h ? 'active' : ''}" onclick="App.go('#${it.h}')"><span>${esc(t(it.k))}</span><span class="pr-k">#${esc(it.h)}</span></button>`).join('')}`).join('')}
    </div>`;
  document.getElementById('proto-fab-label').textContent = t('proto.title');
}
/* ---------- 交互动作（原型，不改真实文件） ---------- */
const App = {
  go(hash) {
    state.protoOpen = false;
    if (location.hash === hash) { render(); return; }
    location.hash = hash;
  },
  nav(tab) {
    state.returnHash = '';
    this.go('#' + tab);
  },
  openModal(kind) {
    const activeKind = modalKind();
    if (!activeKind) state.returnHash = location.hash || '#ide';
    this.go('#' + kind);
  },
  closeModal() {
    const back = state.returnHash;
    state.returnHash = '';
    this.go(back && back !== location.hash ? back : '#ide');
  },
  toggleLang() {
    this.setLang(LANG === 'zh-CN' ? 'en' : 'zh-CN');
  },
  setLang(lang) {
    if (lang !== 'en' && lang !== 'zh-CN') return;
    LANG = lang;
    try { localStorage.setItem('dw-lang', lang); } catch (e) {}
    render();
  },
  toggleSetting(key) {
    const root = document.getElementById('settings-root');
    if (root) state.settings.targetRoot = root.value;
    state.settings[key] = !state.settings[key];
    render();
  },
  saveSettings() {
    const root = document.getElementById('settings-root');
    if (root) state.settings.targetRoot = root.value.trim() || 'D:\\DiskWarden\\';
    const un = document.getElementById('settings-uninstall');
    if (un) state.settings.uninstall = un.value;
    this.toast(t('toast.saved'));
    this.closeModal();
  },
  rescan() {
    state.scanning = true;
    state.scanPct = 62;
    this.go('#ide/scanning');
  },
  cancelScan() {
    state.scanning = false;
    this.toast(t('toast.scanCancelled'));
    this.go('#ide');
  },
  search(value) {
    state.search = value;
    const list = filteredIdes();
    const el = document.querySelector('.ide-list');
    if (!el) return;
    el.innerHTML = list.length
      ? list.map(i => ideRow(i)).join('')
      : `<div class="empty" style="padding:26px 10px"><p>${esc(t('ide.listEmpty'))}</p></div>`;
  },
  setFilter(filter) {
    state.filter = filter;
    render();
  },
  selectIde(id) {
    state.selectedIde = id;
    render();
  },
  toggleCheck(ideId, idx) {
    const ide = getIde(ideId);
    const dir = ide.directories[idx];
    if (!dir || dir.safety === 'red') return;
    if (dir.safety === 'yellow' && !isConfirmed(ideId, idx)) return;
    state.checked[ideId] = state.checked[ideId] || {};
    state.checked[ideId][idx] = !state.checked[ideId][idx];
    render();
  },
  openYellow(ideId, idx) {
    state.selectedIde = ideId;
    state.pendingYellow = { ide: ideId, idx: idx };
    state.returnHash = '#ide';
    this.go('#ide/yellow-confirm');
  },
  confirmYellow(action) {
    const py = state.pendingYellow;
    const ide = getIde(py.ide);
    const dir = ide.directories[py.idx];
    state.selectedIde = ide.id;
    if (!dir) { this.go('#ide'); return; }
    if (action === 'green') {
      state.confirmed[yellowKey(ide.id, py.idx)] = true;
      state.checked[ide.id] = state.checked[ide.id] || {};
      state.checked[ide.id][py.idx] = true;
      this.toast(t('toast.yellowConfirmed'));
    } else if (action === 'red') {
      dir.safety = 'red';
      if (state.checked[ide.id]) delete state.checked[ide.id][py.idx];
      this.toast(t('rules.markedRed'));
    }
    this.go('#ide');
  },
  startPreview(ideId) {
    const ide = getIde(ideId);
    state.selectedIde = ide.id;
    if (!selectedDirs(ide).length) { this.toast(t('toast.needSelect')); return; }
    state.returnHash = '#ide';
    if (ide.runtime.running.length) { this.go('#ide/process-blocked'); return; }
    if (!spaceOk(ide)) { this.toast(t('toast.spaceShort')); return; }
    this.go('#ide/migrate-preview');
  },
  cleanCaches(ideId) {
    const ide = getIde(ideId);
    const total = sum(ide.directories.filter(d => d.safety === 'green'), 'size_bytes') / GIB;
    this.toast(t('toast.cleaned', { size: fmtGB(total) }));
  },
  openRollback(ideId) {
    state.selectedIde = ideId;
    state.returnHash = '#ide';
    this.go('#ide/rollback-confirm');
  },
  confirmRollback() {
    const ide = getIde(state.selectedIde);
    const target = ide.runtime.target || targetPathFor(ide);
    ide.runtime.migrated = false;
    ide.runtime.location = 'C';
    delete ide.runtime.target;
    HISTORY.unshift({
      id: 'h' + Date.now(), at: '2026-10-19 10:05', type: 'rollback', app: ide.name,
      from: target, to: 'C:', freed: 0, duration: '2m 20s', result: 'rolledback',
      canRollback: false, note: 'history.rollbackDone',
      steps: ['rollbackStep1', 'rollbackStep2', 'rollbackStep3']
    });
    state.selectedHistory = HISTORY[0].id;
    state.historyFilter = 'all';
    state.returnHash = '';
    this.toast(t('toast.rollbackStarted'));
    this.go('#history');
  },
  retryMigrate() {
    this.toast(t('toast.retry'));
    this.go('#ide/migrate-progress');
  },
  rollbackFailed() {
    this.toast(t('toast.rollbackStarted'));
    this.go('#ide');
  },
  recheckProcess() {
    this.toast(t('blocked.stillBlocked'));
  },
  showForceWarn() {
    this.toast(t('blocked.forceWarn'));
  },
  viewLog() {
    this.toast(t('toast.copied'));
  },
  selectProject(id) {
    state.selectedProject = id;
    render();
  },
  cleanProject(kind) {
    const p = PROJECTS.find(x => x.id === state.selectedProject);
    if (!p) return;
    let freed = 0;
    if (kind === 'deps' || kind === 'all') { freed += p.deps; p.deps = 0; }
    if (kind === 'dist' || kind === 'all') { freed += p.dist; p.dist = 0; }
    this.toast(t('toast.cleaned', { size: fmtGB(freed) }));
    render();
  },
  selectHistory(id) {
    state.selectedHistory = id;
    render();
  },
  setHistoryFilter(filter) {
    state.historyFilter = filter;
    const current = HISTORY.find(x => x.id === state.selectedHistory);
    const visible = filter === 'all' || (current && current.type === filter);
    if (!visible) {
      const first = HISTORY.find(x => filter === 'all' || x.type === filter);
      if (first) state.selectedHistory = first.id;
    }
    render();
  },
  exportHistory() {
    this.toast(t('history.exported'));
  },
  rollbackHistory(id) {
    const h = HISTORY.find(x => x.id === id);
    if (!h || !h.canRollback) return;
    state.selectedHistory = h.id;
    const ide = CATALOG.ides.find(x => x.name === h.app);
    if (ide) state.selectedIde = ide.id;
    state.returnHash = '#history';
    this.go('#ide/rollback-confirm');
  },
  addRule() {
    const matchEl = document.getElementById('rule-match');
    const match = matchEl ? matchEl.value.trim() : '';
    if (!match) {
      if (matchEl) matchEl.focus();
      this.toast(t('rules.required'));
      return;
    }
    const typeEl = document.getElementById('rule-type');
    const safetyEl = document.getElementById('rule-safety');
    const reasonEl = document.getElementById('rule-reason');
    RULES.unshift({
      id: 'r' + Date.now(), match: match,
      type: typeEl ? typeEl.value : 'exact',
      safety: safetyEl ? safetyEl.value : 'green',
      source: 'user', hits: 0, enabled: true,
      reason: reasonEl && reasonEl.value.trim() ? reasonEl.value.trim() : ''
    });
    render();
    this.toast(t('rules.added'));
  },
  toggleRule(id) {
    const r = RULES.find(x => x.id === id);
    if (!r) return;
    r.enabled = !r.enabled;
    render();
  },
  deleteRule(id) {
    const i = RULES.findIndex(x => x.id === id);
    if (i < 0) return;
    RULES.splice(i, 1);
    render();
    this.toast(t('rules.deleted'));
  },
  resolvePending(id, action) {
    const i = PENDING.findIndex(x => x.id === id);
    if (i < 0) return;
    const pd = PENDING[i];
    PENDING.splice(i, 1);
    if (action === 'green' || action === 'red') {
      const name = pd.path.replace(/[\\/]+$/, '').split(/[\\/]/).pop() || pd.path;
      RULES.unshift({ id: 'r' + Date.now(), match: name, type: 'exact', safety: action, source: 'user', hits: 0, enabled: true });
      this.toast(t(action === 'green' ? 'rules.markedGreen' : 'rules.markedRed'));
    } else {
      this.toast(t('rules.ignored'));
    }
    render();
  },
  copyDiagnostics() {
    const diag = [
      'Disk Warden v0.1.0 (prototype)',
      'OS: Windows 10 22H2 x64',
      'Locale: ' + LANG,
      'Last scan: ' + KPI.lastScan + ' (' + KPI.scanDuration + ')',
      'IDEs: ' + CATALOG.ides.length + ' · dirs: ' + CATALOG.ides.reduce((a, i) => a + i.directories.length, 0),
      'Target root: ' + state.settings.targetRoot
    ].join('\n');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(diag).catch(() => {});
    }
    this.toast(t('feedback.copied'));
  },
  toast(message) {
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = message;
    el.classList.add('show');
    clearTimeout(state.toastTimer);
    state.toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
  }
};

/* ---------- 初始化 ---------- */
function init() {
  let saved = null;
  try { saved = localStorage.getItem('dw-lang'); } catch (e) {}
  const query = new URLSearchParams(location.search).get('lang');
  const initial = query || saved;
  if (initial === 'en' || initial === 'zh-CN') LANG = initial;

  if (!location.hash) {
    try { history.replaceState(null, '', location.pathname + location.search + '#ide'); }
    catch (e) { location.hash = 'ide'; }
  }

  window.addEventListener('hashchange', render);
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (modalKind()) App.closeModal();
    else if (state.protoOpen) { state.protoOpen = false; renderProtoPanel(); }
  });
  document.getElementById('proto-fab').addEventListener('click', e => {
    e.stopPropagation();
    state.protoOpen = !state.protoOpen;
    renderProtoPanel();
  });
  document.addEventListener('click', e => {
    if (!state.protoOpen) return;
    if (e.target.closest('#proto-panel') || e.target.closest('#proto-fab')) return;
    state.protoOpen = false;
    renderProtoPanel();
  });

  render();
}

init();
</script>
