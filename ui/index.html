<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disk Warden</title>
<style>
/* ============================================================
   Disk Warden — 360 安全卫士风格 / 桌面客户端布局
   竖版导航 + 竖向列表 Tab + 固定工具栏，弱化网页感。
   ============================================================ */
:root{
  --green:#3fbf44; --green-dark:#2fa838; --green-deep:#238b2c;
  --green-soft:#eef8ed; --green-line:#d5ecd3;
  --bg:#f4f6f7; --panel:#ffffff; --panel-2:#fafbfc;
  --line:#e3e7eb; --line-soft:#edf0f3;
  --text:#2f3439; --text-2:#5b646d; --muted:#7d8791; --dim:#98a2ac;
  --blue:#2f8bf5; --blue-2:#1d74dc; --red:#e5484d; --amber:#d98500;
  --violet:#7c5cff;
  --radius:5px; --radius-sm:3px;
  /* 桌面端字号阶梯：最小 11px，正文 14px（100% DPI 可读） */
  --fs-micro:11px; --fs-meta:12px; --fs-body:13px; --fs-strong:14px;
  --fs-sub:15px; --fs-title:16px; --fs-page:19px; --fs-kpi:26px;
  --shadow:0 12px 30px rgba(31,45,61,.16);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",-apple-system,"Segoe UI",sans-serif;
  background:var(--bg); color:var(--text); overflow:hidden; font-size:var(--fs-strong); line-height:1.55;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue);text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#c7cfd6;border-radius:4px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#aeb8c0}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid #7fd383;outline-offset:1px;border-radius:3px}

.app{display:flex;flex-direction:column;height:100vh;min-width:1080px;background:var(--bg)}

/* ---------- 顶部绿色导航 ---------- */
.topnav{
  height:96px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 16px;
  background:linear-gradient(180deg,#4dca52 0%,#41c046 55%,#39b23f 100%);color:#fff;
  position:relative;z-index:30;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 1px 4px rgba(26,90,34,.16);
}
.brand{width:190px;flex-shrink:0;display:flex;align-items:center;gap:9px;min-width:0}
.brand-badge{
  width:38px;height:38px;flex-shrink:0;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.38);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22);
}
.brand-badge svg{width:23px;height:23px}
.brand-text{min-width:0}
.brand-name{font-size:var(--fs-title);font-weight:700;letter-spacing:.2px;line-height:1.2;white-space:nowrap}
.brand-sub{font-size:var(--fs-micro);color:rgba(255,255,255,.84);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;align-items:center;gap:4px;height:100%;flex:1;min-width:0}
.nav-item{
  width:96px;height:84px;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  border:none;background:transparent;color:#fff;border-radius:8px;position:relative;
  transition:background .12s;font-size:var(--fs-strong);white-space:nowrap;
}
.nav-item:hover{background:rgba(255,255,255,.13)}
.nav-item.active{background:rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.nav-item.active::after{content:"";position:absolute;left:50%;bottom:4px;transform:translateX(-50%);width:16px;height:2px;border-radius:2px;background:#fff;opacity:.92}
.nav-ico{
  width:33px;height:33px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  color:#fff;background:linear-gradient(135deg,var(--ico-1,#63b8ff),var(--ico-2,#2f8bf5));
  box-shadow:0 1px 3px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.32);
  position:relative;flex-shrink:0;
}
.nav-ico svg{width:20px;height:20px}
.nav-ico .nav-count{
  position:absolute;top:-6px;right:-8px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;
  background:#fff;color:#2f8e35;font-size:var(--fs-micro);font-weight:700;line-height:19px;text-align:center;
  box-shadow:0 1px 2px rgba(0,0,0,.2);
}
.nav-name{line-height:1}
.system{display:flex;align-items:center;gap:7px;margin-left:auto;padding-left:10px;flex-shrink:0}
.system-chip{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;height:30px;padding:0 12px;
  border-radius:15px;border:1px solid rgba(255,255,255,.34);background:rgba(255,255,255,.13);
  color:#fff;font-size:var(--fs-body);white-space:nowrap;transition:background .12s;
}
.system-chip:hover{background:rgba(255,255,255,.27)}
.system-chip.icon{width:30px;padding:0;border-radius:50%}
.system-chip.icon svg{width:17px;height:17px}
.system-chip .ai-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5);flex-shrink:0}
.system-chip .ai-dot.on{background:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.system-ver{font-size:var(--fs-meta);color:rgba(255,255,255,.75);margin-left:2px;white-space:nowrap}

/* ---------- 主区 ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.topbar{
  flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);z-index:5;
}
.topbar h1{font-size:var(--fs-page);font-weight:700;color:#2f3439;line-height:1.3;letter-spacing:.2px}
.scan-meta{font-size:var(--fs-meta);color:var(--dim);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.scan-meta .live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
.top-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.main-scroll{flex:1;min-height:0;overflow:hidden;padding:12px 16px 16px;background:var(--bg);display:flex;flex-direction:column}
#view{flex:1;min-height:0;display:flex;flex-direction:column}

/* ---------- 按钮 ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:7px 14px;border-radius:3px;
  font-size:var(--fs-strong);font-weight:400;border:1px solid transparent;line-height:1.2;
  transition:background .12s,border-color .12s,color .12s;white-space:nowrap;
}
.btn-primary{background:#3fbf44;color:#fff;border-color:#38b13e}
.btn-primary:hover{background:#35ac3a;border-color:#2fa336}
.btn-primary:active{background:#2fa838}
.btn-ghost{background:#fff;color:#4a545e;border-color:#d7dee4}
.btn-ghost:hover{background:#f6f8fa;border-color:#b9c4cc;color:#2f3439}
.btn-danger{background:#fff;color:#d9363e;border-color:#ecc0be}
.btn-danger:hover{background:#e5484d;border-color:#e5484d;color:#fff}
.btn-soft{background:var(--green-soft);color:#2f8f35;border-color:var(--green-line)}
.btn-soft:hover{background:#ddf3db}
.btn-sm{padding:6px 11px;font-size:var(--fs-body)}
.btn-xs{padding:3px 8px;font-size:var(--fs-meta);border-radius:2px}
.btn[disabled],.btn.disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.25)}
.btn[disabled]:hover,.btn.disabled:hover{background:inherit;color:inherit;border-color:inherit}
.modal-foot .btn{padding:6px 16px}

.v-red{color:var(--red)} .v-blue{color:var(--blue)} .v-green{color:#2f8e35} .v-amber{color:var(--amber)} .v-violet{color:var(--violet)}

/* ---------- 内容与分栏 ---------- */
.content{display:flex;flex-direction:column;gap:12px;min-width:0;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:2px}
.content > .panel{flex-shrink:0}
.split-layout{display:grid;grid-template-columns:272px minmax(0,1fr);align-items:stretch;gap:12px;min-width:0;flex:1;min-height:0;overflow:hidden}
.split-layout > .bar{min-width:0;padding:9px;min-height:0;overflow:hidden}
.split-layout > .panel{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.narrow{max-width:860px;width:100%;margin:0 auto}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:5px;min-width:0}
.panel-head{padding:10px 14px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel-head h2{font-size:var(--fs-sub);font-weight:700;color:#2f3439;display:flex;align-items:center;gap:7px}
.panel-head h2::before{content:"";width:3px;height:15px;border-radius:1px;background:var(--green);flex-shrink:0}
.panel-head .hint{font-size:var(--fs-meta);color:var(--dim)}
.panel-body{padding:12px 14px}
/* 面板内滚动：标题栏与表单固定，列表自身滚动（规则页） */
.panel-scroll{display:flex;flex-direction:column;min-height:0;flex:1}
.content > .panel.panel-scroll{flex-shrink:1}
.panel-scroll > .panel-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.panel-scroll > .panel-body > *{flex-shrink:0}
.panel-scroll .scroll-y{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:3px}
.panel-scroll .scroll-y > .table thead th{position:sticky;top:0;z-index:1;box-shadow:inset 0 -1px 0 var(--line)}
.content > .cols{display:grid;gap:12px;flex:1;min-height:0;grid-template-rows:minmax(0,1fr);align-items:stretch;grid-template-columns:minmax(0,1fr) minmax(0,1.22fr)}
.content > .cols.cols-disk{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.content > .cols > .panel{min-height:0;max-height:100%}
.panel-scroll .scroll-y.scroll-fit{flex:0 1 auto}
.cols .trow.pend,.modal .trow.pend{grid-template-columns:minmax(0,1fr) auto;row-gap:3px;align-items:center;white-space:normal;padding:9px 12px}
.cols .trow.pend .tcell.tpath,.modal .trow.pend .tcell.tpath{grid-column:1;grid-row:1}
.cols .trow.pend .tcell.tsize,.modal .trow.pend .tcell.tsize{grid-column:2;grid-row:1;justify-self:end}
.cols .trow.pend .tcell.tdesc,.modal .trow.pend .tcell.tdesc,.cols .trow.pend .tcell.wrap,.modal .trow.pend .tcell.wrap{grid-column:1/-1;grid-row:2}
.cols .trow.pend .tcell.acts,.modal .trow.pend .tcell.acts{grid-column:1/-1;grid-row:3;justify-content:flex-end}
.rule-form{grid-template-columns:1.2fr .8fr .8fr 1.3fr 1.1fr auto;align-items:end}
.cols .rule-form{grid-template-columns:minmax(0,1fr) minmax(0,1fr);row-gap:8px;align-items:end}
.cols .rule-form > button{justify-self:end;white-space:nowrap}
.toolbar{display:flex;gap:6px;align-items:center;margin-bottom:9px;flex-wrap:wrap}
.search{flex:1;min-width:100px;background:#fff;border:1px solid #d7dee4;border-radius:3px;padding:7px 9px;font-size:var(--fs-body);color:var(--text);transition:border-color .12s}
.search::placeholder{color:#aab3bc}
.search:focus{outline:none;border-color:#7fd383}

.legend{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:var(--fs-meta);color:var(--muted)}
.legend .dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:3px}
.dot-green{background:var(--green)} .dot-red{background:var(--red)} .dot-amber{background:#f0a020} .dot-blue{background:var(--blue)} .dot-gray{background:#aab3bc}

/* 列表栏 */
.bar{background:#fff;border:1px solid var(--line);border-radius:5px;display:flex;flex-direction:column;gap:9px;min-width:0}
.bar-title{font-size:var(--fs-strong);font-weight:700;color:#2f3439;white-space:nowrap;display:flex;align-items:center;gap:6px}
.bar-title::before{content:"";width:3px;height:14px;border-radius:1px;background:var(--green);flex-shrink:0}
.bar-hint{font-size:var(--fs-meta);color:var(--dim);white-space:nowrap}
.chip-row{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.split-layout .bar-top{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 8px;min-width:0}
.split-layout .bar-top .bar-hint{text-align:right}
.split-layout .bar-top .search{grid-column:1/-1;width:100%;flex:none}
.split-layout .bar-top .chip-row{grid-column:1/-1}
.split-layout .bar-top .legend{grid-column:1/-1;margin-left:0;flex-direction:column;align-items:flex-start;gap:2px;font-size:var(--fs-meta);line-height:1.5}

/* 竖向 Tab 列表：列表栏头固定，列表区自身滚动 */
.split-layout .bar-top{flex:0 0 auto}
.split-layout .ide-bar{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:2px;padding:1px 3px 2px 0}
.split-layout .proj-bar,
.split-layout .hist-bar{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:1px 3px 2px 0}
.split-layout .ide-item,
.split-layout .proj-card,
.split-layout .hist-card{
  width:100%;min-width:0;flex:none;border-radius:3px;border:1px solid transparent;
  background:transparent;box-shadow:none;text-align:left;transition:background .12s,border-color .12s;
}
.split-layout .ide-item:hover,
.split-layout .proj-card:hover,
.split-layout .hist-card:hover{background:#f5f8fa;border-color:#e8edf1}
.split-layout .ide-item.active,
.split-layout .proj-card.active,
.split-layout .hist-card.active{background:var(--green-soft);border-color:var(--green-line);box-shadow:inset 3px 0 0 var(--green)}

.split-layout .ide-item{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:8px;padding:7px 8px}
.split-layout .ide-top{display:contents}
.split-layout .ide-mark{width:28px;height:28px;font-size:var(--fs-meta);border-radius:5px}
.split-layout .ide-name{font-size:var(--fs-strong);font-weight:600;color:#33383d}
.split-layout .ide-sub{font-size:var(--fs-micro);color:var(--dim);margin-top:1px}
.split-layout .ide-foot{display:flex;flex-direction:column;align-items:flex-end;gap:2px;white-space:nowrap}
.split-layout .ide-size{font-size:var(--fs-meta);color:#4a545e}
.split-layout .ide-item .badge{font-size:var(--fs-micro);padding:0 4px;line-height:1.6}
.split-layout .run-dot{width:4px;height:4px;margin-right:2px}

.split-layout .proj-card{padding:8px 9px;gap:4px}
.split-layout .pc-name{font-size:var(--fs-strong);font-weight:600}
.split-layout .pc-path{font-size:var(--fs-micro)}
.split-layout .pc-size{font-size:var(--fs-meta)}
.split-layout .pc-foot .dim{display:none}
.split-layout .hist-card{padding:8px 9px;gap:4px}
.split-layout .hc-name{font-size:var(--fs-strong);font-weight:600}
.split-layout .hc-meta{font-size:var(--fs-micro)}
.split-layout .hc-size{font-size:var(--fs-meta)}

/* ---------- 徽标 ---------- */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-micro);font-weight:600;padding:1px 6px;border-radius:2px;line-height:1.5;white-space:nowrap}
.b-green{background:#eaf7e8;color:#2f8e35;border:1px solid #d0eccd}
.b-red{background:#fff0ef;color:#d9363e;border:1px solid #f2c9c6}
.b-amber{background:#fff7e6;color:#c47b00;border:1px solid #f1dcaa}
.b-blue{background:#eef5ff;color:#1f6fd0;border:1px solid #cfe2fb}
.b-gray{background:#f2f4f6;color:#7d8791;border:1px solid #e1e6ea}
.b-violet{background:#f3efff;color:#6f4bd8;border:1px solid #ddd0fb}
.b-plain{background:#fff;color:var(--muted);border:1px solid #e1e6ea;font-weight:600}

.detail{display:flex;flex-direction:column;gap:14px;padding:16px 18px 18px}
.split-layout .detail{padding:14px 16px 16px;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column}
.split-layout .detail > *{flex-shrink:0}
.split-layout .detail > .actions{position:sticky;bottom:0;z-index:2;background:var(--panel);margin:auto -16px -16px;padding:12px 16px 14px;box-shadow:0 -8px 14px -12px rgba(31,45,61,.22)}
.detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.detail-title{display:flex;align-items:center;gap:9px;min-width:0}
.detail-title > div{min-width:0}
.detail-title h2{font-size:var(--fs-page);font-weight:700;color:#2f3439}
.detail-path{font-size:var(--fs-meta);color:var(--dim);font-family:Consolas,monospace;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(660px,60vw)}
.detail-badges{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;flex-shrink:0}

.banner{display:flex;gap:8px;padding:8px 10px;border-radius:3px;font-size:var(--fs-body);line-height:1.55;border:1px solid}
.banner .b-ico{flex-shrink:0;font-size:var(--fs-sub);line-height:1.3}
.banner.warn{background:#fff9ea;border-color:#f1dcaa;color:#a86a00}
.banner.danger{background:#fff1f0;border-color:#f2c9c6;color:#c92f36}
.banner.info{background:#eff6ff;border-color:#cfe2fb;color:#1f6fd0}
.banner.ok{background:#f0faf0;border-color:#d0eccd;color:#2f8e35}
.banner b{font-weight:700}
.banner .btn{margin-top:5px}
.banner-actions{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}

.preview-card{background:#f7faf7;border:1px solid #e2eee0;border-radius:4px;padding:10px 12px}
.preview-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.preview-top .t{font-size:var(--fs-meta);font-weight:700;color:#2f8e35;letter-spacing:.3px}
.kv{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:var(--fs-body);padding:2px 0}
.kv .k{color:var(--muted)}
.kv .v{font-family:Consolas,monospace;color:#2f3439;font-weight:600;text-align:right;word-break:break-all}
.kv .v.ok{color:#2f8e35}
.kv .v.warn{color:var(--amber)}

.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:1px}
.section-title h3{font-size:var(--fs-body);font-weight:700;color:#4a545e;letter-spacing:.3px;display:flex;align-items:center;gap:6px}
.section-title h3::before{content:"";width:3px;height:14px;border-radius:1px;background:var(--green);flex-shrink:0}
.section-title .sub{font-size:var(--fs-meta);color:var(--dim)}
.rows{display:flex;flex-direction:column;gap:5px;min-width:0}
.row{display:flex;align-items:center;gap:9px;padding:8px 10px;background:var(--panel-2);border:1px solid #eef1f4;border-radius:3px}
.row:hover{background:#f7fafc;border-color:#e0e6eb}
.row.risk-green{box-shadow:inset 2px 0 0 var(--green)}
.row.risk-red{box-shadow:inset 2px 0 0 var(--red);background:#fdf7f7}
.row.risk-yellow{box-shadow:inset 2px 0 0 #f0a020}
.row-check{flex-shrink:0;width:16px;height:16px;accent-color:var(--green);cursor:pointer}
.row-main{flex:1;min-width:0}
.row-name{font-size:var(--fs-strong);font-weight:550;color:#33383d;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-desc{font-size:var(--fs-meta);color:var(--dim);margin-top:2px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.row-size{font-size:var(--fs-body);font-family:Consolas,monospace;color:#4a545e;font-variant-numeric:tabular-nums}
.lock{font-size:var(--fs-body);color:#d9363e;flex-shrink:0;width:16px;text-align:center}

/* 详情行 */
.trow{display:grid;align-items:center;gap:14px;min-height:48px;padding:0 12px;background:var(--panel-2);border:1px solid #eef1f4;border-radius:4px;white-space:nowrap;transition:background .12s,border-color .12s}
.trow:hover{background:#f7fafc;border-color:#e0e6eb}
.trow.risk-green{box-shadow:inset 3px 0 0 var(--green)}
.trow.risk-red{box-shadow:inset 3px 0 0 var(--red);background:#fdf7f7}
.trow.risk-yellow{box-shadow:inset 3px 0 0 #f0a020;background:#fffbf3}
.trow.dir{grid-template-columns:18px minmax(0,1.6fr) minmax(0,1.15fr) 84px 106px}
.trow.proj{grid-template-columns:18px minmax(0,1.6fr) minmax(0,1.2fr) 84px 106px}
.trow.pend{grid-template-columns:minmax(0,1.6fr) minmax(0,1.1fr) 84px auto}
.trow.cap{grid-template-columns:minmax(0,1.6fr) minmax(0,1.1fr) 84px 98px}
.tcell{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcell.lockcell{display:flex;align-items:center;justify-content:center;overflow:visible}
.tcell.tpath{font-size:var(--fs-strong);font-weight:550;color:#33383d;font-family:Consolas,monospace}
.tcell.tpath.badged{display:flex;align-items:center;gap:6px}
.tcell.tpath.badged .badge{flex-shrink:0}
.tcell.tpath.badged .tp{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcell.tdesc{font-size:var(--fs-meta);color:var(--dim)}
.tcell.tsize{font-size:var(--fs-body);font-family:Consolas,monospace;color:#4a545e;text-align:right;font-variant-numeric:tabular-nums}
.tcell.acts{display:flex;align-items:center;justify-content:flex-end;gap:5px;overflow:visible}
.trow.pend.has-sug{align-items:start;padding:10px 12px;white-space:normal}
.trow.pend.has-sug .tcell.wrap{white-space:normal;overflow:visible}
.trow.pend.has-sug .tcell.tpath{padding-top:2px}

.kvbar{display:flex;align-items:stretch;background:#f7faf7;border:1px solid #e2eee0;border-radius:4px;overflow:hidden}
.kvbar .kv-item{display:flex;flex-direction:column;justify-content:center;gap:3px;padding:10px 12px;min-width:0;flex:1}
.kvbar .kv-item.wide{flex:2.2}
.kvbar .kv-item + .kv-item{border-left:1px solid #e7f0e6}
.kvbar .k{font-size:var(--fs-meta);color:var(--muted);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.kvbar .v{font-size:var(--fs-body);font-family:Consolas,monospace;color:#2f3439;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kvbar .v.ok{color:#2f8e35}
.kvbar .v.warn{color:var(--amber)}

/* 错误明细 / 失败项：逐条独占一行，路径在上、原因在下（长路径不截断、不与原因叠字） */
.err-list{display:flex;flex-direction:column;gap:5px;min-width:0}
.err-item{display:flex;flex-direction:column;gap:2px;min-width:0;padding:8px 11px;border-radius:3px;background:#fdf7f7;border:1px solid #f2c9c6}
.err-item .e-path{font-size:var(--fs-meta);font-family:Consolas,monospace;color:#33383d;line-height:1.5;overflow-wrap:anywhere}
.err-item .e-msg{font-size:var(--fs-meta);color:#c92f36;line-height:1.5;overflow-wrap:anywhere}
.err-item.plain{background:var(--panel-2);border-color:#eef1f4}
.err-item.plain .e-msg{color:#5b646d}
/* 需要核对/复制的长值：纵向逐条、自动换行、附复制入口 */
.err-item .val-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.err-item .val-head .e-k{font-size:var(--fs-meta);color:var(--muted);line-height:1.4;overflow-wrap:anywhere}
.copy-btn{flex-shrink:0;border:1px solid #d9e2ea;background:#fff;color:#4a545e;border-radius:3px;padding:1px 7px;font-size:11px;line-height:16px;cursor:pointer}
.copy-btn:hover{border-color:#a9bacb;color:#2f3439}
.copy-btn:active{background:#eef2f5}
.sw{width:34px;height:19px;border-radius:10px;background:#cbd3db;position:relative;border:none;flex-shrink:0;transition:background .12s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.16);transition:left .14s}
.sw.on{background:var(--green)}
.sw.on::after{left:18px}

.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line-soft)}
.actions .spacer{flex:1}
.actions .note{font-size:var(--fs-meta);color:var(--dim)}

.tag{display:inline-flex;align-items:center;gap:3px;font-size:var(--fs-micro);color:var(--muted);background:#f2f5f7;border:1px solid #e1e6ea;border-radius:2px;padding:1px 5px;white-space:nowrap}
.tag-code{font-family:Consolas,monospace;font-size:var(--fs-micro);color:#2f8e35;background:#eef8ed;border-color:#d7edd5}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 24px;gap:9px}
.empty-ico{width:60px;height:60px;border-radius:12px;background:#eef8ed;color:#3fbf44;display:flex;align-items:center;justify-content:center;font-size:var(--fs-kpi);margin-bottom:3px;border:1px solid #d9eed7}
.empty h3{font-size:var(--fs-title);color:#2f3439;font-weight:700}
.empty p{font-size:var(--fs-body);color:var(--muted);line-height:1.65;max-width:440px}
.empty .actions{border:none;padding-top:6px}
.empty-list{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-top:2px}

.scanning{padding:16px 18px}
.scanning h3{font-size:var(--fs-sub);color:#2f3439;margin-bottom:3px}
.scanning .lead{font-size:var(--fs-body);color:var(--muted);margin-bottom:12px}
.progress{height:7px;background:#e9eef0;border-radius:3px;overflow:hidden;border:1px solid #e1e7ec}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#63d168,#3fbf44);border-radius:3px;transition:width .3s ease}
.progress-meta{display:flex;justify-content:space-between;font-size:var(--fs-meta);color:var(--dim);margin-top:6px}
.stage-list{display:flex;flex-direction:column;gap:1px;margin-top:14px}
.stage{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:3px;font-size:var(--fs-body);color:var(--dim)}
.stage .s-ico{width:18px;height:18px;border-radius:50%;border:1.5px solid #d3dae1;display:flex;align-items:center;justify-content:center;font-size:var(--fs-micro);flex-shrink:0}
.stage.done{color:#2f8e35}
.stage.done .s-ico{border-color:#8fd68b;background:#eaf7e8;color:#2f8e35}
.stage.active{background:#f2faf1;color:#33383d}
.stage.active .s-ico{border-color:var(--green);border-top-color:transparent;animation:spin 1s linear infinite}
.stage .s-meta{margin-left:auto;font-size:var(--fs-micro);color:var(--dim);font-family:Consolas,monospace}
@keyframes spin{to{transform:rotate(360deg)}}
.skeleton{margin-top:14px;display:flex;flex-direction:column;gap:5px;opacity:.7}
.sk-row{height:30px;border-radius:3px;background:linear-gradient(90deg,#eef2f5 25%,#f7f9fb 37%,#eef2f5 63%);background-size:400% 100%;animation:shimmer 1.4s infinite}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}

/* 项目 / 历史卡片（非分栏时） */
.proj-bar{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding-bottom:2px}
.proj-card{flex:1 1 0;min-width:196px;display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:4px;border:1px solid #e7ecf1;background:#fff;text-align:left}
.proj-card:hover{background:#f7faf7;border-color:#c9e6c7}
.proj-card.active{background:#f3fbf1;border-color:#8fd68b;box-shadow:inset 0 -2px 0 var(--green)}
.pc-top{display:flex;align-items:center;gap:7px;min-width:0}
.pc-name{font-size:var(--fs-strong);font-weight:600;color:#33383d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.pc-path{font-size:var(--fs-micro);color:var(--dim);font-family:Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;white-space:nowrap}
.pc-size{font-size:var(--fs-meta);font-family:Consolas,monospace;color:#4a545e;font-variant-numeric:tabular-nums}
.hist-bar{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding-bottom:2px}
.hist-card{flex:1 1 0;min-width:192px;display:flex;flex-direction:column;gap:5px;padding:9px 11px;border-radius:4px;border:1px solid #e7ecf1;background:#fff;text-align:left}
.hist-card:hover{background:#f7faf7;border-color:#c9e6c7}
.hist-card.active{background:#f3fbf1;border-color:#8fd68b;box-shadow:inset 0 -2px 0 var(--green)}
.hc-top{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0}
.hc-name{font-size:var(--fs-strong);font-weight:600;color:#33383d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hc-meta{font-size:var(--fs-micro);color:var(--dim);font-family:Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;white-space:nowrap}
.hc-size{font-size:var(--fs-meta);font-family:Consolas,monospace;color:#8a949e;font-variant-numeric:tabular-nums}

.table{width:100%;border-collapse:collapse;font-size:var(--fs-strong)}
.table th{font-size:var(--fs-meta);font-weight:600;color:#8a949e;text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fafbfc}
.table td{padding:10px 8px;border-bottom:1px solid var(--line-soft);color:#4a545e;vertical-align:middle}
.table tr:last-child td{border-bottom:none}
.table tbody tr:hover td{background:#f7fafc}
.table .mono{font-family:Consolas,monospace;font-size:var(--fs-meta);color:#33383d}
.table .num{text-align:right;font-variant-numeric:tabular-nums;font-family:Consolas,monospace}
.table .right{text-align:right}
.table-wrap{overflow-x:auto}
.plan-table{table-layout:fixed}
.plan-table .path-cell{white-space:normal;overflow-wrap:anywhere;word-break:break-word}
.cell-val{display:flex;align-items:flex-start;gap:6px;min-width:0}
.cell-val .mono{flex:1;min-width:0;white-space:normal;overflow-wrap:anywhere;word-break:break-word;line-height:1.5}
.yellow-path{min-width:0;overflow-wrap:anywhere;word-break:break-word}

.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:var(--fs-meta);color:var(--muted);font-weight:600}
.field input,.field select{background:#fff;border:1px solid #d7dee4;border-radius:3px;padding:7px 9px;font-size:var(--fs-strong);color:var(--text);width:100%}
.field input:focus,.field select:focus{outline:none;border-color:#7fd383}
.field .hint{font-size:var(--fs-micro);color:var(--dim)}
.field.full{grid-column:1/-1}

.diskbar{display:flex;height:12px;border-radius:3px;overflow:hidden;background:#e9eef0;border:1px solid #e1e7ec}
.diskbar span{height:100%}
.disk-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:var(--fs-meta);color:var(--muted)}
.disk-legend i{width:7px;height:7px;border-radius:2px;display:inline-block;margin-right:4px}

.timeline{display:flex;flex-direction:column;gap:0;padding-left:3px}
.tl-item{display:flex;gap:10px;position:relative;padding-bottom:15px}
.tl-item:not(:last-child)::before{content:"";position:absolute;left:7.5px;top:17px;bottom:0;width:1px;background:#e1e7ec}
.tl-dot{width:16px;height:16px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:var(--fs-micro);border:1.5px solid #cfd7de;background:#fff;color:#98a2ac;z-index:1}
.tl-dot.ok{border-color:#8fd68b;background:#eaf7e8;color:#2f8e35}
.tl-dot.err{border-color:#f0b6b3;background:#fff0ef;color:#d9363e}
.tl-dot.now{border-color:#8fd68b;background:#eaf7e8;color:#2f8e35}
.tl-body{flex:1;min-width:0}
.tl-title{font-size:var(--fs-strong);color:#33383d;font-weight:550;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.tl-meta{font-size:var(--fs-meta);color:var(--dim);margin-top:3px;line-height:1.45;word-break:break-all}
.tl-code{font-family:Consolas,monospace;font-size:var(--fs-micro);color:#d9363e;background:#fff0ef;border:1px solid #f2c9c6;padding:1px 4px;border-radius:2px;display:inline-block;margin-top:3px}

.modal-mask{position:fixed;inset:0;background:rgba(32,42,51,.42);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:#fff;border:1px solid #dfe6eb;border-radius:6px;box-shadow:var(--shadow);width:580px;max-width:100%;max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.modal.wide{width:740px}
.modal-head{padding:13px 18px 11px;border-bottom:1px solid var(--line-soft);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;background:#fafcfb}
.modal-head h3{font-size:var(--fs-sub);font-weight:700;color:#2f3439;display:flex;align-items:center;gap:7px}
.modal-head h3::before{content:"";width:3px;height:15px;border-radius:1px;background:var(--green);flex-shrink:0}
.modal-head .sub{font-size:var(--fs-meta);color:var(--dim);margin-top:3px;line-height:1.45}
.modal-x{background:none;border:none;color:#a2abb4;font-size:var(--fs-page);line-height:1;padding:4px 6px;border-radius:3px}
.modal-x:hover{color:#2f3439;background:#eef2f5}
.modal-body{padding:14px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.modal-body > *{flex-shrink:0}
.modal-foot{padding:10px 18px;border-top:1px solid var(--line-soft);display:flex;gap:7px;justify-content:flex-end;align-items:center;flex-wrap:wrap;background:#fbfcfd}
.modal-foot .left{margin-right:auto;font-size:var(--fs-meta);color:var(--dim)}

.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.sum-box{background:#f7f9fa;border:1px solid #edf0f3;border-radius:4px;padding:10px 12px}
.sum-box .k{font-size:var(--fs-micro);color:var(--dim)}
.sum-box .v{font-size:var(--fs-sub);font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums;color:#2f3439}

.settings-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.settings-row:last-child{border-bottom:none}
.settings-row .k{font-size:var(--fs-strong);color:#33383d}
.settings-row .d{font-size:var(--fs-meta);color:var(--dim);margin-top:2px}
.settings-row .ctrl{flex-shrink:0}
.settings-row select,.settings-row input[type=text]{background:#fff;border:1px solid #d7dee4;border-radius:3px;padding:7px 9px;font-size:var(--fs-body);color:var(--text)}
.settings-row select:focus,.settings-row input[type=text]:focus{outline:none;border-color:#7fd383}
.settings-row input[type=text]{width:280px;font-family:Consolas,monospace}

.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,8px);background:#333b43;border:1px solid #454e57;color:#fff;padding:8px 14px;border-radius:3px;font-size:var(--fs-body);box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:300;max-width:70vw;overflow-wrap:anywhere}
.toast.show{opacity:1;transform:translate(-50%,0)}

.nav-label{font-size:var(--fs-micro);font-weight:700;color:#a0a9b2;letter-spacing:.6px;padding:4px 6px 3px}

/* ---------- 规则：按软件列表（扁平行，点击开弹窗） ---------- */
.appgrp{background:transparent;border-bottom:1px solid var(--line-soft)}
.appgrp:last-child{border-bottom:none}
.ag-head{display:flex;align-items:center;gap:10px;width:100%;padding:10px 8px;background:transparent;border:none;text-align:left;border-radius:4px;transition:background .12s}
.ag-head:hover{background:#f4f8f6}
.ag-mark{width:26px;height:26px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:var(--fs-micro);font-weight:700;letter-spacing:.3px;opacity:.9}
.ag-main{flex:1;min-width:0}
.ag-name{display:block;font-size:var(--fs-strong);font-weight:600;color:#33383d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-sub{display:block;font-size:var(--fs-meta);color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-stats{display:flex;align-items:center;gap:9px;flex-shrink:0;font-size:var(--fs-meta);color:var(--muted)}
.ag-dot{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.ag-hits{font-family:Consolas,monospace;font-variant-numeric:tabular-nums;color:#4a545e;white-space:nowrap}
.ag-go{font-size:var(--fs-meta);color:#2f8e35;flex-shrink:0;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.ag-caret{font-style:normal;display:inline-block;font-weight:700;transition:transform .12s}
.ag-head:hover .ag-caret{transform:translateX(2px)}
.rule-form.mform{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);row-gap:8px;align-items:end}
.mform > .mwide{grid-column:span 2}
.mform > button{justify-self:end;white-space:nowrap}

/* ---------- AI 识别 ---------- */
.btn-ai{background:#f5f1ff;color:#6f4bd8;border-color:#ddd0fb}
.btn-ai:hover{background:#eae3ff;border-color:#c8b6fb;color:#5b35c8}
.ai-key{display:inline-flex;align-items:center;gap:5px;font-family:Consolas,monospace;font-size:var(--fs-micro);color:#6f4bd8;background:#f6f2ff;border:1px solid #e2d8fb;border-radius:10px;padding:2px 8px;white-space:nowrap}
.suggest{display:flex;flex-direction:column;gap:4px}
.sug-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sug-reason{font-size:var(--fs-body);color:#4a545e}
.conf{font-family:Consolas,monospace;font-weight:700;color:#6f4bd8}

.muted{color:var(--muted)} .dim{color:var(--dim)} .ok{color:#2f8e35} .warn{color:var(--amber)} .bad{color:var(--red)}
.mono{font-family:Consolas,"SFMono-Regular",monospace;font-variant-numeric:tabular-nums}
.nowrap{white-space:nowrap} .truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-flex{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mt-2{margin-top:8px} .mt-3{margin-top:12px} .mt-4{margin-top:16px}
.center{text-align:center}
.divider{height:1px;background:var(--line-soft);margin:2px 0}

@media (max-width:1280px){
  .topnav{height:88px;padding:0 12px}
  .brand{width:166px}
  .brand-name{font-size:var(--fs-title)}
  .nav-item{width:86px;height:78px}
  .system-ver{display:none}
  .main-scroll{padding:10px 12px 18px}
  .topbar{padding:9px 12px}
  .trow.dir{grid-template-columns:17px minmax(0,1.55fr) minmax(0,1.05fr) 80px 98px;gap:11px}
  .trow.proj,.trow.pend,.trow.cap{gap:11px}
  .detail-path{max-width:min(520px,52vw)}
}
@media (max-width:1180px){
  .split-layout{grid-template-columns:220px minmax(0,1fr)}
  .split-layout .bar{padding:7px}
  .split-layout .ide-item{grid-template-columns:26px minmax(0,1fr) auto;gap:6px}
  .split-layout .ide-mark{width:26px;height:26px;font-size:var(--fs-meta)}
  .split-layout .ide-name{font-size:var(--fs-strong)}
  .split-layout .ide-item .badge{font-size:var(--fs-meta)}
  .split-layout .bar-top .legend{font-size:var(--fs-meta)}
  .kvbar .kv-item{padding:9px 10px}
  .kvbar .v{font-size:var(--fs-strong)}
}
@media (max-width:1239px){
  .content > .cols{display:flex;flex-direction:column;flex:none;min-height:0}
  .content > .cols > .panel.panel-scroll{flex:none}
  .content > .cols > .panel.panel-scroll > .panel-body{overflow:visible;flex:none}
  .content > .cols .scroll-y{overflow:visible;flex:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>
<div class="app">
  <header class="topnav" id="topnav"></header>
  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="page-title">Disk Warden</h1>
        <div class="scan-meta" id="scan-meta"></div>
      </div>
      <div class="top-actions" id="top-actions"></div>
    </header>
    <div class="main-scroll">
      <div id="view"></div>
    </div>
  </main>
</div>
<div id="modal-root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* ============================================================
   Disk Warden — 主机端界面（静态资源，无构建依赖）
   所有界面文案集中在 I18N 对象中，键名见 docs/specs/界面交互说明-v1.0.md
   ============================================================ */
const I18N = {};
I18N['zh-CN'] = {
  'app.tagline': 'AI IDE 磁盘管家',
  'nav.group.work': '工作台',
  'nav.group.system': '系统',
  'nav.ide': 'IDE 数据',
  'nav.projects': '项目目录',

function ideSize(ide) { return sum(ide.directories, 'size_bytes'); }

function yellowKey(ideId, idx) { return ideId + '|' + idx; }

/* ---------- RPC 传输层 ----------
   请求：{v:1,id,method,params}；成功：{ok:true,result}；失败：{ok:false,error}。
   bridge.rpc 接收并返回 JSON 字符串，这里统一解析并按 error 结构抛出。 */
class RpcError extends Error {
  constructor(err) {
    const e = err || {};
    super(e.message_key || e.code || 'error.INTERNAL');
    this.code = e.code || 'INTERNAL';
    this.message_key = e.message_key || ('error.' + this.code);
    this.detail = e.detail || {};
    this.retryable = !!e.retryable;
  }
}

let rpcSeq = 0;
function rpc(method, params) {
  const api = window.pywebview && window.pywebview.api;
  if (!api || typeof api.rpc !== 'function') {
    return Promise.reject(new RpcError({ code: 'INTERNAL', detail: { reason: 'host unavailable' } }));
  }
  const req = { v: 1, id: 'ui-' + (++rpcSeq), method: method, params: params || {} };
  return api.rpc(JSON.stringify(req)).then(raw => {
    let res;
    try { res = typeof raw === 'string' ? JSON.parse(raw) : raw; }
    catch (e) { throw new RpcError({ code: 'INTERNAL', detail: { reason: 'invalid response' } }); }
    if (!res || res.ok !== true) throw new RpcError(res && res.error);
    return res.result;
  });
}

function errText(err) {
  if (!err) return '';
  const key = err.message_key || ('error.' + (err.code || 'INTERNAL'));
  const label = t(key);
  /* 主机端可能返回界面没有收录的错误码，兜底成通用文案，不把 key 漏给用户 */
  return label === key ? t('error.INTERNAL') : label;
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) {
    return String(iso).replace('T', ' ').replace(/\.\d+/, '').replace(/Z$/, '');
  }
  const p = n => (n < 10 ? '0' : '') + n;
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

function normPath(p) {
  return String(p == null ? '' : p).replace(/\//g, '\\').replace(/\\+$/, '').toLowerCase();
}

function driveOf(p) {
  const m = String(p || '').match(/^([A-Za-z]:)/);
  return m ? m[1].toUpperCase() : '';
}

function snapshot() { return state.data.snapshot; }
function allTools() { const s = snapshot(); return (s && s.tools) || []; }
function allItems() { const s = snapshot(); return (s && s.items) || []; }
function toolList() { return allTools().filter(x => x.counts && x.counts.present > 0); }
function toolById(id) { return allTools().find(x => x.id === id) || null; }
function itemsFor(tool) { return allItems().filter(x => x.tool_id === tool.id); }
function runningProcs(tool) { const rt = tool && tool.runtime; return (rt && rt.processes) || []; }
function migratedItems(tool) { return itemsFor(tool).filter(x => !!x.migrated_job_id); }
function isToolMigrated(tool) { return migratedItems(tool).length > 0; }
function migratedTarget(tool) {
  const it = migratedItems(tool)[0];
  return it ? (it.target_path || '') : '';
}
function itemCounts(tool) {
  const items = itemsFor(tool);
  return {
    green: items.filter(x => x.safety === 'green').length,
    red: items.filter(x => x.safety === 'red').length,

  };
}
function toolRoot(tool) {
  const items = itemsFor(tool);
  if (!items.length) {
    const dirs = ((tool && tool.directories) || []).filter(d => d.resolved && d.resolved.length);
    return dirs.length ? String(dirs[0].resolved[0]).replace(/[\\/][^\\/]*$/, '') : '';
  }
  let parts = String(items[0].source_path).replace(/\//g, '\\').split('\\');
  parts.pop();
  items.slice(1).forEach(it => {
    const seg = String(it.source_path).replace(/\//g, '\\').split('\\');
    const max = Math.min(parts.length, seg.length);
    let i = 0;
    while (i < max && parts[i].toLowerCase() === seg[i].toLowerCase()) i++;
    parts = parts.slice(0, i);
  });
  return parts.join('\\');
}
function targetFreeBytes() {
  const d = state.data.disk && state.data.disk.target;
  return d && d.available ? (d.free || 0) : 0;
}

/* ---------- 扫描快照 → 已验收 CATALOG 形状（数组） ---------- */
function adapterDir(item) {
  return {
    path: item.source_path || '',
    target_path: item.target_path || '',
    type: item.kind || 'dir',
    safety: item.safety || 'yellow',
    reason: item.reason || item.blocked_reason || item.reason_key || '',
    handling: item.rule_id || item.blocked_code || '',
    size_bytes: item.bytes || 0,
    item_id: item.item_id,
    can_migrate: item.can_migrate !== false && !item.migrated_job_id,

    blocked_reason: item.blocked_reason || '',
    migrated: !!item.migrated_job_id,

    source: item.source || '',

    file_count: item.file_count || 0,

}

function synthDirectories(tool) {
  const out = [];
  ((tool && tool.directories) || []).forEach(d => {
    const paths = (d.resolved && d.resolved.length) ? d.resolved : [];
    paths.forEach(p => {
      out.push({
        path: String(p), target_path: '', type: d.type || 'dir',
        safety: d.safety || 'yellow', reason: d.reason || d.reason_key || '',
        handling: d.handling || d.status_label || '', size_bytes: 0,
        item_id: '', can_migrate: d.safety !== 'red', requires_confirm: d.safety === 'yellow',
        blocked_code: '', blocked_reason: '', migrated: false, source: '', rule_id: '',
        file_count: 0, access_errors: 0, is_reparse: false, target_exists: false
      });
    });
  });
  return out;
}

function adapterIde(tool) {
  const items = itemsFor(tool);
  const root = toolRoot(tool);
  const target = String(migratedTarget(tool) || '').replace(/[\\/][^\\/]*$/, '');

function setSeg(key, gb) {
  const s = DISK_SEGMENTS.find(x => x.key === key);
  if (s) s.gb = Math.max(0, gb || 0);
}

function syncDiskView() {
  const tools = {};
  allTools().forEach(t => { tools[t.id] = t; });
  const bucket = { 'ai-ide': 0, 'ai-cli': 0, 'pkg': 0, 'jetbrains': 0, 'models': 0 };
  allItems().forEach(it => {
    const tool = tools[it.tool_id];
    const kind = (tool && tool.kind) || 'ide';
    const rel = String(it.rel_path || '').toLowerCase();
    let cat = kind === 'ide' ? 'ai-ide' : 'ai-cli';
    if (/(^|[\\/])(npm|npm-cache|pnpm|yarn|pip|cargo|m2|gradle)([\\/]|$)/.test(rel)) cat = 'pkg';
    else if (/jetbrains|\.idea/.test(rel)) cat = 'jetbrains';
    else if (/ollama|huggingface/.test(rel)) cat = 'models';
    bucket[cat] += it.bytes || 0;
  });
  DISK_CATEGORIES.forEach(c => { c.gb = (bucket[c.id] || 0) / GIB; });
  const ideGB = (bucket['ai-ide'] + bucket['ai-cli']) / GIB;
  const devGB = (bucket.pkg + bucket.jetbrains) / GIB;
  const modelsGB = bucket.models / GIB;
  setSeg('disk.ide', ideGB);
  setSeg('disk.dev', devGB);
  setSeg('disk.sys', 0);
  setSeg('disk.models', modelsGB);
  setSeg('disk.other', Math.max(0, DRIVE.usedGB - ideGB - devGB - modelsGB));
  setSeg('disk.free', DRIVE.freeGB);
}

function syncKpi() {
  const snap = snapshot();
  const st = (snap && snap.stats) || {};
  KPI.reclaimableGB = (st.migratable_bytes || 0) / GIB;
  KPI.lastScan = snap && snap.scanned_at ? fmtDate(snap.scanned_at) : '';
  const migrates = historyItems().filter(x => x.type === 'migrate' && x.result === 'success');
  KPI.freedGB = migrates.reduce((a, x) => a + (x.freed || 0), 0) / GIB;
  KPI.freedOps = migrates.length;
}

/* ---------- 启动握手 ---------- */
function hostReady() {
  const has = () => !!(window.pywebview && window.pywebview.api && typeof window.pywebview.api.rpc === 'function');
  if (has()) return Promise.resolve(true);
  return new Promise(resolve => {
    let settled = false;
    let tries = 0;
    const finish = ok => {
      if (settled) return;
      settled = true;
      clearInterval(timer);
      window.removeEventListener('pywebviewready', onReady);
      resolve(ok);
    };
    const onReady = () => finish(has());
    window.addEventListener('pywebviewready', onReady);
    const timer = setInterval(() => {
      tries++;
      if (has()) finish(true);
      else if (tries >= 120) finish(false);
    }, 100);
  });
}

function bootstrap() {
  state.booting = true;
  state.bootError = '';
  return hostReady().then(ok => {
    if (!ok) {
      state.booting = false;
      state.connected = false;
      state.bootError = t('conn.hostBody');
      return null;
    }
    return rpc('app.hello').then(hello => {
      applySettings(hello.settings);
      applyDisk(hello.disk || null);
      state.data.recovery = hello.recovery || null;
      state.connected = true;
      const scan = hello.scan || {};
      const ready = scan.available
        ? rpc('scan.result').then(snap => setSnapshot(snap)).catch(() => {})
        : Promise.resolve();
      return ready
        .then(() => rpc('rules.learned.list')).then(l => { state.data.learned = l; }).catch(() => {})
        .then(() => rpc('job.list', { active_only: true })).catch(() => ({ jobs: [] }))
        .then(list => {
          const active = (list && list.jobs && list.jobs[0]) || null;
          if (active && active.kind === 'scan' && ['queued', 'running', 'cancelling'].indexOf(active.state) >= 0) {
            state.data.scanJob = active;
            state.scanning = true;
            state.scanPct = scanPercent(active);
            startScanPolling(active.job_id);
          }
        })
        .then(() => refreshRecovery())
        .then(() => loadHistory());
    }).catch(err => {
      state.connected = false;
      state.bootError = errText(err);
    }).then(() => { state.booting = false; });
  }).then(() => { render(); });
}

/* ---------- 扫描任务 ---------- */
const SCAN_STAGES = ['discover', 'measure', 'classify', 'done'];

function scanStage(job) {
  const p = (job && job.progress) || {};
  const s = p.stage || p.step || 'discover';
  return SCAN_STAGES.indexOf(s) >= 0 ? s : 'discover';
}

function scanPercent(job) {
  if (!job) return 0;
  if (job.state === 'done') return 100;
  const p = job.progress || {};
  const stage = p.stage || p.step || '';
  if (stage === 'measure') {
    const total = p.targets_total || 0, done = p.targets_done || 0;
    if (total > 0) return Math.min(88, 10 + Math.round(done / total * 78));
    return 15;
  }
  if (stage === 'classify') return 92;
  if (stage === 'discover') return 6;
  return job.state === 'running' ? 10 : 3;
}

function stopScanPolling() {
  if (state.data.scanTimer) {
    clearInterval(state.data.scanTimer);
    state.data.scanTimer = null;
  }
}

function startScanPolling(jobId) {
  stopScanPolling();
  state.data.scanTimer = setInterval(() => pollScan(jobId), 350);
  pollScan(jobId);
}

function scanFailed(err) {
  state.data.scanError = errText(err) || t('scan.failed');
  state.scanning = false;
  App.toast(t('scan.failed') + ': ' + state.data.scanError);
  if (state.tab !== 'ide' || state.sub !== 'scanning') App.go('#ide/scanning');
  else render();
}

function pollScan(jobId) {
  if (!jobId) return Promise.resolve();
  return rpc('scan.status', { job_id: jobId }).then(res => {
    const job = res && res.job ? res.job : null;
    if (!job) { stopScanPolling(); return; }
    state.data.scanJob = job;
    state.scanPct = scanPercent(job);
    if (job.state === 'done') {
      stopScanPolling();
      KPI.scanDuration = fmtDuration(jobDuration(job));
      return rpc('scan.result').then(snap => {
        setSnapshot(snap);
        state.scanning = false;
        state.data.scanJob = null;
        state.scanPct = 100;
        const n = (snap && snap.stats && snap.stats.tools_present) || 0;
        App.toast(t('scan.done', { n: n }));
        return rpc('disk.info').then(applyDisk).catch(() => {});
      }).then(() => {
        App.go('#ide' + (CATALOG.ides.length ? '' : '/empty'));
      }).catch(scanFailed);
    }
    if (job.state === 'cancelled') {
      stopScanPolling();
      state.scanning = false;
      state.data.scanJob = null;
      App.toast(t('scan.cancelled'));
      App.go('#ide' + (snapshot() ? '' : '/empty'));
      return;
    }
    if (job.state === 'failed') {
      stopScanPolling();
      freshRenderIfScanning();
      scanFailed(job.error);
      return;
    }
    freshRenderIfScanning();
  }).catch(err => {
    stopScanPolling();
    scanFailed(err);
  });
}

function freshRenderIfScanning() {
  if (state.tab === 'ide' && state.sub === 'scanning') render();
}

/* ---------- 操作历史（src/core/store/history） ---------- */
function historyItems() {
  const h = state.data.history;
  return (h && h.items) || [];
}
function historyStats() {
  const h = state.data.history;
  return (h && h.stats) || {};
}
function fmtDuration(sec) {
  if (sec === null || sec === undefined || isNaN(sec)) return '—';
  const s = Math.max(0, Math.round(Number(sec)));
  const m = Math.floor(s / 60);
  return m ? m + 'm ' + (s % 60) + 's' : s + 's';
}
function jobDuration(job) {
  if (!job || !job.started_at) return null;
  const end = job.finished_at || job.updated_at;
  const a = Date.parse(job.started_at), b = Date.parse(end);
  if (isNaN(a) || isNaN(b)) return null;
  return Math.max(0, Math.round((b - a) / 1000));
}

function applyHistory(res) {
  const items = (res && res.items) || [];
  HISTORY.length = 0;
  items.forEach(h => {
    const type = h.type === 'rollback' ? 'rollback' : (h.type === 'clean' ? 'clean' : 'migrate');
    const failed = h.result === 'failed';
    const steps = type === 'rollback'
      ? ['rollbackStep1', 'rollbackStep2', failed ? 'failedStep' : 'rollbackStep3']
      : type === 'clean'
        ? ['cleanStep1']
        : ['migrateStep1', 'migrateStep2', 'migrateStep3', failed ? 'failedStep' : 'migrateStep4'];
    let note;
    if (failed) note = 'failed.sourceSafe';
    else if (type === 'rollback') note = 'history.rollbackDone';
    else if (h.can_rollback) note = 'history.canRollback';
    else note = 'history.noRollback';
    HISTORY.push({
      id: h.id,
      at: fmtDate(h.at),
      type: type,
      app: h.app || h.tool_id || '',
      from: h.from || '',
      to: h.to || '',
      freed: (h.freed || 0) / GIB,
      duration: fmtDuration(h.duration_seconds),
      result: h.result === 'rolledback' ? 'rolledback' : (failed ? 'failed' : 'success'),
      canRollback: !!h.can_rollback,
      code: h.code || '',
      note: note,
      steps: steps,
      job_id: h.job_id || '',
      tool_id: h.tool_id || ''
    });
  });
  if (!HISTORY.some(x => x.id === state.selectedHistory)) {
    state.selectedHistory = HISTORY.length ? HISTORY[0].id : '';
  }
  syncKpi();
}

function loadHistory() {
  if (state.data.historyLoading) return Promise.resolve();
  state.data.historyLoading = true;
  return rpc('history.list', { filter: 'all', limit: 500 }).then(res => {
    state.data.history = res || { items: [], count: 0, stats: {} };
    state.data.historyError = '';
    applyHistory(state.data.history);
  }).catch(err => {
    state.data.historyError = errText(err);
    applyHistory({ items: [] });
  }).then(res => {
    state.data.historyLoading = false;
    return res;
  });
}

/* ---------- 迁移 / 回滚任务流 ---------- */
const MIGRATE_STAGES = ['prepare', 'backup', 'copy', 'verify', 'swap', 'link', 'link_verify', 'cleanup', 'done'];
const ROLLBACK_STAGES = ['precheck', 'link_remove', 'copy', 'verify', 'restore', 'config', 'cleanup', 'record', 'done'];

function flowOpen(kind) { return !!(state.data.flow && state.data.flow.kind === kind); }
function flowBusy() {
  const f = state.data.flow;

}
function stopFlowPolling() {

    state.data.jobTimer = null;
  }
}
function closeFlow() {
  stopFlowPolling();
  state.data.flow = null;
}
function refreshAfterJob() {
  return Promise.all([
    rpc('scan.result').then(snap => setSnapshot(snap)).catch(() => {}),
    rpc('disk.info').then(applyDisk).catch(() => {}),
    loadHistory()

}

/* ---------- 启动恢复（journal 状态由 src/app 判定，UI 只负责展示与发起） ---------- */
function recoveryItems() {
  const r = state.data.recovery;
  return (r && r.items) || [];
}
function refreshRecovery() {
  return rpc('recovery.list').then(r => {
    state.data.recovery = r || { items: [], count: 0, warnings: [] };
    return state.data.recovery;
  }).catch(() => state.data.recovery);
}
function stopRecoveryPolling() {
  if (state.data.recoveryTimer) {
    clearInterval(state.data.recoveryTimer);
    state.data.recoveryTimer = null;
  }
}
function recoveryPct(job) {
  if (!job) return 4;
  if (job.state === 'done') return 100;
  const p = job.progress || {};
  if (p.done) return 100;
  const stages = ['precheck', 'copy', 'verify', 'swap', 'link', 'link_verify', 'restore', 'config', 'cleanup', 'record', 'recover'];
  const idx = stages.indexOf(p.stage || '');
  if (idx < 0) return 35;
  return Math.max(5, Math.min(96, Math.round((idx + 1) / (stages.length + 1) * 100)));
}
function recoveryStageText(job) {
  const p = (job && job.progress) || {};
  const stage = p.stage || p.step;
  if (!stage || stage === 'done') return t('recovery.running');
  const key = 'progress.stage.' + stage;
  const label = t(key);
  return label === key ? String(stage) : label;
}
function startRecoveryPolling(runnerJobId) {
  stopRecoveryPolling();
  state.data.recoveryTimer = setInterval(() => pollRecovery(runnerJobId), 400);
  pollRecovery(runnerJobId);
}
function pollRecovery(runnerJobId) {
  return rpc('job.status', { job_id: runnerJobId }).then(res => {
    const run = state.data.recoveryRun;
    if (!run || run.runnerJobId !== runnerJobId) return;
    const job = res && res.job;
    if (!job) { render(); return; }
    run.job = job;
    if (job.state === 'done') {
      stopRecoveryPolling();
      run.summary = job.summary || {};
      run.phase = run.summary.ok === false ? 'failed' : 'success';
      if (run.phase === 'failed') {
        run.error = {
          code: run.summary.error_code || 'RECOVERY_REQUIRED',
          detail: { message: run.summary.error_message || '' }
        };
      }
      refreshAfterJob().then(() => refreshRecovery()).then(() => render());
      return;
    }
    if (job.state === 'failed' || job.state === 'cancelled') {
      stopRecoveryPolling();
      run.phase = 'failed';
      run.error = job.error || { code: 'INTERNAL', detail: {} };
      refreshAfterJob().then(() => refreshRecovery()).then(() => render());
      return;
    }
    render();
  }).catch(err => {
    stopRecoveryPolling();
    const run = state.data.recoveryRun;
    if (run && run.runnerJobId === runnerJobId) {
      run.phase = 'failed';
      run.error = err;
      render();
    }
  });
}
function recoveryBanner() {
  const items = recoveryItems();
  const run = state.data.recoveryRun;
  if (!items.length && !run) return '';
  let html = '';
  if (items.length) {
    const busy = !!(run && (run.phase === 'starting' || run.phase === 'progress'));
    const rows = items.map(it => {
      const actions = (it.actions && it.actions.length ? it.actions : ['recover']);
      const buttons = actions.map(a => `<button type="button" class="btn btn-xs ${a === 'rollback' ? 'btn-ghost' : 'btn-soft'}" ${busy ? 'disabled' : ''} onclick="App.recoveryStart('${esc(it.job_id)}','${esc(a)}')">${esc(t(a === 'rollback' ? 'recovery.rollback' : 'recovery.recover'))}</button>`).join('');
      const human = it.needs_human ? ` · <b>${esc(t('recovery.needsHuman'))}</b>` : '';
      return `<div class="kv-item wide">
        <span class="k">${esc(it.tool_name || it.tool_id || '')} · ${esc(it.label || it.state_label || it.state || '')}${human}${it.type === 'rollback' ? ' · ' + esc(t('history.type.rollback')) : ''}</span>
        <span class="v" style="font-weight:500;white-space:normal;font-size:var(--fs-meta)">${esc(it.source_path || '')}</span>
        <span class="dim" style="font-size:var(--fs-meta)">${esc(fmtBytes(it.bytes || 0))} · ${esc(fmtDate(it.updated_at))}</span>

    html += `<div class="banner danger" style="margin-bottom:10px;align-items:flex-start">

        <div style="margin-top:2px">${esc(t('recovery.desc'))}</div>
        <div class="kvbar mt-3" style="flex-direction:column;background:#fff8f7;border-color:#f2c9c6">${rows}</div>
      </div>
    </div>`;
  }
  if (run) {
    const phase = run.phase;
    if (phase === 'starting' || phase === 'progress') {
      const pct = recoveryPct(run.job);
      html += `<div class="banner info" style="margin-bottom:10px;align-items:flex-start">
        <span class="b-ico">i</span>
        <div style="flex:1;min-width:0">
          <b>${esc(t('recovery.running'))}</b>
          <div class="progress mt-3"><i style="width:${pct}%"></i></div>
          <div class="progress-meta"><span>${esc(t('progress.percent', { pct: pct }))}</span><span>${esc(recoveryStageText(run.job))}</span></div>
        </div>
      </div>`;
    } else if (phase === 'success') {
      const s = run.summary || {};
      html += `<div class="banner ok" style="margin-bottom:10px;align-items:flex-start">
        <span class="b-ico">✓</span>
        <div style="flex:1;min-width:0">
          <b>${esc(t('recovery.done'))}</b><br>${esc(t('recovery.successHint'))}
          <div class="mono" style="font-size:var(--fs-meta);margin-top:2px">${esc(s.source_path || run.sourcePath || '')}</div>
          <div class="banner-actions"><button type="button" class="btn btn-ghost btn-xs" onclick="App.dismissRecovery()">${esc(t('action.close'))}</button></div>
        </div>

    } else {
      const err = run.error || {};
      const msg = (err.detail && err.detail.message) || (run.summary && run.summary.error_message) || '';
      html += `<div class="banner danger" style="margin-bottom:10px;align-items:flex-start">
        <span class="b-ico">✕</span>
        <div style="flex:1;min-width:0">
          <b>${esc(t('recovery.failed'))}</b>${err.code ? ` · <span class="mono">${esc(err.code)}</span>` : ''}<br>${esc(msg || t('recovery.failedHint'))}

            <button type="button" class="btn btn-ghost btn-xs" onclick="App.retryRecovery()">${esc(run.action === 'rollback' ? t('recovery.rollback') : t('recovery.recover'))}</button>
            <button type="button" class="btn btn-ghost btn-xs" onclick="App.dismissRecovery()">${esc(t('action.close'))}</button>
          </div>
        </div>
      </div>`;
    }
  }
  return html;
}

/* ---------- 迁移 / 回滚轮询 ---------- */
function startFlowPolling(kind, jobId) {
  stopFlowPolling();
  state.data.jobTimer = setInterval(() => pollFlow(kind, jobId), 350);
  pollFlow(kind, jobId);
}
function pollFlow(kind, jobId) {
  return rpc('job.status', { job_id: jobId }).then(res => {
    const job = res && res.job;
    const flow = state.data.flow;
    if (!flow || flow.kind !== kind || (flow.runnerJobId || flow.jobId) !== jobId) return;
    if (!job) { render(); return; }
    flow.job = job;
    if (job.state === 'done') {
      stopFlowPolling();
      flow.summary = job.summary || {};
      const ok = kind === 'rollback'
        ? flow.summary.ok !== false
        : !flow.summary.failed && !flow.summary.cancelled;
      flow.phase = ok ? 'success' : 'failed';
      if (!ok) {
        flow.errorScope = 'job';
        if (kind === 'rollback') {
          flow.error = {
            code: flow.summary.error_code || 'ROLLBACK_FAILED',
            detail: { message: flow.summary.error_message || '' }
          };
        } else {
          const first = (flow.summary.items || []).find(x => !x.ok) || {};
          flow.error = {
            code: first.state || 'MIGRATION_FAILED',
            detail: { message: first.error_message || '' }
          };
        }
      }
      refreshAfterJob().then(() => render());
      return;
    }
    if (job.state === 'failed' || job.state === 'cancelled') {
      stopFlowPolling();
      flow.phase = 'failed';
      flow.errorScope = 'job';
      flow.error = job.error || { code: 'INTERNAL', detail: {} };
      refreshAfterJob().then(() => render());
      return;
    }
    render();
  }).catch(err => {
    stopFlowPolling();
    const flow = state.data.flow;
    if (flow && flow.kind === kind && (flow.runnerJobId || flow.jobId) === jobId) {
      flow.phase = 'failed';
      flow.error = err;
      render();
    }
  });
}
function migratePct(flow) {
  const job = flow.job || {};
  const p = job.progress || {};
  if (job.state === 'done' || p.done) return 100;
  const total = Math.max(1, p.items_total || ((flow.plan && flow.plan.items && flow.plan.items.length) || 1));
  const done = Math.max(p.items_done || 0, p.index || 0);
  const idx = Math.max(0, MIGRATE_STAGES.indexOf(p.stage || 'prepare'));
  const span = MIGRATE_STAGES.length - 1;
  const partial = Math.min(1, (idx + (p.status === 'done' ? 1 : 0.4)) / span);
  return Math.min(99, Math.max(2, Math.round((done + partial) / total * 100)));
}
function rollbackPct(flow) {
  const job = flow.job || {};
  const p = job.progress || {};
  if (job.state === 'done' || p.stage === 'done') return 100;
  const idx = Math.max(0, ROLLBACK_STAGES.indexOf(p.stage || 'precheck'));
  return Math.min(99, Math.max(3, Math.round(idx / (ROLLBACK_STAGES.length - 1) * 100)));
}
function stageRows(stages, current, doneFlag, prefix) {
  const active = Math.max(0, stages.indexOf(current || stages[0]));
  return stages.map((s, i) => {
    const done = doneFlag || i < active;
    const act = !done && i === active;
    return `<div class="stage ${done ? 'done' : act ? 'active' : ''}">
      <span class="s-ico">${done ? '✓' : ''}</span><span>${esc(t(prefix + s))}</span>
      <span class="s-meta">${done ? esc(t('progress.done')) : act ? esc(t('progress.running')) : esc(t('progress.waiting'))}</span>
    </div>`;
  }).join('');
}
function errDetailList(lines, cls) {
  if (!lines.length) return '';
  return `<div class="err-list${cls ? ' ' + cls : ''}">${lines.map(line => `<div class="err-item plain"><span class="e-msg">${esc(line)}</span></div>`).join('')}</div>`;
}
/* 长路径/任务号：沿用失败明细的纵向条目，值完整换行并逐项提供复制 */
function valueList(entries, cls) {
  const rows = entries.filter(e => e && e.value !== undefined && e.value !== null && String(e.value) !== '');
  if (!rows.length) return '';
  return `<div class="err-list${cls ? ' ' + cls : ''}">${rows.map(e => `<div class="err-item plain val-item">
      <div class="val-head"><span class="e-k">${esc(e.label)}</span><button type="button" class="copy-btn" onclick="App.copyValue(this)">${esc(t('common.copy'))}</button></div>
      <span class="e-path">${esc(e.value)}</span>
    </div>`).join('')}</div>`;
}
function pathCell(value) {

}

function errorDetailLines(err) {
  if (!err) return [];
  const d = err.detail || {};
  const code = err.code || '';
  const lines = [];
  if (code === 'BLOCKED_PROCESS') {
    (d.items || []).forEach(it => {
      const proc = it.process || {};
      const names = (proc.processes || []).map(p => (p.name || '') + ' · PID ' + (p.pid || '')).join(' | ');
      lines.push([it.tool_name || it.tool_id || '', it.source_path || '', names].filter(Boolean).join(' · '));
    });
  } else if (code === 'BLOCKED_RED_PATH') {
    (d.items || []).forEach(it => lines.push([it.tool_id || '', it.source_path || '', it.reason || ''].filter(Boolean).join(' · ')));
  } else if (code === 'PERMISSION_DENIED') {
    (d.items || []).forEach(it => {
      const errs = it.access_errors;
      const count = Array.isArray(errs) ? errs.length : (typeof errs === 'number' ? errs : 0);
      lines.push([
        it.source_path || '',
        count ? t('blocked.accessErrors', { n: count }) : '',
        it.is_reparse ? t('blocked.reparse') : ''
      ].filter(Boolean).join(' · '));
    });
  } else if (code === 'INSUFFICIENT_SPACE') {
    lines.push(t('blocked.space', { free: fmtBytes(d.free_bytes || 0), need: fmtBytes(d.required_bytes || 0) }));
  } else if (code === 'DUPLICATE_TARGET') {
    (d.duplicates || []).forEach(x => lines.push((x.target_path || '') + ' × ' + ((x.items || []).length)));
    (d.existing || []).forEach(x => lines.push([x.source_path, x.target_path].filter(Boolean).join(' → ')));
  } else if (code === 'TARGET_NOT_NTFS') {
    lines.push(t('blocked.ntfs', { fs: d.fs || '?' }));
  } else if (d.message) {
    lines.push(String(d.message));
  } else if (d.reason) {
    lines.push(String(d.reason));
  }
  return lines.filter(Boolean);
}

function copyText(text) {
  const fallback = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).then(() => true).catch(fallback);
  }
  return Promise.resolve(fallback());
}

function render() {
  const info = parseRoute();
  state.tab = info.tab; state.sub = info.sub; state.modal = info.modal || '';

function filteredIdes() {
  const q = state.search.trim().toLowerCase();
  return CATALOG.ides.filter(i => {
    if (state.filter === 'c' && i.runtime.migrated) return false;
    if (state.filter === 'migrated' && !i.runtime.migrated) return false;
    if (state.filter === 'running' && !i.runtime.running.length) return false;
    if (!q) return true;
    return i.name.toLowerCase().indexOf(q) >= 0 || i.directories.some(d => d.path.toLowerCase().indexOf(q) >= 0);
  });
}

function itemRow(ide, d, i) {
  const checked = isChecked(ide.id, i, d);
  const badge = d.safety === 'green' ? `<span class="badge b-green">${esc(t('common.green'))}</span>`
    : d.safety === 'red' ? `<span class="badge b-red">⛨ ${esc(t('common.red'))}</span>`
    : `<span class="badge b-amber">? ${esc(t('common.yellow'))}</span>`;
  const left = d.safety === 'red'
    ? `<span class="tcell lockcell"><span class="lock" title="${esc(t('ide.redLocked'))}" aria-label="${esc(t('ide.redLocked'))}">⛨</span></span>`
    : `<span class="tcell lockcell"><input class="row-check" type="checkbox" ${checked ? 'checked' : ''} ${d.safety === 'yellow' && !isConfirmed(ide.id, i) ? 'disabled' : ''} onclick="App.toggleCheck('${ide.id}',${i})" aria-label="${esc(d.path)}"></span>`;
  const confirmed = d.safety === 'yellow' && isConfirmed(ide.id, i);
  const reason = reasonText(d) + (d.safety === 'red' ? ' · ' + t('ide.redLocked') : '');
  const act = d.safety === 'yellow' && !confirmed
    ? `<button type="button" class="btn btn-ghost btn-xs" onclick="App.openYellow('${ide.id}',${i})">${esc(t('action.confirmYellow'))}</button>`
    : confirmed ? `<span class="badge b-gray">${esc(t('common.confirmed'))}</span>`
    : d.handling ? `<span class="tag tag-code">${esc(d.handling)}</span>` : '';
  return `<div class="trow dir risk-${d.safety}" title="${esc(d.path)} · ${esc(reason)}">
    ${left}
    <span class="tcell tpath badged">${badge}<span class="tp" title="${esc(d.path)}">${esc(d.path)}</span></span>
    <span class="tcell tdesc">${esc(reason)}</span>
    <span class="tcell tsize">${fmtBytes(d.size_bytes)}</span>
    <span class="tcell acts">${act}</span>
  </div>`;
}

function scanDisplayStage(stage) {
  if (stage === 'discover') return 'enumerate';
  if (stage === 'measure') return 'size';
  return stage;
}

function renderScanning() {
  const job = state.data.scanJob;
  const bridgeStage = scanStage(job);
  const pct = state.scanning ? (state.scanPct || 0) : (job && job.state === 'done' ? 100 : (job && job.progress && job.progress.done ? 100 : 0));
  const stages = ['enumerate', 'match', 'size', 'process', 'classify', 'done'];
  const active = Math.max(0, stages.indexOf(scanDisplayStage(bridgeStage)));
  return `<div class="content narrow">
    <section class="panel scanning">
      <h3>${esc(t('scan.title'))}</h3>
      <p class="lead">${esc(t('scan.lead'))}</p>
      <div class="progress"><i style="width:${pct}%"></i></div>
      <div class="progress-meta"><span>${esc(t('common.progress'))} · ${pct}%</span><span>${esc(t('meta.scope'))}</span></div>
      <div class="stage-list">
        ${stages.map((s, i) => `<div class="stage ${i < active ? 'done' : i === active ? 'active' : ''}">
          <span class="s-ico">${i < active ? '✓' : ''}</span><span>${esc(t('scan.stage.' + s))}</span>
          <span class="s-meta">${i < active ? esc(t('progress.done')) : i === active ? esc(t('progress.running')) : esc(t('progress.waiting'))}</span>

/* ---------- 规则学习 ---------- */
function aiReady() { return !!state.settings.aiEnabled && state.settings.aiProvider !== 'none' && (!!state.settings.aiKeySet || state.settings.aiProvider === 'relay'); }
function aiModelName() { return state.settings.aiModel || t('ai.modelAuto'); }

function itemReason(it) {
  if (!it) return '';
  const key = it.reason || it.reason_key || '';
  if (key) {
    const label = t(key);
    if (label !== key) return label;
  }
  return it.blocked_reason || key || t('reason.unknown');
}
function safetyBadge(safety) {
  if (safety === 'green') return `<span class="badge b-green">${esc(t('common.green'))}</span>`;
  if (safety === 'red') return `<span class="badge b-red">⛨ ${esc(t('common.red'))}</span>`;
  return `<span class="badge b-amber">? ${esc(t('common.yellow'))}</span>`;
}
function pendingYellowItems() { return allItems().filter(it => it.safety === 'yellow'); }
function learnedRules() {
  const l = state.data.learned;
  return (l && l.items) || [];
}
function learnedItem(rule) {
  return allItems().find(it => it.item_id === rule.item_id) || null;
}

function pendingRow(it) {
  const path = it.source_path || it.rel_path || it.item_id;
  return `<div class="trow pend risk-yellow">
    <span class="tcell tpath badged"><span class="badge b-amber">?</span><span class="tp" title="${esc(path)}">${esc(path)}</span></span>
    <span class="tcell tdesc" title="${esc(it.blocked_reason || '')}">${esc(itemReason(it))}</span>
    <span class="tcell tsize">${fmtBytes(it.bytes || 0)}</span>
    <span class="tcell acts">
      <button type="button" class="btn btn-ghost btn-xs" onclick="App.overrideItem('${esc(it.item_id)}','green')">${esc(t('action.markGreen'))}</button>
      <button type="button" class="btn btn-ghost btn-xs" onclick="App.overrideItem('${esc(it.item_id)}','red')">${esc(t('action.markRed'))}</button>
    </span>
  </div>`;
}

function learnedTable(rows) {
  return `<div class="table-wrap">
    <table class="table">
      <thead><tr>
        <th>${esc(t('rules.path'))}</th><th>${esc(t('rules.appCol'))}</th><th>${esc(t('rules.safety'))}</th><th>${esc(t('common.reason'))}</th><th>${esc(t('rules.matched'))}</th><th>${esc(t('rules.action'))}</th>
      </tr></thead>
      <tbody>
        ${rows.map(r => {
          const it = learnedItem(r);
          const path = it ? (it.source_path || it.rel_path || r.item_id) : r.item_id;
          const tool = it ? (it.tool_name || it.tool_id || '') : '';
          const undo = r.rule_id === 'manual'
            ? `<button type="button" class="btn btn-ghost btn-xs" onclick="App.clearOverride('${esc(r.item_id)}')">${esc(t('action.unmark'))}</button>`
            : '—';
          return `<tr>
            <td class="mono" style="word-break:break-all">${esc(path)}</td>
            <td>${esc(tool || '—')}</td>
            <td>${safetyBadge(r.safety)}</td>
            <td>${esc(r.reason || t('rules.noReason'))}</td>
            <td><span class="tag tag-code">${esc(r.rule_id || '—')}</span></td>
            <td class="acts">${undo}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;
}

  const pending = pendingYellowItems();
  const learned = learnedRules();
  const warnings = (state.data.learned && state.data.learned.warnings) || [];
  return `<div class="content">
   <div class="cols">
    <section class="panel panel-scroll">
      <div class="panel-head"><h2>${esc(t('rules.pending'))}</h2><span class="hint">${esc(t('common.items', { n: pending.length }))}</span></div>
      <div class="panel-body">
        <div class="note dim" style="font-size:var(--fs-meta)">${esc(t('rules.pendingDesc'))}</div>
        <div class="rows scroll-y">
          ${pending.length ? pending.map(pendingRow).join('') : `<div class="empty" style="padding:40px 10px"><p>${esc(t('rules.pendingEmpty'))}</p></div>`}
        </div>
        <div class="banner info"><span class="b-ico">i</span><div>${esc(t('rules.conflict'))}</div></div>
      </div>
    </section>
    <section class="panel panel-scroll">

/* ---------- 弹窗 ---------- */
function modalKind() {
  if (state.data.flow) return state.data.flow.kind;
  const info = parseRoute();
  if (info.modal) return info.modal;
  const subs = ['process-blocked', 'yellow-confirm'];
  return subs.indexOf(info.sub) >= 0 ? info.sub : '';
}

function modalShell(title, sub, body, foot, wide, closeable) {
  return `<div class="modal-head">
      <div><h3>${esc(title)}</h3>${sub ? `<div class="sub">${esc(sub)}</div>` : ''}</div>
      ${closeable === false ? '' : `<button type="button" class="modal-x" onclick="App.closeModal()" aria-label="${esc(t('action.close'))}">✕</button>`}
    </div>
    <div class="modal-body">${body}</div>
    <div class="modal-foot">${foot}</div>`;
}

function renderModal() {
  const kind = modalKind();
  const root = document.getElementById('modal-root');
  if (!kind) { root.innerHTML = ''; return; }
  let html = '';
  if (kind === 'settings') html = modalSettings();
  else if (kind === 'ai') html = modalAi();
  else if (kind === 'feedback') html = modalFeedback();
  else if (kind === 'process-blocked') html = modalBlocked();
  else if (kind === 'yellow-confirm') html = modalYellow();
  else if (kind === 'migrate') html = modalMigrateFlow();
  else if (kind === 'rollback') html = modalRollbackFlow();
  if (!html) { root.innerHTML = ''; return; }
  root.innerHTML = `<div class="modal-mask" onclick="App.closeModal()">
    <div class="modal ${kind === 'process-blocked' || kind === 'settings' || kind === 'ai' || kind === 'migrate' || kind === 'rollback' ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(kind)}" onclick="event.stopPropagation()">${html}</div>
  </div>`;
}

function flowPlanErrorBody(err) {
  const lines = errorDetailLines(err);
  return `<div class="banner danger"><span class="b-ico">✕</span><div><b>${esc(t('blocked.planTitle'))}</b><br>${esc(t('blocked.planDesc'))}</div></div>
    ${errDetailList(lines, 'mt-3')}`;
