function modalMigrateFlow() {
  const f = state.data.flow;
  if (!f) return '';
  const ide = getIde(f.toolId);
  const toolName = (f.plan && f.plan.items && f.plan.items[0] && f.plan.items[0].tool_name) || (ide && ide.name) || f.toolId || '';
  if (f.phase === 'loading') {
    return modalShell(t('preview.title'), t('preview.sub'),
      `<div class="banner info"><span class="b-ico">i</span><div>${esc(t('progress.stage.prepare'))}</div></div>`,
      `<button type="button" class="btn btn-ghost btn-sm" onclick="App.closeFlow()">${esc(t('action.cancel'))}</button>`, true);
  }
  if (f.phase === 'confirm' || f.phase === 'starting') return modalMigrateConfirm(f, ide, toolName);
  if (f.phase === 'progress') return modalMigrateProgress(f, toolName);
  if (f.phase === 'success') return modalMigrateSuccess(f, toolName);
  return modalMigrateFailed(f, toolName);
}

function modalMigrateConfirm(f, ide, toolName) {
  const plan = f.plan || { items: [] };
  const items = plan.items || [];
  const total = plan.total_bytes || 0;
  const need = plan.need_bytes || 0;
  const free = plan.free_bytes || 0;
  const enough = need <= free;
  const yellow = items.filter(it => it.requires_confirm || it.safety === 'yellow');
  const pending = yellow.filter(it => !f.yellowConfirmed[it.item_id]);
  const busy = f.phase === 'starting';
  const reds = ide ? safetyCount(ide, 'red') : 0;
  const rows = items.map(it => `<tr>
      ${pathCell(it.source_path)}
      ${pathCell(it.final_path)}
      <td>${it.safety === 'green' ? `<span class="badge b-green">${esc(t('common.green'))}</span>` : `<span class="badge b-amber">? ${esc(t('common.yellow'))}</span>`}</td>
      <td>${esc(fmtBytes(it.bytes || 0))}</td>
    </tr>`).join('');
  const yellowBlock = yellow.length ? `<div class="banner warn mt-3"><span class="b-ico">△</span><div>
      <div>${esc(t('preview.yellowPending', { n: pending.length }))}</div>
      ${yellow.map(it => `<label style="display:flex;align-items:center;gap:8px;margin-top:6px;font-size:var(--fs-meta)">
        <input type="checkbox" ${f.yellowConfirmed[it.item_id] ? 'checked' : ''} onchange="App.toggleYellowConfirm('${esc(it.item_id)}')">
        <span class="mono yellow-path">${esc(it.source_path)}</span>
      </label>`).join('')}
    </div></div>` : '';
  const redBlock = reds ? `<div class="banner info mt-3"><span class="b-ico">⛨</span><div>${esc(t('preview.willExcludeRedDesc', { n: reds }))}</div></div>` : '';
  const errBlock = f.error ? `<div class="mt-3">${flowPlanErrorBody(f.error)}</div>` : '';
  const body = `
    <div class="kvbar">
      <div class="kv-item"><span class="k">${esc(t('preview.summary'))}</span><span class="v">${esc(t('common.items', { n: items.length }))} · ${esc(fmtBytes(total))}</span></div>
      <div class="kv-item"><span class="k">${esc(t('ide.needSpace'))}</span><span class="v">${esc(fmtBytes(need))}</span></div>
      <div class="kv-item"><span class="k">${esc(t('preview.targetFree'))}</span><span class="v ${enough ? 'ok' : 'warn'}">${esc(fmtBytes(free))} · ${esc(enough ? t('preview.spaceOk') : t('preview.spaceBad'))}</span></div>
    </div>
    <div class="table-wrap mt-3"><table class="table plan-table">
      <colgroup><col style="width:38%"><col style="width:38%"><col style="width:12%"><col style="width:12%"></colgroup>
      <thead><tr><th>${esc(t('preview.from'))}</th><th>${esc(t('preview.to'))}</th><th>${esc(t('common.safety'))}</th><th>${esc(t('common.size'))}</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    ${redBlock}${yellowBlock}
    <div class="banner info mt-3"><span class="b-ico">i</span><div>${esc(t('preview.junction'))}</div></div>
    ${errBlock}`;
  const foot = `<button type="button" class="btn btn-ghost btn-sm" ${busy ? 'disabled' : ''} onclick="App.closeFlow()">${esc(t('preview.back'))}</button>
    <span class="spacer"></span>
    <button type="button" class="btn btn-primary btn-sm" ${busy || pending.length ? 'disabled' : ''} title="${esc(pending.length ? t('preview.yellowPending', { n: pending.length }) : '')}" onclick="App.confirmMigrate()">${esc(t('preview.start'))}</button>`;
  return modalShell(t('preview.title'), toolName + ' · ' + t('preview.sub'), body, foot, true, !busy);
}

function modalMigrateProgress(f, toolName) {
  const job = f.job || {};
  const p = job.progress || {};
  const pct = migratePct(f);
  const done = !!(p.done || job.state === 'done');
  const total = p.items_total || ((f.plan && f.plan.items && f.plan.items.length) || 0);
  const body = `
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div class="progress-meta"><span>${esc(t('progress.percent', { pct: pct }))}</span><span>${esc(t('common.items', { n: (p.items_done || 0) + ' / ' + total }))}</span></div>
    <div class="stage-list mt-3">${stageRows(MIGRATE_STAGES, p.stage || 'prepare', done, 'progress.stage.')}</div>
    <div class="banner warn mt-3"><span class="b-ico">△</span><div>${esc(t('progress.keepOpen'))}</div></div>`;
  const foot = `<span class="note">${esc(t('progress.cancelDisabled'))}</span>`;
  return modalShell(t('progress.title'), toolName, body, foot, true, false);
}

function modalMigrateSuccess(f, toolName) {
  const summary = f.summary || {};
  const plan = f.plan || {};
  const bytes = summary.bytes || plan.total_bytes || 0;
  const results = (summary.items && summary.items.length) ? summary.items : (plan.items || []);
  const values = [];
  results.forEach((it, i) => {
    const suffix = results.length > 1 ? ' ' + (i + 1) : '';
    values.push({ label: t('preview.from') + suffix, value: it.source_path || '' });
    values.push({ label: t('preview.to') + suffix, value: it.target_path || it.final_path || '' });
    values.push({ label: t('history.job') + suffix, value: it.job_id || '' });
  });
  if (!results.length) values.push({ label: t('history.job'), value: f.jobId || '' });
  const body = `
    <div class="banner ok"><span class="b-ico">✓</span><div>${esc(t('success.sub'))}</div></div>
    <div class="kvbar mt-3">
      <div class="kv-item"><span class="k">${esc(t('success.freed'))}</span><span class="v ok">${esc(fmtBytes(bytes))}</span></div>
      <div class="kv-item"><span class="k">${esc(t('success.verified'))}</span><span class="v">${esc(t('success.verifiedValue'))}</span></div>
      <div class="kv-item"><span class="k">${esc(t('success.duration'))}</span><span class="v">${esc(fmtDuration(jobDuration(f.job)))}</span></div>
    </div>
    ${valueList(values, 'mt-3')}
    <div class="note mt-3">${esc(t('success.rollbackable'))}</div>`;
  const foot = `<button type="button" class="btn btn-ghost btn-sm" onclick="App.gotoHistory()">${esc(t('success.viewHistory'))}</button>
    <span class="spacer"></span>
    <button type="button" class="btn btn-primary btn-sm" onclick="App.closeFlow()">${esc(t('success.done'))}</button>`;
  return modalShell(t('success.title'), toolName, body, foot, true);
}

function modalMigrateFailed(f, toolName) {
  const summary = f.summary || {};
  const failed = (summary.items || []).filter(x => !x.ok);
  const err = f.error || {};
  const fromPlan = f.errorScope === 'plan';
  const code = err.code || (failed[0] && failed[0].state) || '';
  const lines = errorDetailLines(err);
  const failedRows = failed.map(it => `<div class="err-item"><span class="e-path">${esc(it.source_path || '')}</span><span class="e-msg">${esc(it.error_message || it.state_label || it.state || '')}</span></div>`).join('');
  const body = `
    <div class="banner danger"><span class="b-ico">✕</span><div>${esc(fromPlan ? t('blocked.planDesc') : t('failed.sub'))}</div></div>
    ${code || lines.length ? `<div class="mt-3">
      ${code ? `<div class="kvbar"><div class="kv-item"><span class="k">${esc(t('failed.code'))}</span><span class="v mono" style="color:#d9363e">${esc(code)}</span></div></div>` : ''}
      ${errDetailList(lines, code ? 'mt-3' : '')}
    </div>` : ''}
    ${failed.length ? `<div class="section-title mt-3"><h3>${esc(t('failed.items'))}</h3><span class="sub">${esc(t('common.items', { n: failed.length }))}</span></div><div class="err-list">${failedRows}</div>` : ''}
    ${fromPlan ? '' : `<div class="banner warn mt-3"><span class="b-ico">△</span><div>${esc(t('failed.sourceSafe'))}<br>${esc(t('failed.suggestion'))}</div></div>`}`;
  const foot = `<button type="button" class="btn btn-ghost btn-sm" onclick="App.closeFlow()">${esc(t('action.close'))}</button>
    <span class="spacer"></span>
    <button type="button" class="btn btn-primary btn-sm" onclick="App.retryMigrate()">${esc(t('failed.retry'))}</button>`;
  return modalShell(t(fromPlan ? 'blocked.planTitle' : 'failed.title'), toolName, body, foot, true);
}

function modalRollbackFlow() {
  const f = state.data.flow;
  if (!f) return '';
  const p = f.preview || {};
  const ide = getIde(f.toolId);
  const toolName = p.tool_name || (ide && ide.name) || f.toolId || '';
  if (f.phase === 'loading') {
    return modalShell(t('rollback.title'), toolName,
      `<div class="banner info"><span class="b-ico">i</span><div>${esc(t('rollback.stage.precheck'))}</div></div>`,
      `<button type="button" class="btn btn-ghost btn-sm" onclick="App.closeFlow()">${esc(t('action.cancel'))}</button>`, true);
  }
  if (f.phase === 'residual') {
    const body = `<div class="banner warn"><span class="b-ico">△</span><div>${esc(t('rollback.residualBody', { size: fmtBytes(p.restore_bytes || 0) }))}</div></div>
      ${valueList([
        { label: t('rollback.source'), value: p.final_path || '' },
        { label: t('rollback.target'), value: p.source_path || '' }
      ], 'mt-3')}`;
    const foot = `<button type="button" class="btn btn-ghost btn-sm" onclick="App.closeFlow()">${esc(t('action.cancel'))}</button>
      <span class="spacer"></span>
      <button type="button" class="btn btn-primary btn-sm" onclick="App.confirmResidual()">${esc(t('rollback.residualConfirm'))}</button>`;
    return modalShell(t('rollback.residualTitle'), toolName, body, foot, true);
  }
  if (f.phase === 'blocked') {
    const code = (f.error && f.error.code) || p.error_code || '';
    const message = (f.error && f.error.detail && f.error.detail.message) || p.error_message || '';
    const detail = f.noticeKey
      ? `<div class="banner info"><span class="b-ico">i</span><div>${esc(t(f.noticeKey))}</div></div>`
      : `<div class="banner danger"><span class="b-ico">✕</span><div>${esc(message || t('blocked.planDesc'))}</div></div>`;
    const body = `${detail}
      ${code ? `<div class="kvbar mt-3"><div class="kv-item"><span class="k">${esc(t('failed.code'))}</span><span class="v mono" style="color:#d9363e">${esc(code)}</span></div></div>` : ''}`;
    const foot = `<button type="button" class="btn btn-primary btn-sm" onclick="App.closeFlow()">${esc(t('blocked.close'))}</button>`;
    return modalShell(t('rollback.blockedTitle'), toolName, body, foot, true);
  }
  if (f.phase === 'confirm' || f.phase === 'starting') {
    const busy = f.phase === 'starting';
    const body = `<div class="note">${esc(t('rollback.desc', { path: p.final_path || '', size: fmtBytes(p.restore_bytes || 0) }))}</div>
      ${valueList([
        { label: t('rollback.source'), value: p.final_path || '' },
        { label: t('rollback.target'), value: p.source_path || '' }
      ], 'mt-3')}
      <div class="banner warn mt-3"><span class="b-ico">△</span><div>${esc(t('rollback.note', { app: toolName }))}</div></div>
      ${f.error ? `<div class="mt-3">${flowPlanErrorBody(f.error)}</div>` : ''}`;
    const foot = `<button type="button" class="btn btn-ghost btn-sm" ${busy ? 'disabled' : ''} onclick="App.closeFlow()">${esc(t('rollback.cancel'))}</button>
      <span class="spacer"></span>
      <button type="button" class="btn btn-primary btn-sm" ${busy ? 'disabled' : ''} onclick="App.startRollback()">${esc(t('rollback.confirm'))}</button>`;
    return modalShell(t('rollback.title'), toolName, body, foot, true, !busy);
  }
  if (f.phase === 'progress') {
    const job = f.job || {};
    const pr = job.progress || {};
    const pct = rollbackPct(f);
    const done = job.state === 'done' || pr.stage === 'done';
    const body = `
      <div class="progress"><i style="width:${pct}%"></i></div>
      <div class="progress-meta"><span>${esc(t('progress.percent', { pct: pct }))}</span><span>${esc(t('common.progress'))}</span></div>
      <div class="stage-list mt-3">${stageRows(ROLLBACK_STAGES, pr.stage || 'precheck', done, 'rollback.stage.')}</div>
      <div class="banner warn mt-3"><span class="b-ico">△</span><div>${esc(t('rollback.progressKeepOpen'))}</div></div>`;
    return modalShell(t('rollback.progressTitle'), toolName, body, `<span class="note">${esc(t('progress.cancelDisabled'))}</span>`, true, false);
  }
  if (f.phase === 'success') {
    const s = f.summary || {};
    const body = `<div class="banner ok"><span class="b-ico">✓</span><div>${esc(t('rollback.successSub'))}</div></div>
      <div class="kvbar mt-3">
        <div class="kv-item"><span class="k">${esc(t('success.duration'))}</span><span class="v">${esc(fmtDuration(jobDuration(f.job)))}</span></div>
      </div>
      ${valueList([
        { label: t('rollback.target'), value: s.source_path || p.source_path || '' },
        { label: t('rollback.source'), value: s.final_path || p.final_path || '' },
        { label: t('history.job'), value: s.job_id || f.jobId || '' }
      ], 'mt-3')}`;
    const foot = `<button type="button" class="btn btn-ghost btn-sm" onclick="App.gotoHistory()">${esc(t('success.viewHistory'))}</button>
      <span class="spacer"></span>
      <button type="button" class="btn btn-primary btn-sm" onclick="App.closeFlow()">${esc(t('action.done'))}</button>`;
    return modalShell(t('rollback.successTitle'), toolName, body, foot, true);
  }
  const s = f.summary || {};
  const err = f.error || {};
  const code = err.code || s.error_code || '';
  const message = (err.detail && err.detail.message) || s.error_message || '';
  const lines = errorDetailLines(err);
  const body = `<div class="banner danger"><span class="b-ico">✕</span><div>${esc(message || t('failed.sub'))}</div></div>
    ${code || lines.length ? `<div class="mt-3">
      ${code ? `<div class="kvbar"><div class="kv-item"><span class="k">${esc(t('failed.code'))}</span><span class="v mono" style="color:#d9363e">${esc(code)}</span></div></div>` : ''}
      ${errDetailList(lines, code ? 'mt-3' : '')}
    </div>` : ''}`;
  const foot = `<button type="button" class="btn btn-primary btn-sm" onclick="App.closeFlow()">${esc(t('action.close'))}</button>`;
  return modalShell(t('rollback.failedTitle'), toolName, body, foot, true);
}

/* ---------- 交互动作 ---------- */
const App = {
  go(hash) {
    if (location.hash === hash) { render(); return; }
    location.hash = hash;
  },
  nav(tab) {
    state.returnHash = '';
    this.go('#' + tab);
  },
  openModal(kind) {
    const activeKind = modalKind();
    if (!activeKind) state.returnHash = location.hash || '#ide';
    this.go('#' + kind);
  },
  closeModal() {
    if (state.data.flow) { this.closeFlow(); return; }
    state.aiAsk = false;
    const back = state.returnHash;
    state.returnHash = '';
    this.go(back && back !== location.hash ? back : '#ide');
  },
  toggleLang() {
    this.setLang(LANG === 'zh-CN' ? 'en' : 'zh-CN');
  },
  setLang(lang) {
    if (lang !== 'en' && lang !== 'zh-CN') return;
    LANG = lang;
    try { localStorage.setItem('dw-lang', lang); } catch (e) {}
    render();
    rpc('settings.set', { language: lang }).catch(() => {});
  },
  toggleSetting(key) {
    const root = document.getElementById('settings-root');
    if (root) state.settings.targetRoot = root.value;
    state.settings[key] = !state.settings[key];
    render();
  },
  saveSettings() {
    const root = document.getElementById('settings-root');
    const un = document.getElementById('settings-uninstall');
    const rootVal = root ? (root.value.trim() || state.settings.targetRoot) : state.settings.targetRoot;
    const uninstall = un ? un.value : state.settings.uninstall;
    const patch = {
      launch_at_startup: !!state.settings.autoStart,
      auto_maintenance: !!state.settings.autoMaintenance,
      uninstall_policy: uninstall === 'remove' ? 'rollback' : uninstall
    };
    if (rootVal && normPath(rootVal) !== normPath(state.settings.targetRoot)) patch.target_root = rootVal;
    rpc('settings.set', patch).then(s => {
      applySettings(s);
      this.toast(t('settings.saved'));
      this.closeModal();
    }).catch(err => this.toast(errText(err)));
  },
  reconnect() {
    bootstrap();
  },
  rescan() {
    if (state.scanning) { this.go('#ide/scanning'); return; }
    rpc('scan.start').then(res => {
      const jobId = res && res.job_id;
      state.scanning = true;
      state.data.scanError = '';
      state.scanPct = 3;
      state.data.scanJob = jobId ? { job_id: jobId, state: (res && res.state) || 'queued' } : null;
      this.go('#ide/scanning');
      if (jobId) startScanPolling(jobId);
    }).catch(err => {
      if (err && err.code === 'BUSY') {
        rpc('job.list', { active_only: true }).then(list => {
          const job = list && list.jobs && list.jobs[0];
          if (job && job.kind === 'scan') {
            state.scanning = true;
            state.data.scanJob = job;
            state.scanPct = scanPercent(job);
            this.go('#ide/scanning');
            startScanPolling(job.job_id);
            return;
          }
          this.toast(errText(err));
        }).catch(() => this.toast(errText(err)));
        return;
      }
      this.toast(errText(err));
    });
  },
  cancelScan() {
    const job = state.data.scanJob;
    if (!job || !job.job_id) return;
    rpc('scan.cancel', { job_id: job.job_id }).then(j => {
      if (j) state.data.scanJob = j;
      render();
    }).catch(err => this.toast(errText(err)));
  },
  search(value) {
    state.search = value;
    const list = filteredIdes();
    const el = document.querySelector('.ide-bar');
    if (!el) return;
    el.innerHTML = list.length
      ? list.map(i => ideRow(i)).join('')
      : `<div class="note dim" style="padding:10px 2px">${esc(t('ide.listEmpty'))}</div>`;
  },
  setFilter(filter) {
    state.filter = filter;
    render();
  },
  selectIde(id) {
    state.selectedIde = id;
    render();
  },
  toggleCheck(ideId, idx) {
    const ide = getIde(ideId);
    const dir = ide.directories[idx];
    if (!dir || dir.safety === 'red' || dir.can_migrate === false) return;
    if (dir.safety === 'yellow' && !isConfirmed(ideId, idx)) return;
    if (dir.item_id) {
      state.checked[dir.item_id] = !state.checked[dir.item_id];
    } else {
      state.checked[ideId] = state.checked[ideId] || {};
      state.checked[ideId][idx] = !state.checked[ideId][idx];
    }
    render();
  },
  openYellow(ideId, idx) {
    state.selectedIde = ideId;
    state.pendingYellow = { ide: ideId, idx: idx };
    state.returnHash = '#ide';
    this.go('#ide/yellow-confirm');
  },
  confirmYellow(action) {
    const py = state.pendingYellow;
    if (!py) { this.go('#ide'); return; }
    const ide = getIde(py.ide);
    const dir = ide.directories[py.idx];
    state.selectedIde = ide.id;
    if (!dir) { state.pendingYellow = null; this.go('#ide'); return; }
    if (action === 'later') {
      state.pendingYellow = null;
      this.go('#ide');
      return;
    }
    if (!dir.item_id) {
      state.pendingYellow = null;
      this.go('#ide');
      this.toast(t('rules.overrideFailed'));
      return;
    }
    state.pendingYellow = null;
    this.go('#ide');
    this.overrideItem(dir.item_id, action);
  },
  overrideItem(itemId, safety) {
    if (!itemId || (safety !== 'green' && safety !== 'red')) return;
    if (!this._overriding) this._overriding = {};
    if (this._overriding[itemId]) return;
    this._overriding[itemId] = true;
    rpc('rules.override', { item_id: itemId, safety: safety }).then(() => {
      return Promise.all([rpc('scan.result'), rpc('rules.learned.list')]);
    }).then(res => {
      delete this._overriding[itemId];
      const snap = res && res[0];
      if (snap) setSnapshot(snap);
      if (res && res[1]) state.data.learned = res[1];
      render();
      this.toast(t(safety === 'green' ? 'rules.markedGreen' : 'rules.markedRed'));
    }).catch(err => {
      delete this._overriding[itemId];
      this.toast(errText(err));
    });
  },
  clearOverride(itemId) {
    if (!itemId) return;
    if (!this._clearing) this._clearing = {};
    if (this._clearing[itemId]) return;
    this._clearing[itemId] = true;
    rpc('rules.override.clear', { item_id: itemId }).then(() => {
      return Promise.all([rpc('scan.result'), rpc('rules.learned.list')]);
    }).then(res => {
      delete this._clearing[itemId];
      const snap = res && res[0];
      if (snap) setSnapshot(snap);
      if (res && res[1]) state.data.learned = res[1];
      render();
      this.toast(t('rules.unmarked'));
    }).catch(err => {
      delete this._clearing[itemId];
      const reason = err && err.code === 'NOT_FOUND' ? t('rules.unmarkGone') : errText(err);
      this.toast(t('rules.unmarkFailed', { reason: reason }));
    });
  },
  openIssue() {
    if (this._openingIssue) return;
    this._openingIssue = true;
    rpc('app.open_external', { url: ISSUE_URL }).then(() => {
      delete this._openingIssue;
      this.toast(t('feedback.issueOpened'));
    }).catch(err => {
      delete this._openingIssue;
      const reason = err && err.code === 'IO_ERROR' ? t('feedback.browserFailed') : errText(err);
      this.toast(t('feedback.openFailed', { reason: reason }));
    });
  },
  startPreview(ideId) {
    const ide = getIde(ideId);
    state.selectedIde = ide.id;
    if (!selectedDirs(ide).length) { this.toast(t('toast.needSelect')); return; }
    state.returnHash = '#ide';
    if (ide.runtime.running.length) { this.go('#ide/process-blocked'); return; }
    if (!spaceOk(ide)) { this.toast(t('toast.spaceShort')); return; }
    this._beginMigrate(ideId);
  },
  refreshDisk() {
    rpc('disk.info').then(disk => {
      applyDisk(disk || null);
      render();
    }).catch(err => this.toast(errText(err)));
  },
  openRollback(ideId) {
    this.rollbackTool(ideId);
  },
  startMigrate(ideId) {
    this._beginMigrate(ideId);
  },
  _beginMigrate(ideId, skipRunningCheck) {
    const ide = getIde(ideId);
    const dirs = selectedDirs(ide);
    const items = dirs.filter(d => d.item_id);
    if (!ide || !items.length) { this.toast(t('toast.noGreen')); return; }
    if (!skipRunningCheck && ide.runtime.running.length) { this.toast(t('toast.blocked')); return; }
    if (!spaceOk(ide)) { this.toast(t('toast.spaceShort')); return; }
    if (!state.data.flow) state.returnHash = state.returnHash || location.hash || '#ide';
    state.data.flow = {
      kind: 'migrate', phase: 'loading', toolId: ideId,
      plan: null, yellowConfirmed: {}, error: null, errorScope: '',
      jobId: null, runnerJobId: null, job: null, summary: null
    };
    if (location.hash === '#ide/migrate-preview') render(); else this.go('#ide/migrate-preview');
    rpc('plan.preview', {
      item_ids: items.map(d => d.item_id),
      confirmed_item_ids: items.filter(d => !!state.confirmed['item:' + d.item_id]).map(d => d.item_id)
    }).then(plan => {
      const f = state.data.flow;
      if (!f || f.kind !== 'migrate' || f.toolId !== ideId) return;
      f.plan = plan || {};
      f.phase = 'confirm';
      render();
    }).catch(err => {
      const f = state.data.flow;
      if (!f || f.kind !== 'migrate' || f.toolId !== ideId) return;
      f.phase = 'failed';
      f.errorScope = 'plan';
      f.error = err;
      render();
    });
  },
  toggleYellowConfirm(itemId) {
    const f = state.data.flow;
    if (!f || f.kind !== 'migrate') return;
    if (f.yellowConfirmed[itemId]) delete f.yellowConfirmed[itemId];
    else f.yellowConfirmed[itemId] = true;
    render();
  },
  confirmMigrate() {
    const f = state.data.flow;
    if (!f || f.kind !== 'migrate' || f.phase !== 'confirm' || !f.plan) return;
    const plan = f.plan;
    const all = plan.items || [];
    const isYellow = it => !!(it.requires_confirm || it.safety === 'yellow');
    const accepted = all.filter(it => !isYellow(it) || f.yellowConfirmed[it.item_id]);
    const acceptedYellow = accepted.filter(isYellow).map(it => it.item_id);
    if (!accepted.length) { this.toast(t('toast.noGreen')); return; }
    f.phase = 'starting';
    f.error = null;
    render();
    const preview = accepted.length === all.length
      ? Promise.resolve(plan)
      : rpc('plan.preview', { item_ids: accepted.map(it => it.item_id), confirmed_item_ids: acceptedYellow });
    preview.then(fresh => {
      const cur = state.data.flow;
      if (!cur || cur.kind !== 'migrate') return null;
      cur.plan = fresh || cur.plan;
      return rpc('migrate.start', {
        plan_id: cur.plan.plan_id,
        confirm_token: cur.plan.confirm_token,
        confirmed_item_ids: acceptedYellow
      });
    }).then(res => {
      const cur = state.data.flow;
      if (!cur || cur.kind !== 'migrate' || !res) return;
      cur.phase = 'progress';
      cur.jobId = res.job_id;
      cur.runnerJobId = res.job_id;
      cur.job = { job_id: res.job_id, state: res.state || 'queued', progress: {} };
      render();
      startFlowPolling('migrate', res.job_id);
    }).catch(err => {
      const cur = state.data.flow;
      if (!cur || cur.kind !== 'migrate') return;
      cur.phase = 'failed';
      cur.errorScope = 'plan';
      cur.error = err;
      render();
    });
  },
  rollbackTool(ideId) {
    const ide = getIde(ideId);
    const it = ide.directories.filter(d => !!d.migrated_job_id)[0];
    if (!it) { this.toast(t('history.noRollback')); return; }
    if (ide.runtime.running.length) { this.toast(t('toast.blocked')); return; }
    this._openRollback(it.migrated_job_id);
  },
  historyRollback(id) {
    const h = HISTORY.find(x => x.id === id);
    if (!h) return;
    this._openRollback(h.job_id || h.id);
  },
  _openRollback(jobId) {
    if (!jobId) { this.toast(t('history.noRollback')); return; }
    if (!state.data.flow) state.returnHash = state.tab === 'history' ? '#history' : (location.hash || '#ide');
    state.data.flow = {
      kind: 'rollback', phase: 'loading', jobId: jobId, runnerJobId: null,
      preview: null, error: null, noticeKey: '', job: null, summary: null
    };
    if (location.hash === '#ide/rollback-confirm') render(); else this.go('#ide/rollback-confirm');
    this._previewRollback(false);
  },
  confirmResidual() {
    this._previewRollback(true);
  },
  _previewRollback(confirmResidual) {
    const f = state.data.flow;
    if (!f || f.kind !== 'rollback') return;
    const jobId = f.jobId;
    f.phase = 'loading';
    f.error = null;
    render();
    rpc('rollback.preview', {
      job_id: jobId,
      confirm_residual_delete: !!confirmResidual
    }).then(p => {
      const cur = state.data.flow;
      if (!cur || cur.kind !== 'rollback' || cur.jobId !== jobId) return;
      cur.preview = p || {};
      if (p && p.tool_id) cur.toolId = p.tool_id;
      if (!p || !p.can_proceed) {
        cur.phase = 'blocked';
        cur.noticeKey = p && p.mode === 'already_rolled_back' ? 'rollback.alreadyDone' : '';
        cur.error = cur.noticeKey ? null : {
          code: (p && p.error_code) || 'PRECHECK_FAILED',
          detail: { message: (p && p.error_message) || '' }
        };
        render();
        return;
      }
      cur.phase = p.requires_residual_confirm ? 'residual' : 'confirm';
      render();
    }).catch(err => {
      const cur = state.data.flow;
      if (!cur || cur.kind !== 'rollback' || cur.jobId !== jobId) return;
      cur.phase = 'blocked';
      cur.noticeKey = '';
      cur.error = err;
      render();
    });
  },
  startRollback() {
    const f = state.data.flow;
    if (!f || f.kind !== 'rollback' || f.phase !== 'confirm') return;
    const p = f.preview || {};
    if (!p.plan_id || !p.confirm_token) { this.toast(t('toast.blocked')); return; }
    f.phase = 'starting';
    f.error = null;
    render();
    rpc('rollback.start', { plan_id: p.plan_id, confirm_token: p.confirm_token }).then(res => {
      const cur = state.data.flow;
      if (!cur || cur.kind !== 'rollback' || !res) return;
      cur.phase = 'progress';
      cur.runnerJobId = res.job_id;
      cur.job = { job_id: res.job_id, state: res.state || 'queued', progress: {} };
      render();
      startFlowPolling('rollback', res.job_id);
    }).catch(err => {
      const cur = state.data.flow;
      if (!cur || cur.kind !== 'rollback') return;
      cur.phase = 'failed';
      cur.error = err;
      render();
    });
  },
  closeFlow() {
    if (flowBusy()) return;
    const back = state.returnHash || ('#' + (state.tab || 'ide'));
    state.returnHash = '';
    closeFlow();
    this.go(back);
  },
  gotoHistory() {
    stopFlowPolling();
    state.data.flow = null;
    state.returnHash = '';
    this.nav('history');
  },
  recoveryStart(jobId, action) {
    if (!jobId) return;
    if (action !== 'recover' && action !== 'rollback') return;
    const run = state.data.recoveryRun;
    if (run && (run.phase === 'starting' || run.phase === 'progress')) return;
    if (flowBusy()) { this.toast(t('toast.blocked')); return; }
    const item = recoveryItems().find(x => x.job_id === jobId) || {};
    state.data.recoveryRun = {
      targetJobId: jobId, sourcePath: item.source_path || '', action: action,
      phase: 'starting', runnerJobId: null, job: null, summary: null, error: null
    };
    render();
    rpc('recovery.run', { job_id: jobId, action: action }).then(res => {
      const cur = state.data.recoveryRun;
      if (!cur || cur.targetJobId !== jobId || cur.action !== action) return;
      cur.runnerJobId = res && res.job_id;
      cur.phase = 'progress';
      cur.job = { job_id: cur.runnerJobId, state: (res && res.state) || 'queued', progress: {} };
      render();
      if (cur.runnerJobId) startRecoveryPolling(cur.runnerJobId);
    }).catch(err => {
      const cur = state.data.recoveryRun;
      if (!cur || cur.targetJobId !== jobId) return;
      cur.phase = 'failed';
      cur.error = err;
      render();
    });
  },
  retryRecovery() {
    const run = state.data.recoveryRun;
    if (!run || run.phase === 'starting' || run.phase === 'progress') return;
    this.recoveryStart(run.targetJobId, run.action);
  },
  dismissRecovery() {
    stopRecoveryPolling();
    state.data.recoveryRun = null;
    render();
  },
  retryMigrate() {
    const f = state.data.flow;
    if (!f || f.kind !== 'migrate') { this._beginMigrate(state.selectedIde); return; }
    this._beginMigrate(f.toolId);
  },
  recheckProcess() {
    this._beginMigrate(state.selectedIde, true);
  },
  showForceWarn() {
    this.toast(t('blocked.forceWarn'));
  },
  selectHistory(id) {
    state.selectedHistory = id;
    render();
  },
  setHistoryFilter(filter) {
    state.historyFilter = filter;
    const current = HISTORY.find(x => x.id === state.selectedHistory);
    const visible = filter === 'all' || (current && current.type === filter);
    if (!visible) {
      const first = HISTORY.find(x => filter === 'all' || x.type === filter);
      if (first) state.selectedHistory = first.id;
    }
    render();
  },
  exportHistory() {
    const items = HISTORY.filter(h => state.historyFilter === 'all' || h.type === state.historyFilter);
    if (!items.length) { this.toast(t('history.exportEmpty')); return; }
    try {
      const blob = new Blob([JSON.stringify(items, null, 2)], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'disk-warden-history-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      this.toast(t('history.exported'));
    } catch (e) {
      this.toast(t('history.exportFailed'));
    }
  },
  rollbackHistory(id) {
    const h = HISTORY.find(x => x.id === id);
    if (!h || !h.canRollback) return;
    state.selectedHistory = h.id;
    const ide = CATALOG.ides.find(x => x.name === h.app);
    if (ide) state.selectedIde = ide.id;
    this.historyRollback(id);
  },
  toggleAi() {
    const ai = (state.settings && state.settings.ai) || {};
    if (ai.enabled) {
      rpc('settings.set', { ai: { enabled: false } }).then(s => {
        applySettings(s);
        state.aiAsk = false;
        render();
        this.toast(t('ai.statusOff'));
      }).catch(err => this.toast(errText(err)));
      return;
    }
    state.aiAsk = true;
    render();
  },
  cancelAiAsk() {
    state.aiAsk = false;
    render();
  },
  confirmAiEnable() {
    state.aiAsk = false;
    render();
    rpc('ai.consent').then(() => rpc('settings.set', { ai: { enabled: true } })).then(s => {
      applySettings(s);
      render();
      this.toast(t('ai.consentDone'));
    }).catch(err => {
      render();
      this.toast(errText(err));
    });
  },
  saveAi() {
    const val = (id) => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
    const provider = val('ai-provider') || state.settings.aiProvider;
    const patch = {
      enabled: provider !== 'none' && !!state.settings.aiEnabled,
      base_url: provider === 'custom' ? val('ai-base') : '',
      model: val('ai-model') || state.settings.aiModel
    };
    rpc('settings.set', { ai: patch }).then(s => {
      applySettings(s);
      this.toast(t('toast.saved'));
      this.closeModal();
    }).catch(err => this.toast(errText(err)));
  },
  aiTest() {
    this.toast(t('ai.testUnavailable'));
  },
  copyDiagnostics() {
    copyText(diagnosticsText()).then(ok => {
      this.toast(t(ok ? 'feedback.copied' : 'toast.copyFailed'));
    });
  },
  copyValue(btn) {
    const box = btn.closest('.val-item, .cell-val');
    const el = box && box.querySelector('.e-path, .mono');
    const text = el ? el.textContent : '';
    if (!text) return;
    copyText(text).then(ok => {
      this.toast(t(ok ? 'common.copied' : 'toast.copyFailed'));
    });
  },
  openPath(path) {
    const fail = (reason) => this.toast(t('toast.openFailedReason', { reason: reason || t('error.INTERNAL') }));
    if (!path) { fail(t('error.NO_PATH')); return; }
    rpc('app.reveal', { path: String(path) }).then(res => {
      /* 主机端返回展开后的真实路径：提示里报出它，用户才知道资源管理器停在了哪儿 */
      this.toast(res && res.path ? t('toast.openedPath', { path: res.path }) : t('toast.opened'));
    }).catch(err => fail(errText(err)));
  },
  openIdeFolder(ideId) {
    const ide = getIde(ideId);
    this.openPath((ide.runtime && ide.runtime.root) || '');
  },
  openDiskLocation(categoryId) {
    this.openPath(DISK_LOCATIONS[categoryId] || '');
  },
  toast(message) {
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = message;
    el.classList.add('show');
    clearTimeout(state.toastTimer);
    state.toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
  }
};

/* ---------- 初始化 ---------- */
function init() {
  let saved = null;
  try { saved = localStorage.getItem('dw-lang'); } catch (e) {}
  const query = new URLSearchParams(location.search).get('lang');
  const initial = query || saved;
  if (initial === 'en' || initial === 'zh-CN') LANG = initial;

  if (!location.hash) {
    try { history.replaceState(null, '', location.pathname + location.search + '#projects'); }
    catch (e) { location.hash = 'projects'; }
  }

  window.addEventListener('hashchange', render);
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (modalKind()) App.closeModal();
  });

  render();
  bootstrap();
}

init();
</script>
