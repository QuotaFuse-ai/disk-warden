name: ui-tour

# 每个提交都把「所有页面 × 3 个窗口宽度 × 明暗 × 中英」截图出来，
# 不用装包、不用 Windows、不用客户端：见 docs/tasks/TASK-UITOUR-001/README.md
on:
  workflow_dispatch:
  push:
    paths:
      - "ui/**"
      - "tools/uitour/**"
      - "packaging/requirements-ci.txt"
      - ".github/workflows/ui-tour.yml"
  pull_request:
    paths:
      - "ui/**"
      - "tools/uitour/**"
      - "packaging/requirements-ci.txt"
      - ".github/workflows/ui-tour.yml"

concurrency:
  group: ui-tour-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shots:
    name: 页面截图矩阵（ubuntu + chromium）
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 中文字体必须在截图前装好，否则 zh-CN 的图全是方框。
      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      # Playwright 只装在 CI 里（packaging/requirements-ci.txt），
      # 不进 requirements-build.txt，也不进 PyInstaller spec。
      - name: Install tour dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements-ci.txt
          python -m playwright install --with-deps chromium

      - name: List pages
        run: python -m tools.uitour --list-pages

      - name: Render every page
        run: |
          python -m tools.uitour --out dist/uitour --summary "$GITHUB_STEP_SUMMARY"

      # 失败也上传，坏的截图才是排查素材。
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-tour
          path: dist/uitour
          if-no-files-found: warn
          retention-days: 30

  mac-preview:
    name: macOS 真机出图（尽力而为，不阻塞构建）
    # 只证明「画得出来」，不参与验收：跑不起来就让 job 变黄，不影响其他 job。
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pywebview==6.1 psutil==7.2.2

      - name: Launch app and capture frames
        run: |
          mkdir -p dist/uitour-mac
          python -m src.app.main > dist/uitour-mac/app.log 2>&1 &
          APP_PID=$!
          # macOS runner 有登录会话，但没有真实显示器；
          # screencapture 可能拿到黑屏或直接失败，所以每帧都 `|| true`。
          for i in 1 2 3; do
            sleep 8
            screencapture -x "dist/uitour-mac/mac-frame-$i.png" || true
          done
          kill "$APP_PID" 2>/dev/null || true
          ls -l dist/uitour-mac || true

      - name: Upload macOS frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-tour-mac
          path: dist/uitour-mac
          if-no-files-found: ignore
          retention-days: 14
